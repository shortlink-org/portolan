name: Portolan architecture catalog
description: Generate, verify, build, or review a Portolan architecture catalog.
author: shortlink-org

branding:
  icon: map
  color: blue

inputs:
  command:
    description: One of generate, check, build, or diff.
    required: false
    default: check
  version:
    description: Published @shortlink-org/portolan version to run.
    required: false
    default: latest
  working-directory:
    description: Project directory containing portolan.json.
    required: false
    default: .
  node-version:
    description: Node.js version used by the CLI.
    required: false
    default: "24"
  go-version:
    description: Go version used by built-in Go extractors.
    required: false
    default: "1.27"
  java-version:
    description: Java version used by the built-in Java extractor.
    required: false
    default: "21"
  output:
    description: Static-site output directory for the build command.
    required: false
    default: dist
  base:
    description: URL base for the build command.
    required: false
    default: /
  base-ref:
    description: Git ref to compare against for the diff command.
    required: false
    default: origin/main
  site:
    description: Published catalog URL linked from the diff report.
    required: false
    default: ""
  head-ref:
    description: Head branch linked from the diff report.
    required: false
    default: ""
  diff-output:
    description: Markdown output path for the diff command.
    required: false
    default: .portolan/diff.md
  sarif-output:
    description: Optional SARIF output path for the diff command.
    required: false
    default: ""
  comment:
    description: Post or update the architecture diff on the pull request.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Run Portolan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PORTOLAN_COMMAND: ${{ inputs.command }}
        PORTOLAN_VERSION: ${{ inputs.version }}
        PORTOLAN_OUTPUT: ${{ inputs.output }}
        PORTOLAN_BASE: ${{ inputs.base }}
        PORTOLAN_BASE_REF: ${{ inputs.base-ref }}
        PORTOLAN_SITE: ${{ inputs.site }}
        PORTOLAN_HEAD_REF: ${{ inputs.head-ref }}
        PORTOLAN_DIFF_OUTPUT: ${{ inputs.diff-output }}
        PORTOLAN_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        PORTOLAN_COMMENT: ${{ inputs.comment }}
      run: |
        case "$PORTOLAN_COMMAND" in
          generate|check)
            npm exec --yes --package="@shortlink-org/portolan@$PORTOLAN_VERSION" -- portolan "$PORTOLAN_COMMAND"
            ;;
          build)
            npm exec --yes --package="@shortlink-org/portolan@$PORTOLAN_VERSION" -- portolan build --output "$PORTOLAN_OUTPUT" --base "$PORTOLAN_BASE"
            ;;
          diff)
            args=("$PORTOLAN_BASE_REF" --output "$PORTOLAN_DIFF_OUTPUT")
            if [ -n "$PORTOLAN_SITE" ]; then args+=(--site "$PORTOLAN_SITE"); fi
            if [ -n "$PORTOLAN_HEAD_REF" ]; then args+=(--head "$PORTOLAN_HEAD_REF"); fi
            npm exec --yes --package="@shortlink-org/portolan@$PORTOLAN_VERSION" -- portolan diff "${args[@]}"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$PORTOLAN_DIFF_OUTPUT" >> "$GITHUB_STEP_SUMMARY"; fi
            if [ "$PORTOLAN_COMMENT" = "true" ]; then
              npm exec --yes --package="@shortlink-org/portolan@$PORTOLAN_VERSION" -- portolan comment "$PORTOLAN_DIFF_OUTPUT"
            fi
            if [ -n "$PORTOLAN_SARIF_OUTPUT" ]; then
              npm exec --yes --package="@shortlink-org/portolan@$PORTOLAN_VERSION" -- portolan diff "$PORTOLAN_BASE_REF" --format sarif --output "$PORTOLAN_SARIF_OUTPUT"
            fi
            ;;
          *)
            echo "Portolan action: command must be generate, check, build, or diff" >&2
            exit 2
            ;;
        esac
