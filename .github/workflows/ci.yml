name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25.0.5+8.0.LTS"

      - run: npm ci
      - run: npx vitest run scripts/local-api.test.mjs scripts/manifest.test.mjs scripts/plugin-host.test.mjs scripts/mcp-server.test.mjs
      - run: npm run test:package
      - run: npm run plugins:build
      - run: npm pack --dry-run --ignore-scripts
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: portolan:ci
      - run: docker run --rm --entrypoint go portolan:ci version
      - run: docker run --rm --network none --entrypoint sh portolan:ci -c 'cd /opt/portolan && go build -mod=mod -o /tmp/portolan-http-clients ./plugins/cmd/portolan-http-clients'
