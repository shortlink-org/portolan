name: Release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: node -e 'const expected=require("./package.json").version; if(process.env.TAG!==expected){console.error(`tag ${process.env.TAG} does not match ${expected}`); process.exit(1)}'

      - run: npx vitest run scripts/local-api.test.mjs scripts/manifest.test.mjs scripts/plugin-host.test.mjs
      - run: npm run test:package
      - run: npm run plugins:build
      - run: npm pack --dry-run --ignore-scripts

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  container:
    needs: npm
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  notes:
    needs: [npm, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write architecture changes into the release
        env:
          TAG: ${{ github.ref_name }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -z "$previous" ]; then
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
            exit 0
          fi
          node scripts/diff.mjs "$previous" --site "$SITE" --head "$TAG" --output .portolan/release.md
          cat .portolan/release.md >> "$GITHUB_STEP_SUMMARY"
          node scripts/forge-release.mjs .portolan/release.md "$TAG"
