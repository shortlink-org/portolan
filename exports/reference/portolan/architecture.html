 the aggregate list but\n`how do I build this, test it, run it`. The README answers that sometimes; the\nrunner files answer it always, and they are already in the tree. `extract-commands`\nreads them and puts the answer on the service as a list of commands - the line\nto type, what the file says it is for, what the runner would execute, and where\nit was read.\n\n| File | Runner | Line to type | Description read from |\n| --- | --- | --- | --- |\n| `Makefile` | make | `make \u003ctarget\u003e` | `## comment` on the target's line, else the `#` block over it |\n| `justfile` | just | `just \u003crecipe\u003e` | `[doc(\"...\")]`, else the `#` block over it |\n| `Taskfile.yml` | task | `task \u003cname\u003e` | `desc`, else `summary` |\n| `package.json` `scripts` | npm, or pnpm/yarn/bun by the lockfile | `npm run \u003cname\u003e`; `npm test`, `npm start` | nothing - the script line is the body |\n| `pyproject.toml` | poe (`[tool.poe.tasks]`), pdm (`[tool.pdm.scripts]`) | `poe \u003cname\u003e`, `pdm run \u003cname\u003e` | `help` |\n| `pom.xml` | mvn, or `./mvnw` when the wrapper is there | `mvn test`, `mvn package`, and the goals of declared plugins: `spring-boot:run`, `quarkus:dev`, `flyway:migrate`, … | the goal's own purpose |\n| `build.gradle(.kts)` | gradle, or `./gradlew` | `gradle build`, `gradle test`; `run` with the application plugin, `bootRun` with Spring Boot; every `tasks.register(\"...\")` | the task's `description` |\n| `.cargo/config.toml` | cargo | `cargo \u003calias\u003e` for each `[alias]`; when one runs the `xtask` package, `cargo xtask \u003csub\u003e` for each subcommand of its `main.rs` | `///` over a clap variant, `//` over a match arm |\n\nLeft out, because the runner leaves them out too: `_`-prefixed and `[private]`\nentries, `internal` tasks, make's special and pattern targets (`.PHONY`, `%.o`),\ntargets spelled through a variable, and `pre`/`post` hooks of a script that is\nitself listed. `[project.scripts]` in a pyproject is not read: those are\nprograms the package installs, not tasks a developer runs. `uv` has no task\nsection and Go has no runner of its own, so a repository with only those\ndeclares no commands.\n\nMaven and Gradle are the other way round: the build is the runner, and what\na project declares is which plugins extend it. So a pom lists the two\nlifecycle phases every pom answers to, `test` and `package`, and then the\ngoals a person types that its `\u003cbuild\u003e\u003cplugins\u003e` add - `spring-boot:run` for\nthe Spring Boot plugin, `flyway:migrate` for Flyway - from a short table of\nthe plugins an estate meets. A plugin bound to a phase, like protobuf\ngeneration, is run by the phase and is not listed; neither is one under\n`\u003cpluginManagement\u003e`, which pins a version and runs nothing. A Gradle script\nlists `build` and `test`, `run` when it applies the application plugin,\n`bootRun` for Spring Boot, and every task it registers itself, with the\ndescription it sets. The script is read as text, not run: a task registered\nin a loop or by an unnamed plugin is not here.\n\nCargo declares commands in one place, `[alias]` in `.cargo/config.toml`, and\nthe xtask convention is an alias that runs a package: `xtask = \"run --package\nxtask --\"`. Each alias is a command with its expansion as the body, and when\nthe expansion runs a package and leaves the subcommand to the caller, that\npackage's `main.rs` is read for the subcommands - the variants of a clap enum\nderiving `Subcommand`, in kebab-case, with their `///` comment as the doc, and\nthe string literals of a `match` on the first argument, with a `//` comment\nover the arm. An alias that names its subcommand already, like `gen = \"run -p\nxtask -- gen\"`, is listed as the one command it is.\n\nNothing is evaluated. A target inside an `ifeq` is listed; a name that depends\non a variable's value is not, because the name it would have is not in the\nfile. The pyproject reader is a line scanner that follows the table headers\nand the shapes both runners document, not a TOML parser.\n\nThe fragment names the service and lists its commands, and claims nothing\nelse: merging puts the list on the service a domain extractor described. The\nrunner files sit beside the service, so the step is told which one it is.\n\n```json\n{\n  \"plugins\": [{ \"name\": \"commands\", \"wasm\": { \"url\": \"file://plugins/portolan-go.wasm\" } }],\n  \"extract\": [\n    {\n      \"plugin\": \"commands\",\n      \"in\": \"examples/shop/pricing\",\n      \"out\": \"examples/shop/pricing/portolan\",\n      \"options\": { \"context\": \"shop\", \"service\": \"pricing\", \"out\": \"commands.json\" }\n    }\n  ]\n}\n```\n\n`extract-project` reads the same files for the component it describes, so a\nrepository read by that plugin does not need this one.\n\nDownstream, `gen-markdown` draws the list as a Commands table on the service\npage, and `gen-backstage` puts it on the Component twice, because Backstage\nhas no field for it: as the `portolan.io/commands` annotation, one command a\nline with its description, and as entity links of type `command`, each\nleading to the line of the runner file it was read from, when `sourceBaseUrl`\nsays where the repository is.\n\n## Where it answers, what it dials: the manifests, and the cluster\n\nA catalog that knows what a service provides and what it consumes still has\nholes where the two do not meet by route alone: two services answer\n`POST /foo`, and the caller's code says only that it posts to `$LEDGER_URL`.\nWhat that variable holds is not in the code. It is in the Deployment, the\nConfigMap it reads, and the Service and Ingress objects that give the far end\na name. Two plugins read those - `extract-k8s` from the manifests in a\nrepository, `fetch-k8s` from a live cluster - and put two lists on the\nservice:\n\n- **Hosts** - the names it answers on: a Kubernetes Service's name in its\n  short, namespaced, `svc` and fully qualified forms, and the hosts of the\n  Ingress or attached Gateway API Route in front of it. A Route contributes\n  only through a Gateway listener that accepts its kind, namespace and\n  hostname, and a cross-namespace Service backend requires a ReferenceGrant.\n- **Dials** - the in-cluster names its workload is configured to reach, cut\n  out of its containers' `env` and the ConfigMaps they read.\n\nThe merge then has both facts in one place. A call that names a host, or a\ncaller whose manifests dial one, resolves against the providers of its route\nwhen exactly one of them answers on that name, and the evidence says\n`kubernetes-host` as the basis. A host only ever decides between providers of\nthe route; it never conjures a provider that does not have it.\n\n### What is never written\n\nA manifest holds configuration, and configuration is where the passwords are.\nThe rule that keeps them out is a rule of shape, not a list of words:\n\n- A `Secret`, a `SealedSecret`, an `ExternalSecret`, or any document with\n  `stringData` is passed over at its `kind`, before its body is decoded. A\n  `secretKeyRef` or `secretRef` is not followed.\n- A value from `env` or a ConfigMap is reduced to the host it names, or to\n  nothing. A URL gives up its hostname and keeps nothing else - not the\n  scheme, the port, the path, the query, nor the user and password in front\n  of the host. A bare `host[:port]` gives up the port. `info`, `true`, a\n  token, a DSN written as `key=value` pairs: none of these is a host, and\n  none passes.\n- What is left qualifies only when the cluster resolves it: a form the tree's\n  own Services answer to, or `\u003cname\u003e.\u003cnamespace\u003e.svc[.cluster.local]`, the\n  one shape no name outside a cluster has. A bare `cart` from another\n  repository's manifests is not taken, because nothing distinguishes it from\n  a word.\n- Warnings name files and directories, never values, because the build\n  report is committed.\n\nThe fragment carries the variable's name no more than its value: the\n`environmentVariable` the HTTP client extractor records stays what it was, and\nno value is attached to it.\n\n### The manifests: extract-k8s\n\nEvery `*.yaml` and `*.yml` under the root, or under the `paths` named in the\noptions; anything without `apiVersion` and `kind` - a compose file, a\nworkflow - is passed over silently. Multi-document files are split. A file\nholding `{{` is a template and not YAML until rendered, so a directory of\nHelm templates is passed over with one warning for the directory; render the\nchart into the tree, or point `paths` at plain manifests, to have it read.\nKustomize is read without running it: the base and the overlays are all under\nthe root, and two documents of one kind and name - a Deployment and the patch\nlaid over it - fold into one, their env and labels unioned. `namespace`\nnarrows workloads, Services, Ingresses and ConfigMaps to one namespace;\nGateway API objects in other namespaces remain available to resolve shared\nGateways and cross-namespace Routes. An object naming no namespace is read\neither way.\n\nThe workload the step is about is the Deployment, StatefulSet, DaemonSet,\nReplicaSet, Job or CronJob named like the service, or labelled so with\n`app.kubernetes.io/name` or `app`, or the only one in the tree. A Job or\nCronJob makes the service's kind `job`; a Deployment says nothing about kind,\nbecause a webapp and a worker both deploy that way. Several workloads and\nnone named is a warning, not a guess.\n\n### The cluster: fetch-k8s\n\nThe manifests say what should run; the cluster says what does, and for an\nestate deployed by Helm or Argo the rendered objects are in no repository at\nall. `fetch-k8s` asks `kubectl` for the workloads, Services, Ingresses, Gateway\nAPI Gateways, Routes and ReferenceGrants, Namespace metadata, and ConfigMaps of\nthe namespaces named - never for a Secret - and answers with one fragment for\nevery workload it saw, placed\ninto contexts and services by label. It runs in the host (portolan.0008)\nbecause it needs the binary, the socket and kubectl's own credential, which\ncomes from the kubeconfig and is never in the manifest.\n\n```json\n{ \"name\": \"k8s-cluster\", \"host\": \"fetch-k8s\" }\n\n{\n  \"plugin\": \"k8s-cluster\",\n  \"in\": \".\",\n  \"out\": \"data\",\n  \"options\": {\n    \"kubeContext\": \"prod-eu\",\n    \"namespaces\": [\"shop\", \"auth\", \"payments\"],\n    \"gatewayNamespaces\": [\"platform-networking\"],\n    \"labels\": { \"context\": \"app.kubernetes.io/part-of\", \"service\": \"app.kubernetes.io/name\" },\n    \"namespaceContexts\": { \"shop-jobs\": \"shop\" },\n    \"cache\": \"data\",\n    \"out\": \"k8s-cluster.json\"\n  }\n}\n```\n\n`namespaces` controls which workloads are emitted. `gatewayNamespaces` adds\nnamespaces that hold shared Gateways or Routes without adding their workloads.\nWhen `namespaces` is omitted, the all-namespaces read already includes both.\nHTTPRoute and GRPCRoute are read as standard kinds; TLSRoute is used when its\nexperimental CRD is installed. TCPRoute and UDPRoute carry no hostname and do\nnot contribute to `hosts`.\n\nThe context is the value of the `app.kubernetes.io/part-of` label and the\nservice the value of `app.kubernetes.io/name`; an estate that labels\ndifferently names its own keys under `labels`. A workload without the\ncontext label falls back to `namespaceContexts`; one with neither is counted\nin a warning for its namespace and left out, not guessed at. A workload\nwithout the service label is named after itself. Several workloads landing\non one service - a Deployment and the CronJob beside it - fold into one; a\nservice that is only jobs is a `job`, one with a Deployment beside them is\nwhatever its code says.\n\nThe same offline rule as fetch-git: with `PORTOLAN_OFFLINE` set, or in CI,\nthe fragment committed at `cache` is used unchanged; when the cluster cannot\nbe reached it is used with a warning that names the failed command and its\nexit status, not the server; with no committed copy, that is an error and\nnot a short answer. What kubectl itself said on stderr goes to the terminal,\nwhere the person at the keyboard can read the connection error, and not into\nthe build report, which is committed. Nothing but the fragment is written to\ndisk: the objects live in the process for the length of one call.\n\n### The event control plane: fetch-eventbridge\n\nTerraform says what should be deployed; the EventBridge API says which buses,\nrules and targets are deployed now. `fetch-eventbridge` asks that read-only API\nin every region named in the step and writes service message channels from\nenabled event-pattern rules. The bus ARN is the channel address, a literal\n`detail-type` is the message name, a mapped event `source` sends it, and a\nmapped target receives it. A disabled rule is not an active route. Scheduled\nrules are left to the separate EventBridge Scheduler integration instead of\nbeing made to look like bus messages.\n\n```json\n{ \"name\": \"eventbridge\", \"host\": \"fetch-eventbridge\" }\n\n{\n  \"plugin\": \"eventbridge\",\n  \"in\": \".\",\n  \"out\": \"data/eventbridge\",\n  \"options\": {\n    \"regions\": [\"eu-west-1\", \"us-east-1\"],\n    \"buses\": [\"orders\"],\n    \"sources\": {\n      \"com.acme.orders\": \"shop.orders\"\n    },\n    \"targets\": {\n      \"lambda:invoice-handler\": \"shop.billing\",\n      \"arn:aws:sqs:eu-west-1:123456789012:audit-events\": \"shop.audit\"\n    },\n    \"ruleTags\": {\n      \"context\": \"portolan.context\",\n      \"service\": \"portolan.service\"\n    },\n    \"cache\": \"data/eventbridge\"\n  }\n}\n```\n\nAuthentication is the standard AWS SDK credential chain: environment,\nworkload role, shared credentials or an `AWS_PROFILE`. A separate step and\noutput directory can be used for each account. The smallest useful policy is\nread-only and grants `events:ListEventBuses`, `events:ListRules` and\n`events:ListTargetsByRule`; add `events:ListTagsForResource` only when\n`ruleTags` is configured. No profile, credential, token, full event pattern,\nfixed target input or input-transformer template is retained. `source` and\n`detail-type` are kept because they are the event's routing identity; other\npattern values are reduced to field names.\n\nIn a local catalog, `/plugins/eventbridge/settings` edits these options,\ncatalog scope and explicit service mappings in `portolan.json`. It can save\nwithout contacting AWS or save and run the reader immediately. A published\ncatalog keeps the page read-only and offers a starter step to copy; credentials\nare never form fields.\n\nThe control plane cannot say which application calls `PutEvents`, and a target\nARN does not identify a Portolan service by itself. That is why `sources` and\n`targets` are explicit maps and an unmapped identity is a warning, not a name\ninferred from the ARN. `ruleTags` is a fallback for a rule whose targets all\nbelong to one service. With `PORTOLAN_OFFLINE` set, in CI, or after a failed\nAWS call, the plugin replays `eventbridge.json` only when its digest matches\n`eventbridge.lock.json`.\n\nportolan.0011 records why both readers keep names and nothing else.\n\n## Where it runs: the GitOps tree, and the deployer\n\nA service's manifests say what it is; what deploys them says where it\nstands - which environment, cluster and namespace, from which directory of\nwhich repository, tracking which revision. Two plugins read that, and the\nmerge lays one under the other (portolan.0012, portolan.0013):\n\n- **extract-argocd** reads the Argo CD `Application` and `ApplicationSet`\n  objects in a GitOps tree, as wasm over the workspace, and answers with\n  what *should* run: one deployment per Application, basis `manifest`. An\n  ApplicationSet is expanded as far as a tree allows - `list` generators\n  whole, `git` directories and files by walking this repository, `matrix`\n  over those, the template rendered as Go `text/template` or fasttemplate\n  as it declared. A `clusters`, `pullRequest`, `scmProvider`, `merge` or\n  `plugin` generator, or a `git` one pointing at another repository, is a\n  warning naming the ApplicationSet and no rows. When the source path holds\n  a `kustomization.yaml`, the tool is kustomize and the images the overlay\n  pins are the declared images.\n- **fetch-argocd** asks the Argo CD API for what *does* run - the revision\n  synced, the images running, the link - and commits it as a snapshot\n  beside a lock, basis `api` (see the fetchers above).\n\n```json\n{ \"name\": \"argocd-gitops\", \"wasm\": { \"url\": \"file://plugins/portolan-go.wasm\" } }\n\n{\n  \"plugin\": \"argocd-gitops\",\n  \"in\": \"examples/gitops\",\n  \"out\": \"examples/gitops/portolan\",\n  \"options\": {\n    \"repo\": \"github.com/shortlink-org/portolan\",\n    \"paths\": [\"bootstrap\", \"appsets\"],\n    \"labels\": { \"context\": \"app.kubernetes.io/part-of\", \"service\": \"app.kubernetes.io/name\" },\n    \"out\": \"argocd.json\"\n  }\n}\n```\n\nAn Application is placed on a service by the labels it carries -\n`app.kubernetes.io/part-of` and `app.kubernetes.io/name`, the same pair\nfetch-k8s reads off a workload, or whichever the manifest names under\n`labels` - and, without them, by deploying from the service's repository\ninside the service's directory. One that matches neither way is listed on\nthe Problems page as unclaimed rather than guessed at.\n\nWhere both plugins spoke for one Application the merge folds the two into\none row, basis `both`: the deployer's shape, the tree filling what the\ndeployer did not say, and the fields the two disagree on kept as the tree's\nword under `drift` - a `deployment-drift` problem, and a chip on the\nservice page that says the difference in words. A row only the tree spoke\nfor wears `declared`.\n\n## Outside the estate: an external with a contract\n\nA service calls things nobody here builds - a card network, a tax API, a\ncarrier. The first answer the catalog gave was `unknown`: the call was\nrecorded and left unresolved, the lane drawn dashed and red, and the Problems\npage listed it beside real defects. True, and unhelpful, once the far end is\nStripe and Stripe publishes a document.\n\nAn **external** is what the catalog may claim about such a system, and no\nmore: what it answers on, read from the copy of its document vendored beside\nthe adapter that calls it, and what the manifest says it is called and is\nfor. It sits at the root beside the contexts (`catalog.externals`) with a bare\nid, no context, no aggregates and no repository, and the estate's picture\ndraws it outside, muted, exactly where it is.\n\nTwo steps describe one, and neither knows the other exists:\n\n```json\n{ \"plugin\": \"openapi\", \"in\": \"examples/payments/ledger\",\n  \"out\": \"examples/payments/ledger/portolan\",\n  \"options\": { \"external\": \"stripe\", \"externalName\": \"Stripe\",\n               \"externalUrl\": \"https://docs.stripe.com/api\",\n               \"spec\": \"src/main/java/.../infrastructure/stripe/openapi/openapi.yaml\",\n               \"out\": \"stripe.json\" } },\n{ \"plugin\": \"java-domain\", \"in\": \"examples/payments/ledger\", \"...\": \"...\",\n  \"options\": { \"externals\": { \"stripe.v1\": \"stripe\" } } }\n```\n\nThe first reads the copy and says what `stripe` answers on. The second reads\nthe adapter, finds the verb and the route in each call, looks the operation up\nin the same copy, and - told by `externals` that the copy's api id belongs to\n`stripe` - records the call as `stripe.v1/PostPaymentIntents`, declared, on a\nlane of kind `external`. The merge joins the two by the id; a call to an\noperation the copy declares resolves, one it does not is reported by the\nextractor and left out.\n\nNeither line is needed when the tree can say it itself. An `openapi` step\nwith no `spec` walks the tree for every document and reads what sits beside\neach one: a server generated from it - oapi-codegen's `ServerInterface`,\nswag's `docs` package, a handler or controller written against it - means the\nservice implements it, and the document is what the service provides; a\nclient generated from it - `ClientInterface`, a `client.gen.go`, an adapter\nnamed after a client - means the service calls it, and the document names a\nsystem this tree does not implement. That system is an external, with the\nid, the name and the summary the document gives itself: a copy titled\n\"Gordian Flights \u0026 Ancillaries API\" becomes `gordian-flights-ancillaries`,\nthe trailing \"API\" dropped because the system is the thing and not its\ninterface. `peers` on the same step says which called documents are ours -\n`{\"auth.v1\": \"auth.auth\"}` - and those are skipped, because the service that\nimplements them describes them; `externals` names a system when the title\nwould not, `{\"stripe.v1\": \"stripe\"}`. A document with neither a server nor a\nclient beside it is reported and left alone, since reading it as either would\nbe a guess.\n\nThe domain extractor keeps the same rule from its side: a generated HTTP\nclient whose api no `peers` line claims is read as calling the system the\ndocument beside it is titled after, and the call lands on an `external` lane,\ndeclared, under the id both sides derive from that title. `externals` on the\ndomain step overrides the name. A proto client's contract names no system,\nso it stays unresolved until the manifest says who answers: `peers` when it\nis one of ours, `externals` - `{\"risk.v1\": \"risk\"}` - when it is not. The\nexternal's side is a `proto` step over the copy with `external` set, the same\nfour options the `openapi` step takes; `paths` names the copy, and the\nfragment carries the external with the services the copy declares, and no\nservice, module or shared type of the estate's:\n\n```json\n{ \"plugin\": \"proto\", \"in\": \"examples/auth\", \"out\": \"examples/auth/portolan\",\n  \"options\": { \"external\": \"risk\", \"externalName\": \"Risk\",\n               \"paths\": [\"internal/session/infrastructure/risk/proto\"],\n               \"out\": \"risk.json\" } }\n```\n\nThe copy is **narrow** - the operations the service calls and the schemas they\nanswer with, every field verbatim - for the reason org.0001 gives for a proto:\nwhat is vendored has to be reviewable, and Stripe's whole document is not. It\ncarries one line the original does not, `x-portolan-api: stripe.v1` in\n`info`: the copy is already the consumer's translation boundary, so it is the\none place the estate's name for the document is written, and every reader of\nthe copy takes the id from there rather than from Stripe's title and version\n- or from two manifests that would have to agree.\n\n## Verifiers: the third phase\n\nAn extractor reads source and runs before there is a catalog; a generator\nreads the catalog and writes pages. A **verifier** sits between them. It reads\nsomething observed - traces today, a test's record tomorrow - and answers with\na fragment like an extractor's, but one that only makes sense against the\nmerged catalog: \"this hop was seen running\" names a hop somebody else declared.\nSo a `verify` step is handed both `input` and `catalog`, and the catalog it is\nhanded leaves out the step's own last output. Without that, what it wrote last\ntime would count as evidence this time, and the fragment could never be checked\nagainst a clean run.\n\n```json\n{\n  \"plugins\": [{ \"name\": \"otel\", \"process\": { \"command\": \"go\", \"args\": [\"run\", \"./plugins/verify-otel\"] } }],\n  \"verify\": [\n    {\n      \"plugin\": \"otel\",\n      \"in\": \"examples/auth\",\n      \"out\": \"examples/auth/portolan\",\n      \"options\": { \"traces\": [\"telemetry/traces.jsonl\"], \"out\": \"observed.json\" }\n    }\n  ]\n}\n```\n\nWhat comes back is merged like any other source, under two rules that exist\nfor it. A flow declared twice is accepted when the second declaration differs\nonly in status: `declared` steps become `verified`, and anything else that\ndiffers - a lane, a hop, a branch - is the conflict it always was. A consumer\nor a call declared twice keeps the first note and takes `verified` if either\nside has it.\n\n### verify-otel\n\nReads OTLP JSON - one batch per file or one per line, as a collector's file\nexporter writes it - and turns each trace into hops between lanes:\n\n| span | hop |\n| --- | --- |\n| kind server, `http.route` | `client → service`, an rpc; matched to the operation whose `http` verb and path the OpenAPI extractor recorded, which is what opens an endpoint flow |\n| kind client, `rpc.service` + `rpc.method` | `service → provider`, an rpc; `unknown` lane and `unresolved` when nothing provides it, however often it ran |\n| `db.system.name`, `db.operation.name` | `service → its store`, a call; the statement nested under a query is not a second call |\n| kind producer, `event.name` | `service → bus`, the event whose name that is among the service's own; a producer span under another for the same name is the relay's and the same publish |\n| kind consumer, `event.name` | `bus → service`, and a `verified` consumer on the event |\n\nA trace whose root opens a declared flow raises the steps it shows: the call\nin, the events out, the rpcs with a ref. A `call` step is never raised - a\n`SELECT` ran, which is not the same claim as \"the repository's `ByEmail` was\ncalled\" - and `unresolved` is never raised, because a trace does not put the\nfar end in the catalog. A consumer span inside a trace opens a flow of its own\nand is matched the same way, so one password change verifies both the\nrequest's flow and the policy's. A root no flow opens is written down as\n`observed-\u003cservice\u003e-\u003croute\u003e`, once per opening, with a summary saying how many\ntraces showed it.\n\nEvery recording that opened a flow is laid over it. A declared step carries\n`seen: { traces }`, how many recordings showed it. An rpc or an event a\nrecording showed that the code does not declare is put into the flow after\nthe declared step it followed, as a step with an id the code never gave\n(`seen1`, `seen2`) and a note saying in how many recordings; a lane such a\nhop needed is added after the declared ones. A store call is never added -\nthe code's word on which repository method ran is the better one - and a\nconsumer met on the way belongs to the flow it opens.\n\nWhere recordings part, the flow says so. What every recording showed after\na step is a run of plain steps; where they went different ways is an `alt`\n(`seen-alt1`, or `alt1` in an observed flow) with a branch for each way,\ntitled by the hop it starts with and counting the recordings that went it,\neach branch laid over the same way inside; what they all showed again\nafter parting comes after the frame, once. A recording that went no\nfurther where others went on is the branch titled `otherwise`, with no\nsteps and its count, so that a reader sees the hop is not always taken.\nTwo observed recordings that open the same way are one flow built this\nway, so a happy path and a refusal read as one sequence that parts. The\nmerge takes all of this from a second declaration of a flow because it\nsays where it came from: `seen` on a step the first declaration does not\nhave, or a frame whose every step and branch carries it.\n\nA recording is also kept as an example of each flow it showed, under\n`examples` on the flow: the recording and trace it came from, when it ran,\nhow long it took, and for each step the span's name, its length and an\nallowlist of its attributes - `http.route`, `http.request.method`,\n`http.response.status_code`, `rpc.service`, `rpc.method`, `db.operation.name`,\n`db.collection.name`, `messaging.destination.name`, `event.name`,\n`server.address` and a few more of that kind. A query text, a header, a full\nURL or a path with an id in it is somebody's data and is never carried; the\nlist is closed in `examples.go`, and a new attribute is added there with the\nargument for it. `examples` in the options says how many recordings a flow\nkeeps, the ones that show the most of it first: five when unset, zero for\nnone.\n\nA recording added from the page lands under the project's\n`telemetry/recordings/` and widens (or adds) the project's `otel` verify step\nto read that directory, so every run after reads it too; the page runs the\ngenerator over a copy of the workspace first and shows which flows the\nrecording showed before anything is written (portolan.0014).\n\n`service.name` is matched to the one service whose slug it is, `event.name` to\nthe one event whose `wire.name` it is, or failing that to the one event of the\npublisher's with that last segment; `services` and `events` in the options say\notherwise where an estate's names differ. A server span's route is matched to\nthe operation whose `http` verb and path template it fits; `routes` in the\noptions names an operation for a route the estate spells another way - a\nprefix a gateway adds, a path the document writes differently - as\n`{ \"POST /api/v1/sessions\": \"login\" }`, and the name has to be one the\nservice's interface declares. A publish span whose\n`messaging.destination.name` is not the event's `wire.channel` is a warning:\nthe event went out, but not where the code says it does.\n\n### verify-codeowners\n\nReads the `CODEOWNERS` a repository already keeps and says who to ask about\neach service.\n\n\"Who do I ask about `shop.oms`\" was the question the estate answered worst.\n`owner` on a flow, a store or a module means the bounded context that holds it\n- a grouping, not a team - and there was nothing on any page a reader could act\non. The answer was already written down, in the one file the forge itself\nenforces: a team that owns a directory is a team that gets the pull request.\n\n```json\n{\n  \"plugins\": [{ \"name\": \"codeowners\", \"process\": { \"command\": \"go\", \"args\": [\"run\", \"./plugins/verify-codeowners\"] } }],\n  \"verify\": [\n    { \"plugin\": \"codeowners\", \"in\": \".\", \"out\": \"data\", \"options\": { \"out\": \"owners.json\" } }\n  ]\n}\n```\n\nPoint `in` at the repository tree to inspect. No forge option is required:\nlocation and GitLab-only syntax select GitHub or GitLab automatically, then the\nforge's own discovery order is used. GitHub tries `.github/CODEOWNERS`, root,\nthen `docs/CODEOWNERS`; GitLab tries root, `docs/CODEOWNERS`, then\n`.gitlab/CODEOWNERS`. The optional `file` remains for non-standard locations and\nexisting manifests; if it names something absent the run fails, because\nanswering \"nobody owns anything\" to a typo is only noticed a month later.\n\nIt is a verifier and not an extractor because a rule is a path and only the\nmerged catalog knows where each service is; an extractor would have to be told,\nservice by service, in the manifest, what the catalog already says. It earns\nthe name twice over. A service no rule matches is reported, and so is a rule\nthat matches no service - a team believing it owns something the estate does\nnot have, which is the one failure a `CODEOWNERS` file can never report about\nitself. A rule that matches and never wins is reported differently, because the\nfix is different: nothing is wrong with the path, everything it covers is just\nclaimed by a rule below it.\n\nWhat lands on the catalog is `owners` on the service: handles exactly as the\nfile spells them, `@acme/oms-team`, `@someone`, `dev@acme.io`. Deliberately\nnothing more - resolving a handle to the people currently in it is a call to a\nforge's API, which needs a credential this does not have and answers\ndifferently tomorrow, and a handle is what a reviewer types anyway. Two sources\nnaming owners are unioned, because two rules that both matched are two facts\nand not two answers.\n\nThe grammar follows the detected forge's CODEOWNERS dialect. A\npattern owns a directory when it names the directory or anything above it, and\ndoes not when it names only something inside it: `services/oms/internal` is a\nrule about part of a service, and reading it as ownership of the whole would\nhand a team a page it never asked for. GitHub uses flat last-match-wins rules,\nincluding an ownerless rule taking ownership back. GitLab resolves every\nsection independently and unions its winners; section defaults, optional and\napproval annotations, roles, escaped spaces, duplicate names and `!`\nexclusions are understood.\n\nThe demo estate's file is `data/codeowners/CODEOWNERS`, which is deliberately\nnot one of the three places a forge reads: this repository is both the tool and\nthe estate it describes, and a real `CODEOWNERS` here would ask GitHub to\nrequest reviews from teams that do not exist. A real repository puts it where\nthe forge looks.\n\n## wasm or process\n\n`wasm` is the default and should stay that way. The module gets no network, no\nenvironment and no way to start a process. A generator gets no filesystem\neither. An extract or verify step gets the workspace preopened as `/`\n(portolan.0006), which is how syntax-only built-in Go extractors read a tree\nwithout a Go toolchain on the machine: those extractors and the three generators\nare the single module `plugins/portolan-go.wasm`, which answers to the plugin\nname the host passes as `argv[0]`. WASI preopens read-write, so an extractor is\ntrusted not to write the tree it reads, the same trust a process plugin has\ntoday; a `sha256` pins that trust to a build.\n\n`process` is the escape hatch for a plugin that needs a toolchain: the typed Go\nHTTP client analyzer and the Rust, Java, Python, PHP and TypeScript extractors run in\ntheir own runtimes. It gets the same protocol\nand none of the sandbox, which is the trade being made and the reason it is\nnot the default. It declares `command` and an `args` array; the host never\nfeeds a command string through a shell. For a built-in declared as `go run`,\nthe adapter compiles a workspace-local native sidecar from the package and\nthen runs it with the scanned workspace as its current directory. This keeps\nmodule resolution in Portolan's shipped source and project loading in the\nproject being analyzed.\n\n`host` is for Portolan's own code that needs what only the host has - a git\nbinary, a socket - and so runs inside the host process (portolan.0008):\n`{ \"name\": \"git\", \"host\": \"fetch-git\" }`. The name is resolved against the\nmodules shipped in `scripts/host-plugins/` and nothing else, so a manifest\ncannot point the host at arbitrary code; the contract is the same as any\nplugin's, files named and never written.\n\nA plugin fetched over `https://` must declare its `sha256`; the host verifies it\nand caches by digest. A `file://` plugin may declare one, but a checksum\nprotects a download, not a module built from the source next to it.\nDownloads do not follow redirects and are bounded in time and size. Every run\nhas a deadline and bounded stdout/stderr; wasm runs in a worker so even a module\nstuck in a loop can be terminated. Responses reject unknown properties,\nduplicate or unsafe filenames, and non-string contents before anything is\nwritten.\n\n## Services in other repositories: fetch-git\n\n`fetch-git` is `fetch-bsr` for a repository rather than a registry, and it\nlives by the same four rules. A pin is a repository and a commit; the step\nfetches that commit and hands back text files from the whole source tree,\nso the host writes them into the tree\nbeside a `git.lock.json` naming the commit and the digest of every file. The\npaths inside the copy are the repository's own, which is the point: the\nextract step that follows points its `in` at the vendored service and reads\nit exactly as it would read that service's checkout.\n\nBinary files are not part of the extractor input. Known binary extensions are\ndiscarded before their blobs are read; files without a known extension are\nsniffed for NUL bytes and invalid UTF-8 before the response is assembled. The\nlock records only their path, byte size and skip reason, never Base64 content,\nso online fetch and offline replay produce the same bounded text-only copy.\n\nIt runs inside the host (`scripts/host-plugins/fetch-git.mjs`,\nportolan.0008) rather than as a module, because it needs a git binary and a\nsocket, and a manifest names it with `host` rather than `wasm` or `process`.\nThe contract is the same: it names files, the host writes them.\n\n```json\n{\n  \"sources\": [\"data/*.json\", \"vendor/repos/*/*/git.repo.json\"],\n  \"plugins\": [{ \"name\": \"git\", \"host\": \"fetch-git\" }],\n  \"extract\": [\n    {\n      \"plugin\": \"git\",\n      \"in\": \"vendor\",\n      \"out\": \"vendor/repos\",\n      \"options\": {\n        \"cache\": \"vendor/repos\",\n        \"repos\": [\n          { \"repo\": \"github.com/acme/shop\", \"commit\": \"c1d2e3f4…\" }\n        ]\n      }\n    },\n    {\n      \"plugin\": \"go-domain\",\n      \"in\": \"vendor/repos/acme/shop/services/oms\",\n      \"out\": \"data/shop\",\n      \"options\": { \"context\": \"shop\", \"service\": \"oms\", \"store\": \"pg\" }\n    }\n  ]\n}\n```\n\nIt runs the `git` the host already needs for stamps: a fetch of the one\ncommit into a directory that exists for one call, with its text files\nread straight into memory. Whatever git is configured to do about\ncredentials and hosts - a helper, a netrc entry, an ssh agent - it does here\ntoo, and the plugin reads none of it. `PORTOLAN_OFFLINE` (or any truthy `CI`)\nreplays the committed copies against their locks; a commit the manifest does\nnot pin is resolved online with a warning and refused offline; a fetch that\nfails falls back to the committed copy when there is one, and is a red build\nwhen there is not; a vendored file edited by hand is reported by path.\n\n### What the copy says about itself\n\nTwo files land beside every copy, and the difference between them is who reads\nthem. `git.lock.json` is for the next run of this step: the commit, and the\ndigest of every file, which is what makes replaying the copy equivalent to\nfetching it again. `git.repo.json` is for the estate - a catalog fragment\nholding one line, the repository and the commit it is a copy of - which is why\nit is in `sources` above.\n\nNothing else can say it. A service says which repository it lives in, and an\nextractor reads a directory as a pure function of what is on disk; neither has\nany idea which commit somebody fetched. Without that line, every source path\nof every vendored service is dead text on the page - the file and the line are\nknown, and there is nowhere to send a reader. With it, `sourceHref` links the\nline at the commit it was read at. The fragments read out of the copy are\ndated, like every other source, by the commit of THIS repository that last\nchanged them (portolan.0010) - which is the fetch that brought the change in,\nand is what \"how fresh is this\" means to the estate that vendored it; the pin\nis what says which upstream commit that was.\n\nOne more line is needed for the app itself: `SOURCE_GLOBS` in `src/data.ts`,\nwhere the same patterns are written out a second time because\n`import.meta.glob` resolves at build time and needs literals.\n\n## Schema modules: fetch and parse, kept apart\n\n`fetch-bsr` and `extract-proto` are two plugins on purpose, and the split is\nthe whole design.\n\n| | `fetch-bsr` | `extract-proto` |\n| --- | --- | --- |\n| job | registry wire → `.proto` bytes | `.proto` bytes → catalog fragment |\n| network | yes | never |\n| environment | reads `BUF_TOKEN` | never |\n| output | `.proto` files and a `bsr.lock.json` per module | one catalog fragment |\n| deterministic | only because it is pinned and cached | absolutely |\n\nExtraction stays a pure function of the tree. Fetching is the step that can\nfail, need a credential, or come back with something different than it did\nyesterday, and confining that to its own step is what lets everything after it\nbe replayed byte-for-byte from a checkout.\n\n**The fetched protos are the plugin's `Response.Files`, not a side effect.** The\nhost writes them like any other generated file, so they get a manifest entry,\nare compared by `gen:check`, and are removed when the step stops naming them.\nThe cache is not a second copy of anything — it *is* the tree. Refreshing a pin\nproduces one pull request holding the pin bump, the proto diff, the lock diff\nand the fragment diff, which is the review worth having.\n\nDeclare the fetch step **before** the extract step: steps run in list order, so\nits protos and locks are on disk by the time the parser reads them.\n\n```json\n{\n  \"plugins\": [\n    { \"name\": \"bsr\",   \"host\": \"fetch-bsr\" },\n    { \"name\": \"proto\", \"wasm\": { \"url\": \"file://plugins/portolan-go.wasm\" } }\n  ],\n  \"extract\": [\n    {\n      \"plugin\": \"bsr\",\n      \"in\": \"examples/shop\",\n      \"out\": \"examples/shop/vendor/proto\",\n      \"options\": {\n        \"cache\": \"examples/shop/vendor/proto\",\n        \"modules\": [\n          { \"module\": \"buf.build/acme/shop\", \"commit\": \"c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6\" }\n        ]\n      }\n    },\n    {\n      \"plugin\": \"proto\",\n      \"in\": \"examples/shop\",\n      \"out\": \"examples/shop/portolan\",\n      \"options\": {\n        \"context\": \"shop\",\n        \"service\": \"oms\",\n        \"paths\": [\"vendor/proto/acme/shop\"],\n        \"vendored\": [\"internal/infrastructure/pricing\"],\n        \"peers\": { \"pricing.v1\": \"shop.pricing\" },\n        \"out\": \"proto.json\"\n      }\n    }\n  ]\n}\n```\n\n`cache` repeats the step's `out` because a plugin is never told where its output\ngoes. That is the shape of the protocol — a plugin returns files and the host\ndecides what to do with them — and not an oversight to work around.\n\n### Why fetch-bsr can never be wasm\n\nIt needs a socket and a credential, which is why it runs inside the host\n(`scripts/host-plugins/fetch-bsr.mjs`, portolan.0008) and is declared with\n`host`. The protocol's \"no ambient state\" rule is about *facts*: nothing about\nthe estate may come from anywhere but the request. A credential is not a fact\nabout the estate — it decides whether the fetch succeeds, never what the fetch\nsays — and a test asserts the output is byte-identical with and without a\ntoken. The token comes from `BUF_TOKEN` or the netrc `buf registry login`\nwrote, never from the manifest.\n\n### Pinning, and the offline rule\n\nPin every module to a commit. A BSR commit is immutable, so a pinned download is\nbyte-reproducible, which is the only reason replaying from disk is equivalent to\nfetching again. An unpinned module is resolved and warned about when online, and\nrefused when offline — there is nothing to replay against.\n\n`PORTOLAN_OFFLINE=1` (or any truthy `CI`) turns the fetch off. The step then\nre-emits the committed copies, checked against their locks. Set it in CI; the\nworkflow already does.\n\nFour rules govern what happens when a fetch does not:\n\n1. Fetch succeeded → the fetched text files, binary-skip metadata and a\n   regenerated lock.\n2. Skipped or failed, cache complete and matching its digests → the cached files\n   byte-identically, plus a warning. Output unchanged, so `--check` stays clean.\n3. Failed **and** no usable cache → a non-zero exit, never a short file list. The\n   host deletes files a step stops naming, and dropping a repository's vendored\n   protos because a laptop went offline is worse than a red build.\n4. A cached file whose digest no longer matches is reported by path — someone\n   edited a vendored copy, which is the drift `docs/adr/org.0001.md` wants seen.\n\n### Why the proto parser is hand-written\n\n`docs/adr/org.0001.md` has consumers keeping *narrowed* vendored copies, and a\nnarrowed copy routinely imports a file nobody vendored beside it. A compiler —\n`protocompile`, `protoc` — refuses to produce anything for that input. The whole\npoint of reading vendored copies is to describe files that do not build\nstandalone, so the parser is tolerant: every construct it declines to model\n(`extend`, a proto2 `group`, an aggregate option body) is named in a diagnostic\nrather than dropped, and only a file that cannot be tokenised is fatal.\n\nIt also keeps types **as written** — `[]LineItem`, `map[string]Money`, the\n`optional` keyword, the author's declaration order — the same stance the catalog\nalready takes for schemas, and one a descriptor has already thrown away.\n\n### What extract-proto will not claim\n\n`status` is only ever `declared` or `unresolved`, **never `verified`**. Reading a\n`.proto` proves a call was written down. `verified` in the shipped catalog means\na test exercises it end to end, which is a property of the merged catalog — and\nevery extractor runs before one exists.\n\nA message named `OrderPlaced` in an `events.proto` stays an `RpcMessage` and does\nnot become a catalog `Event`. `Event.id` is `\u003cservice\u003e.\u003caggregate\u003e.\u003cName\u003e` and\nthis extractor knows the package, not the aggregate; a guess would collide with\nthe event `extract-go` already emits, or invent a ghost aggregate that would sit\nbeside the real one forever.\n\n## Debezium: the database log is a message source\n\n`extract-debezium` reads PostgreSQL Kafka Connect JSON, deploy-time\n`*.json.tpl` connector templates and Strimzi `KafkaConnector` YAML. A connector\nbecomes a `data-pipeline` component; an\nexplicit `table.include.list` becomes one source-backed flow per table, from the\nstore through Debezium to the exact Kafka topic derived from `topic.prefix`.\n`value.converter` supplies the channel encoding, and\n`ExtractNewRecordState` changes the declared wire shape from the Debezium\n`Envelope` to its flattened `Value`.\n\nAn ordinary CDC record is a message, not a domain event. It says a row changed;\nit does not say which aggregate made a business decision. The Outbox Event\nRouter is the deliberate exception: the application that wrote the outbox is\nkept as the logical publisher, while the connector remains visible as the relay\nin the flow. Because `route.by.field` reads a value from each row, the manifest\nsupplies the finite route values and wire message names that configuration alone\ncannot enumerate.\n\nThe reader is conservative at the two places a finite architecture cannot be\nproved. A regex in `table.include.list`, a custom topic naming strategy, or a\ntopic-routing SMT produces a diagnostic rather than an invented channel. The\none bounded routing form is a `RegexRouter` matching every input and replacing\nit with one literal topic; that exact address is retained without inventing a\npayload schema. The first release reads PostgreSQL only. Live Kafka Connect state and lag are not\nconfiguration facts and belong in a later verifier.\n\nNo connector configuration is copied into the fragment. Only topology facts\nare retained, so database, Kafka and registry credentials never enter generated\ncatalog files. See `extract-debezium/README.md` for the options and an outbox\nexample.\n\n## Schema registry subjects: the same split, one topic further\n\n`fetch-csr` and `extract-csr` are the Confluent Schema Registry half of the same\nargument, and they are shaped like `fetch-bsr` and `extract-proto` on purpose:\none owns the socket and the credential, the other owns the reading, and CI runs\nthe reading over a tree it can verify without a registry existing at all.\n\n| | `fetch-csr` | `extract-csr` |\n| --- | --- | --- |\n| job | registry wire → schema files | schema files → catalog fragment |\n| network | yes | never |\n| environment | reads `CSR_API_KEY`/`CSR_API_SECRET`, or `CSR_TOKEN` | never |\n| output | one schema and a `csr.lock.json` per subject | one catalog fragment |\n| deterministic | only because it is pinned and cached | absolutely |\n\nDeclared as `{ \"name\": \"csr\", \"host\": \"fetch-csr\" }` and\n`{ \"name\": \"csr-schemas\", \"wasm\": { \"url\": \"file://plugins/portolan-go.wasm\" } }`:\nthe fetcher runs inside the host (`scripts/host-plugins/fetch-csr.mjs`,\nportolan.0008), the reader in the shared module.\n\nA registered version is immutable: subject `orders-value` at version 3 is the\nsame bytes today and next year, and re-registering a changed schema makes\nversion 4. That is the promise a BSR commit makes, so the same four rules govern\na fetch that does not happen, and `PORTOLAN_OFFLINE=1` replays the committed\ncopies against their locks exactly as it does there.\n\nA subject a fetched schema **references** is fetched too, pinned by the\nreference rather than by the manifest, and needs no entry of its own — the\nversion is part of the bytes we already have, so following one adds no lottery.\nEach lands in its own directory, and the referring subject's lock is what an\noffline run follows to find them.\n\nThe fetch also asks for the subject's effective compatibility configuration,\nincluding the global value when the subject inherits it. The level is kept in\nthe lock beside the immutable version and schema id, carried onto the channel\nmessage by `extract-csr`, and shown in the service's bus view. A registry that\nimplements the schema API but not the configuration resource still yields the\nschema and a diagnostic names the governance fact that could not be read.\n\nSet `history` on a subject to retain a bounded window ending at the selected\nversion. `fetch-csr` lists the registered versions and vendors the preceding\nschemas beside the current one; `extract-csr` keeps their top-level wire fields,\nand the bus row shows additions, type changes and removals from one version to\nthe next. The default is one, so existing snapshots do not silently grow.\n\nAvro and JSON schemas arrive minified onto one line. They are written out\nindented — re-spaced token by token, never re-parsed, so the file still says\nwhat the registry said in the order it said it — because a version\nbump that is one unreadable line is a review nobody can do. The digest is over\nthe bytes as written, so verifying needs no reformatting of anything.\n\n### Compatibility gate before registration\n\n`verify-csr` is the active half of the integration. It sends each local\ncandidate to `POST /compatibility/subjects/{subject}/versions?verbose=true`,\nwhich applies the subject's effective policy exactly as registration would,\nincluding transitive checks. It never registers or changes a schema. An\nexplicit incompatible answer fails the verify phase and keeps every explanation\nthe registry returned in the error.\n\n```json\n{\n  \"plugins\": [\n    { \"name\": \"csr-compatibility\", \"host\": \"verify-csr\" }\n  ],\n  \"verify\": [\n    {\n      \"plugin\": \"csr-compatibility\",\n      \"in\": \"schemas\",\n      \"out\": \"portolan\",\n      \"options\": {\n        \"registry\": \"https://psrc-00000.eu-central-1.aws.confluent.cloud\",\n        \"candidates\": [\n          { \"subject\": \"shop.orders-value\", \"path\": \"order.avsc\" }\n        ]\n      }\n    }\n  ]\n}\n```\n\nCredentials use the same `CONFLUENT_SCHEMA_REGISTRY_API_KEY` and\n`CONFLUENT_SCHEMA_REGISTRY_API_SECRET` (or `CSR_*`) environment variables as\nthe fetcher. References may be named on a candidate when the schema depends on\nother registered subjects.\n\n### The strategy the registry does not record\n\nA subject name is whatever the producer's serializer decided to call the\nregistration, and the rule it used — the `SubjectNameStrategy` — is nowhere in\nthe registry's answer. `shop.oms.order-value` is a topic plus a suffix under\n`TopicNameStrategy` and a record's full name under `RecordNameStrategy`, and\nnothing but the manifest can say which. So `strategy` is an option, and\neverything `extract-csr` does with a name follows from being told it.\n\nUnder `topic-record` the separator is a hyphen and both halves may contain one,\nso the split is made by matching the **schema's own full name** as the suffix\nrather than by searching for a delimiter.\n\nA `-key` subject is kept as a shape and put on no channel: a key is part of\nevery message on the topic, not a message on it. Under `record` there is no\ntopic at all, and a fragment with no channels is the right answer rather than a\ngap — that strategy exists so a record can be reused across many.\n\n### What extract-csr will not claim\n\n**It emits no events.** An `Event` in the catalog belongs to an aggregate, and a\nregistry holds schemas, not domains — it has no idea which aggregate raises\nwhat. So the shapes land in `defs`, where a shared shape belongs, and the topics\nland in the service's channels beside the ones an AsyncAPI document declares.\nThe domain extractor says an aggregate raises `OrderPlaced` and calls it\n`shop.oms.OrderPlaced` on the wire; this says a schema by that name is\nregistered against topic `shop.oms.order` and has these fields. Neither knows\nthe other exists, and the pages hold the two against each other.\n\n**It does not say who produces.** A registry records no producer and no\nconsumer. `direction` is told, per step and per subject, or it would be invented.\n\n**It does not parse protobuf.** That is `extract-proto`'s whole job, and a\nsecond, worse parser here would be a second answer to one question. A `PROTOBUF`\nsubject still names its topic — which is the one thing a `.proto` file cannot\nsay — and a diagnostic points at `extract-proto` for the fields.\n\nA field referencing a shape nothing in the estate vendored keeps its **name**\nand loses its **ref**. The catalog validates that every ref resolves, and\nfailing a run over a reference that is genuinely true — the shape really does\nlive in another estate — would be the wrong end of the trade.\n\n## The bus: a channel is a claim, not an event\n\n`extract-asyncapi` reads an AsyncAPI document and answers with the channels a\nservice declares — the address the broker knows, and each message on it with the\ndirection it travels. What it does **not** answer with is events.\n\nA message's `contentType`, or the document's `defaultContentType` when the\nmessage leaves it out, is kept as the exact declared media type. MessagePack\nmedia types are additionally normalized to `encoding: msgpack`, so source and\ncontract extractors can be compared without depending on one MIME spelling.\n\nThat looks like a gap and is a boundary. `Event.id` is\n`\u003cservice\u003e.\u003caggregate\u003e.\u003cName\u003e`, and an AsyncAPI document knows the message on the\nwire, not the aggregate that raised it. An extractor that guessed would either\ncollide with the event `extract-go` and `extract-ts` already emit or invent a\nghost aggregate that would sit beside the real one forever — the same rule\n`extract-proto` keeps about a message called `OrderPlaced`.\n\nSo the two sources meet in the merge instead, and the pages hold them against\neach other. The domain says an aggregate raises `BasketCreated` and how it leaves,\nin `wire`; the document says the service sends `cart.BasketCreated` on\n`shop.cart.basket`. Where they agree the catalog says the same thing twice, which\nis worth nothing. Where they disagree it is worth a row on the Problems page,\nbecause one of the two is stale:\n\n- an event whose channel the document does not declare — a subscriber reading\n  the document does not know the message exists;\n- a channel the document declares and no event names — a promise nothing keeps;\n- a message the document listens for that nothing in the estate publishes.\n\nThat last one is the only edge in the catalog that runs from the subscriber\noutwards. Everywhere else a publisher names its consumers; here the subscriber\nnames a message and the estate is searched for whoever puts it on the wire. A\nsubscription that resolves is how two repositories that never mention each other\nare found to be joined — and a channel that two services both declare a send on\nis a second publisher, which is an error for the reason a second writer in a\ndatabase is.\n\n### 2.x says publish and subscribe backwards\n\nIn AsyncAPI 3.x an operation carries `action: send` or `action: receive`, from\nthe application's side, and there is nothing to get wrong. In 2.x a channel has\n`publish` and `subscribe`, and both are written from the **client's** side:\n`publish` is what somebody else publishes *to* the application, so the\napplication receives it, and `subscribe` is what the application produces for\nsomebody else to subscribe to.\n\nReading 2.x the obvious way puts every arrow in the estate the wrong way round.\nThe extractor reads both versions and answers in 3.x's vocabulary, which is the\none the catalog keeps.\n\n### A work queue is a channel of kind `job`\n\nA task queue is a channel too - an address the broker knows, messages that\ntravel on it - with one difference the catalog has to be told: many callers\nput the same job on it by design, and no domain event stands behind a job.\n`kind: \"job\"` on the channel says so. The merge does not call two senders on a\njob queue rival publishers, and the Problems page does not look for an event\nwith the job's wire name. `extract-celery` answers with these for a Python tree:\none channel per queue, a `send` per task the tree enqueues and a `receive` per\ntask it declares, and one flow per task that is both - the call that enqueues\nit, then the worker that runs it. It reads the queue the way Celery decides\nit, the call before the decorator before `task_routes` before the default,\nand `transaction.on_commit(...)` around an enqueue is a note on the step,\nwhich is the one fact about *when* a message leaves that the code states\nplainly.\n\n### HTTP destination provenance\n\n`extract-http-clients` emits structured `destination` evidence on HTTP consumes\nand flow steps: the request call site and endpoint expression, local path,\nbase URL expression, config field and environment variable, source locations,\nand a full path when source proves the join. Functional options that assign a\nURL field to a returned client are followed through adapter constructors.\nBindings belong to the adapter's client field; conflicting construction sites\nremain unresolved instead of sharing another client's settings.\n\nA Go `default` struct tag is recorded as `config-default`, not as the effective\nruntime configuration. For example, `WithBaseURL(cfg.SettingAddr)` with\n`default:\"http://localhost:8000/settings\"` and a concatenated\n`/get-admin-settings` yields `/settings/get-admin-settings`. The merge matches\nthat full path exactly and never falls back to a suffix if it is absent.\nLegacy suffix matches remain explicitly labeled `unique-suffix` in the evidence\nshown in RPC step details. Later runtime URL modifiers are listed separately;\nthe recovered full path describes the static join. Unreadable options may\nleave only the local route available.","kind":"cli","technologies":["Go","TypeScript","Rust","Java","Python"],"provides":[],"consumes":[],"aggregates":[]}},{"kind":"service","kindLabel":"webapp","id":"portolan.site","name":"Site","summary":"Site","parent":"portolan","badges":["webapp","TypeScript","React","Vite"],"relationships":[{"label":"in","id":"portolan"}],"record":{"id":"portolan.site","slug":"site","name":"Site","repo":"github.com/shortlink-org/portolan","path":"src","readme":"# Site\n\nThe browser: a React single-page application that loads every source the\nmanifest names, merges them, validates the union and renders the estate.\nStatic end to end; there is no backend and no runtime query.\n\n## What it does\n\n- Decides the shape of a catalog. `catalog.ts` is the contract, with the\n  reasoning beside each field; `catalog/` in Go is a mirror of it, held by a\n  round-trip test (portolan.0003). The validator lives here too, and runs\n  before anything is drawn: a catalog that fails renders the failure.\n- Merges sources and derives what they imply. `merge.ts` and `enrich.ts` are\n  the same code the host runs, so the site and the generated documentation\n  cannot disagree about what the estate is.\n- Renders the entity pages, the flows with their step rail and chains, the\n  Problems page, the language page, the ER canvases, the C4 views the\n  LikeC4 bundle carries, and the navigation around them.\n\n## What it does not do\n\n- Draw a C4 view itself: `likec4/` is written from the catalog by the host,\n  and the site embeds the generated bundle.\n- Run a plugin, read a tree or stamp anything; the fragments arrive as JSON\n  through the build.\n- Persist anything but a reader's own conveniences, pins and the trail, in\n  the browser.\n\n## Layout\n\n- `catalog.ts`, `merge.ts`, `enrich.ts`, `data.ts`: the contract, the merge,\n  what the merge implies, and where the sources are found.\n- `pages/`, `components/`, `app/`: what a reader sees.\n- `flow/`, `graph/`, `map/`, `er/`, `language/`, `table/`, `selection/`,\n  `trail/`: one directory per kind of view.\n- `lib/`: what the views share, one concern per file.\n- `likec4/`: the generated bundle and the ids it is asked for.\n- `testing/`: the frozen estate the UI tests run against.","kind":"webapp","technologies":["TypeScript","React","Vite"],"provides":[],"consumes":[],"aggregates":[]}},{"kind":"flow","kindLabel":"flow","id":"flow.gen","name":"npm run gen","summary":"Three passes over the manifest, each after the previous one's files are on disk: extract reads trees and specifications into fragments, verify overlays evidence on the merged catalog, generate turns it into pages. Every plugin is one JSON message in and one out; the host writes, the plugin never does.\n\nIn `--check` mode the same run writes nothing and fails on the first file that differs from disk, which is what makes committed output reviewable.","parent":"portolan","relationships":[{"label":"owned by","id":"portolan"},{"label":"touches","id":"portolan.host"},{"label":"touches","id":"portolan.plugins"},{"label":"touches","id":"tree"}],"record":{"id":"flow.gen","slug":"gen","name":"npm run gen","summary":"Three passes over the manifest, each after the previous one's files are on disk: extract reads trees and specifications into fragments, verify overlays evidence on the merged catalog, generate turns it into pages. Every plugin is one JSON message in and one out; the host writes, the plugin never does.\n\nIn `--check` mode the same run writes nothing and fails on the first file that differs from disk, which is what makes committed output reviewable.","source":"scripts/gen.mjs","owner":"portolan","participants":[{"id":"developer","kind":"actor","context":null},{"id":"tree","kind":"store","context":"portolan","label":"the tree: fragments, docs/, exports/"},{"id":"portolan.host","kind":"service","context":"portolan"},{"id":"portolan.plugins","kind":"service","context":"portolan"}],"steps":[{"type":"step","id":"s1","from":"developer","to":"portolan.host","kind":"call","label":"npm run gen","status":"declared"},{"type":"step","id":"s2","from":"portolan.host","to":"portolan.host","kind":"call","label":"validate the manifest against the composed schema","status":"declared","note":"schema/portolan.schema.json is what every declared plugin said it can be told, composed by npm run schema."},{"type":"loop","id":"loop3","title":"for each extract step","steps":[{"type":"step","id":"s4","from":"portolan.host","to":"portolan.plugins","kind":"call","label":"extract","status":"declared","note":"The request carries the input root, its stamp and the step's options. The stamp is the last commit that touched the root, never a clock (portolan.0002).","line":"scripts/gen.mjs:121"},{"type":"step","id":"s5","from":"portolan.host","to":"tree","kind":"call","label":"write the fragment beside the service","status":"declared"}]},{"type":"step","id":"s6","from":"portolan.host","to":"tree","kind":"call","label":"read every source the manifest names","status":"declared","line":"scripts/catalog-sources.mjs:28"},{"type":"step","id":"s7","from":"portolan.host","to":"portolan.host","kind":"call","label":"merge, validate and enrich the union","status":"declared","note":"The same code the site runs: src/merge.ts, src/catalog.ts, src/enrich.ts. A fragment naming a peer it does not own is normal; integrity holds over the union."},{"type":"loop","id":"loop8","title":"for each verify step","steps":[{"type":"step","id":"s9","from":"portolan.host","to":"portolan.plugins","kind":"call","label":"verify","status":"declared","note":"The merged catalog rides in the request; the answer is an overlay fragment with what the evidence showed.","line":"scripts/gen.mjs:135"},{"type":"step","id":"s10","from":"portolan.host","to":"tree","kind":"call","label":"write the overlay","status":"declared"}]},{"type":"loop","id":"loop11","title":"for each generate step","steps":[{"type":"step","id":"s12","from":"portolan.host","to":"portolan.plugins","kind":"call","label":"generate","status":"declared","note":"A wasm module with nothing preopened, or a process. It names files and never writes them (portolan.0001).","line":"scripts/gen.mjs:165"},{"type":"step","id":"s13","from":"portolan.host","to":"tree","kind":"call","label":"write the pages and delete what stopped being generated","status":"declared"}]},{"type":"step","id":"s14","from":"portolan.host","to":"tree","kind":"call","label":"write .portolan/build-report.json","status":"declared"}]}},{"kind":"adr","kindLabel":"decision","id":"portolan.0001","name":"A plugin names files and never writes them","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0001","slug":"portolan-0001-a-plugin-names-files-and-never-writes-them","number":1,"title":"A plugin names files and never writes them","status":"accepted","date":"2026-09-02","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA plugin produces files: a fragment beside the service it read, pages under\n`docs/`, a Backstage bundle. Who writes them to disk?\n\nThe obvious answer is the plugin. It knows the names, it has the tree, and\nevery code generator ever written does it that way. It is also the answer that\nmakes a plugin something that holds a directory: a `--check` mode then needs\nthe plugin to know there is a disk to compare against, a wasm module needs a\ndirectory preopened for it, a plugin that can write can also delete, and a page\nthat stops being generated has nobody who remembers writing it.\n\n## Decision Drivers\n\n- A generator must be able to run as a wasm module with nothing preopened at\n  all.\n- `--check` must compare a render against disk without the plugin knowing\n  there is a disk.\n- A name that climbs out of the output directory must be refused in one\n  place, not in every plugin.\n- A page that stops being generated must be deleted by something that knows\n  what was written last time.\n\n## Considered Options\n\n1. **The plugin answers with named files and the host writes them** — one\n   JSON message out, `files: [{name, contents}]`, nothing else.\n2. **The plugin writes into an output directory it is handed** — a path in the\n   request, or a preopened directory for wasm.\n3. **The plugin writes and answers with a listing** — so the host can at least\n   delete what went stale.\n\n## Decision Outcome\n\nChosen option: **the plugin answers with named files and the host writes\nthem**.\n\n| | sandbox | check mode | stale pages | unsafe names |\n|---|---|---|---|---|\n| host writes | nothing preopened | host compares | host lists what each step wrote | refused once, in the host |\n| plugin writes | a directory is open | plugin must know the disk | nobody's | every plugin's problem |\n| plugin writes and lists | a directory is open | plugin must know the disk | host deletes from the listing | every plugin's problem |\n\nWhat is given up is streaming: a plugin's whole output crosses one JSON\nmessage on stdout, so a generator holds every page in memory at once and\ncannot write incrementally. That is the cheaper loss, because the outputs are\ndocumentation-sized and the sandbox is the reason the protocol has this\nshape rather than a restriction worked around.\n\n### Consequences\n\n- Good: `gen-markdown`, `gen-mermaid` and `gen-backstage` run as wasm with no\n  filesystem, and a generator in any language is the same contract.\n- Good: the host refuses a name outside the output directory, keeps a listing\n  of what each step wrote, and deletes pages that stopped being generated.\n- Bad: a plugin cannot stream, and a plugin cannot read what it wrote last\n  time; determinism has to come from the catalog alone, which is required of\n  it anyway.\n- Neutral: this decides the write side only. An extractor still reads a tree,\n  so extractors run as processes rather than wasm; lifting that would be its\n  own record.\n","relates":{},"source":"adr/0001-a-plugin-names-files-and-never-writes-them.md","created":{"commit":"229c1fb4f2b8ee1d4fe60d35c2be9d122f75c34c","author":"Victor Login","date":"2026-09-06T18:48:02+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0002","name":"The host stamps a fragment from its input's last commit","summary":"Context and Problem Statement","badges":["superseded"],"record":{"id":"portolan.0002","slug":"portolan-0002-the-host-stamps-a-fragment-from-its-inputs-last-commit","number":2,"title":"The host stamps a fragment from its input's last commit","status":"superseded","date":"2026-09-02","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA fragment says when it was read and at which commit, so the estate can be\ndated and a source path can be a link. Who works that out?\n\nThe obvious answer is the extractor: read the clock, ask the repository for\nits head. A clock makes a different fragment on every run, which cannot be\ncommitted and cannot be checked. Version control in the plugin makes a plugin\nthat can never be sandboxed, and a plugin that reads its own output\ndirectory's history stamps itself out of date on every run.\n\n## Decision Drivers\n\n- A committed fragment must be byte-identical across runs of the same source,\n  so `--check` means something.\n- A fragment must change exactly when its subject changes.\n- A plugin must know no clock and no repository.\n- A copy of another repository must be dated by the commit it is a copy of,\n  not by when it was copied.\n\n## Considered Options\n\n1. **The host stamps from the last commit that touched the input root**,\n   excluding the output directory when it sits inside that root.\n2. **The extractor reads the clock and the repository** and writes what it\n   found.\n3. **No stamp; a content hash** — the fragment is dated by what it says.\n\n## Decision Outcome\n\nChosen option: **the host stamps from the last commit that touched the input\nroot**.\n\n| | reproducible | sandboxable | says when |\n|---|---|---|---|\n| host, from history | yes | yes | the last change to the subject |\n| plugin, clock and repository | no | no | now |\n| content hash | yes | yes | never |\n\nWhat is given up is a stamp for a root that is the whole repository: every\ncommit anywhere moves it, so the fragment of a repository that describes\nitself, portolan's own `portolan/project.json` included, is re-stamped after\nevery commit. That is accepted because it is true: every commit to the\nrepository is a commit to the component. A tree with no history is stamped\n`uncommitted` with the wall clock, and `PORTOLAN_GENERATED_AT` pins that for\na build that must reproduce.\n\n### Consequences\n\n- Good: `gen --check` is a real check; a fragment diffs only when its source\n  does; a fetched repository is dated by the commit its lock names.\n- Bad: a shallow clone cannot stamp, and the host refuses rather than guesses:\n  fetch the full history first.\n- Bad: two extractors on one root carry the same stamp even when only one's\n  subject changed.\n- Neutral: the stamp is the commit that last touched the directory, which is\n  not the commit the code was built from.\n","supersededBy":"portolan.0010","relates":{},"source":"adr/0002-the-host-stamps-a-fragment-from-its-inputs-last-commit.md","created":{"commit":"229c1fb4f2b8ee1d4fe60d35c2be9d122f75c34c","author":"Victor Login","date":"2026-09-06T18:48:02+07:00"},"revised":{"commit":"f2da58d8ef99748d6aa1ba0fcb4eb443509a1dcd","author":"Victor Login","date":"2026-09-10T21:47:36+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0003","name":"The Go catalog is a mirror held by a round-trip test","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0003","slug":"portolan-0003-the-go-catalog-is-a-mirror-held-by-a-round-trip-test","number":3,"title":"The Go catalog is a mirror held by a round-trip test","status":"accepted","date":"2026-09-02","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nPlugins written in Go need the catalog's shape, and the site written in\nTypeScript needs it too. Where is the shape decided, and how do two languages\nhold one shape?\n\nThe obvious answer is a JSON schema that both are generated from. A generated\ntype carries no prose, and the prose is where every decision about the shape\nlives: why a list is optional in the file and never optional downstream, why a\ncontext's id is its slug. The other obvious answer is two definitions kept in\nstep by care, which is how two definitions drift.\n\n## Decision Drivers\n\n- One place decides the shape, and the reasoning sits beside the field it is\n  about.\n- A Go plugin reads a catalog the host has already validated, and does not\n  validate again: a second opinion in a second language is how the two drift.\n- Drift between the two is a failing test, not a reader's surprise.\n- A plugin in a language with no mirror at all still works.\n\n## Considered Options\n\n1. **`src/catalog.ts` is the definition and `catalog/model.go` a hand-written\n   mirror**, held to it by a round-trip test over a fixture catalog.\n2. **A JSON schema generates both** — one source, two generated types.\n3. **Go is the definition and TypeScript is generated** from it.\n4. **No Go mirror** — Go plugins read `map[string]any`.\n\n## Decision Outcome\n\nChosen option: **`src/catalog.ts` is the definition and the Go package is a\nmirror**.\n\n| | prose beside the shape | drift | plugin ergonomics |\n|---|---|---|---|\n| TypeScript decides, Go mirrors | yes, once | a test fails | typed |\n| schema generates both | no | none | typed, undocumented |\n| Go decides | yes, in Go | a test fails | the site reads a generated type |\n| no mirror | yes | none | untyped |\n\nWhat is given up is typing every field twice by hand, and that a field added\non one side and not the other is a test failure rather than a compile error.\nThat is the cheaper loss, because the round trip is mechanical and the prose\nis not.\n\n### Consequences\n\n- Good: the reasoning about the shape lives in one file, and the Go package\n  says on its first line that it decides nothing.\n- Good: Rust, Python, Java and TypeScript plugins keep no mirror; they write\n  JSON the host validates.\n- Bad: the round trip covers what the fixture exercises, so an `omitempty`\n  on the Go side and an \"optional in the file\" on the TypeScript side have to\n  be matched by hand.\n- Neutral: the mirror is kept honest by the tests that hold generators to the\n  catalog too: a field rendered nowhere fails the coverage test.\n","relates":{},"source":"adr/0003-the-go-catalog-is-a-mirror-held-by-a-round-trip-test.md","created":{"commit":"229c1fb4f2b8ee1d4fe60d35c2be9d122f75c34c","author":"Victor Login","date":"2026-09-06T18:48:02+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0004","name":"`contexts` and `services` stay the wire format","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0004","slug":"portolan-0004-contexts-and-services-stay-the-wire-format","number":4,"title":"`contexts` and `services` stay the wire format","status":"accepted","date":"2026-09-06","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nPortolan began for estates built on domain-driven design: bounded contexts\nowning services owning aggregates. A repository that was never laid out that\nway still belongs in a catalog: a system with an application in it, a team\nwith a library, a namespace with a job. Where does it go?\n\nThe obvious answer is to rename the keys to `groups` and `components`, migrate\nevery committed catalog and every extractor in five languages, or to add a\nsecond top-level list beside `contexts`. The first rewrites every fragment\never committed for a change of word; the second means two of everything\ndownstream: the site, three generators, the diff, the C4 model.\n\n## Decision Drivers\n\n- An old catalog loads unchanged.\n- One model in the site, the generators, the exporters and the C4 model.\n- The neutral extractor emits the same node a domain extractor would, so the\n  two can fill it side by side.\n- The historical meaning stays the default: a fragment that says no kind is a\n  bounded context with services in it.\n\n## Considered Options\n\n1. **Keep the keys and add an optional `kind` to both nodes**; absent keeps the\n   historical meaning.\n2. **Rename to `groups` and `components`** with a migration of every fragment\n   and extractor.\n3. **A second top-level list**, `systems` with `components`, beside\n   `contexts`.\n\n## Decision Outcome\n\nChosen option: **keep the keys and add an optional `kind`**.\n\n| | old catalogs | downstream | vocabulary |\n|---|---|---|---|\n| keys stay, `kind` added | load unchanged | one model | two readings of one node |\n| keys renamed | migrated | one model | one |\n| second list | load unchanged | two of everything | one |\n\nWhat is given up is one vocabulary in prose: the wire and the code say\ncontext and service, and the README and the setup wizard say group and\ncomponent when the kind is neutral. That is the cheaper loss, because a\nmigration is paid once by everyone and a word is explained once in the\nglossary: `GLOSSARY.md` names all four and says which is the term.\n\n### Consequences\n\n- Good: no fragment is migrated, and every page, view and exporter works for a\n  neutral repository on the day.\n- Good: `extract-project` and a domain extractor fill the same node, so a\n  repository can be catalogued before anyone decides whether it has a domain.\n- Bad: the type is called `BoundedContext` and holds a `system`; a reader of\n  the Go or TypeScript type has to know about `kind`.\n- Neutral: `bounded-context` is also spelled as a kind, for a fragment that\n  wants to say so explicitly.\n","relates":{},"source":"adr/0004-contexts-and-services-stay-the-wire-format.md","created":{"commit":"229c1fb4f2b8ee1d4fe60d35c2be9d122f75c34c","author":"Victor Login","date":"2026-09-06T18:48:02+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0005","name":"CSS moves what appears; Motion moves what leaves or changes place","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0005","slug":"portolan-0005-css-moves-what-appears-and-motion-moves-what-leaves","number":5,"title":"CSS moves what appears; Motion moves what leaves or changes place","status":"accepted","date":"2026-09-06","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nThe site has one motion system: three durations and two easings as CSS\ntokens, a handful of keyframes, and a stagger for lists. Every animation in\nit runs once, on mount. Nothing leaves - the palette, the drawer, the toast\nare on screen one frame and gone the next - and nothing changes place: a tab\nbecomes active by repainting, a branch opens by appearing, the current step of\na flow jumps down the rail. A reader sees a site that arrives but never\nmoves, and reads that as \"no animations\".\n\nCSS can express a mount. It cannot express
