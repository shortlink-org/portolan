ame timestamp","when":["activity events cannot be ordered by time alone"],"then":["Portolan orders them deterministically by kind and stable key"]},{"name":"A branch changes requirements and tasks","when":["the compared branch adds a requirement and completes a task"],"then":["both events appear in the activity feed and Changes view with links to their source sections"]}]},{"id":"automate-sdd-workflow/automatic-sdd-workflow/specifications-participate-in-global-navigation","title":"Specifications participate in global navigation","text":"Portolan SHALL index changes, requirements and scenarios for global search and command palette navigation. Results SHALL retain their SDD kind and SHALL navigate to a stable route or section anchor.","source":"openspec/changes/automate-sdd-workflow/specs/automatic-sdd-workflow/spec.md:64","scenarios":[{"name":"Requirement is found by title or ID","when":["a reader searches for an exact requirement ID or words from its title"],"then":["the result is labeled as a requirement and opens that requirement on its specification page"]},{"name":"Removed requirement exists only in a branch diff","when":["a requirement exists on the comparison base but not in the current catalog"],"then":["it remains visible in Changes but is not added to the current global search index"]}]},{"id":"automate-sdd-workflow/automatic-sdd-workflow/automatic-conclusions-preserve-evidence-boundaries","title":"Automatic conclusions preserve evidence boundaries","text":"Portolan SHALL label author intent, changed-with impact, declared architecture, test evidence and runtime observation as separate states. Task completion, co-change and exact links SHALL NOT independently produce verified conformance.","source":"openspec/changes/automate-sdd-workflow/specs/automatic-sdd-workflow/spec.md:75","scenarios":[{"name":"Every task is checked","when":["a specification has a complete checklist but no runtime observation"],"then":["lifecycle may be complete while conformance remains unverified"]},{"name":"Code and specification changed together","when":["Git shows a code path and specification artifact in the same commit"],"then":["Portolan records related change impact without claiming that the requirement is implemented"]}]}],"tasks":[{"id":"1.1","title":"Add high-confidence OpenSpec detection to local project discovery using `.openspec.yaml` markers and cover standard, empty and malformed layouts.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:5"},{"id":"1.2","title":"Add an automatically selected `sdd` extraction plan with project-root input and omitted default options; ensure an explicit step suppresses the implicit duplicate.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:6"},{"id":"1.3","title":"Run discovery and extraction against Portolan's own change and the read-only Gavel project fixture.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:7"},{"id":"2.1","title":"Define a derived specification-history model that references source artifacts without adding Git metadata to `specs[]`.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:11"},{"id":"2.2","title":"Reuse the host history reader to resolve first/latest commit, author, date and uncommitted state for change artifacts, including unavailable reasons.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:12"},{"id":"2.3","title":"Extend branch catalog diff with requirement, scenario, task and lifecycle changes using stable identifiers.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:13"},{"id":"3.1","title":"Derive changed repository paths for the active comparison using the existing branch draft/history pipeline.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:17"},{"id":"3.2","title":"Resolve each path to the longest unique repository/service owner and preserve repository-level ambiguous or unmatched results.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:18"},{"id":"3.3","title":"Present impact as `changed with` on specification and Changes pages without promoting it to implementation evidence.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:19"},{"id":"4.1","title":"Implement a parser for exact catalog IDs, repository paths, `path:line`, URLs and same-change requirement/task identifiers.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:23"},{"id":"4.2","title":"Resolve parsed references through canonical routes and source-link rules; retain unresolved exact references for diagnostics.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:24"},{"id":"4.3","title":"Render exact links in proposal, design, requirements, scenarios and tasks while proving that similar display names remain plain text.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:25"},{"id":"5.1","title":"Define stable activity events for Git commits, spec diffs, lifecycle transitions, task transitions and path impact.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:29"},{"id":"5.2","title":"Build a deterministic projector shared by the specification detail page, Changes page and generated Markdown/LLM summaries.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:30"},{"id":"5.3","title":"Add the activity timeline to `/specs/:id` with source and architecture links plus explicit evidence labels.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:31"},{"id":"6.1","title":"Add changes, requirements and scenarios to the global palette/search index with stable IDs and section anchors.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:35"},{"id":"6.2","title":"Add exact requirement/scenario anchors, breadcrumb labels and backlinks without indexing entities removed from the current catalog.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:36"},{"id":"6.3","title":"Verify keyboard navigation and responsive rendering for list, detail, activity and search results.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:37"},{"id":"7.1","title":"Run focused extractor, discovery, history, diff, link-resolution, search and UI tests.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:41"},{"id":"7.2","title":"Run `npm run typecheck`, schema generation/check, catalog generation and the required rendered UI verification with cache busting.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:42"},{"id":"7.3","title":"Confirm the external Gavel tree is unchanged and document which results are source intent, derived impact and independent evidence.","done":true,"source":"openspec/changes/automate-sdd-workflow/tasks.md:43"}]}],"terms":[{"id":"portolan.adr","slug":"adr","context":"portolan","name":"ADR","definition":"A decision an estate wrote down with the alternative it rejected, read out of the record files a manifest step names and frozen: the body goes into the catalog exactly as written and is never regenerated from the model.","source":"GLOSSARY.md:7"},{"id":"portolan.aggregate","slug":"aggregate","context":"portolan","name":"Aggregate","definition":"What a domain extractor read as one thing: a root, its entities and value objects, the events it publishes, the commands and queries on it, and its lifecycle when the code keeps a table of one.","source":"GLOSSARY.md:11"},{"id":"portolan.answer","slug":"answer","context":"portolan","name":"Answer","definition":"What comes back from an rpc step, looked up in the contract that declares the method rather than recorded: a reply is the far end of the same hop, not a second thing that happened.","source":"GLOSSARY.md:15"},{"id":"portolan.bridge","slug":"bridge","context":"portolan","name":"Bridge","definition":"A service that more than half of the shortest paths between two contexts' services run through, counted on the undirected graph of who exchanges anything with whom. Ranked by betweenness - the share of shortest paths between every other pair of services that pass through it. Derived, never declared: the overview lists them and the service page wears the chip.","source":"GLOSSARY.md:19"},{"id":"portolan.catalog","slug":"catalog","context":"portolan","name":"Catalog","definition":"One source of facts in the shape `src/catalog.ts` decides: contexts, defs, flows, adrs, stores, modules, terms, repos and externals. A reader never sees one; the estate is the merge of several.","source":"GLOSSARY.md:25"},{"id":"portolan.chain","slug":"chain","context":"portolan","name":"Chain","definition":"What happens after an event, as far as the flows can say: each consumer followed into the flow where it hears the event, what it publishes after that, and the same question asked of those events.","source":"GLOSSARY.md:29"},{"id":"portolan.component","slug":"component","context":"portolan","name":"Component","definition":"The neutral reading of a service, for a repository that was not laid out for a domain model: an application, a webapp, a worker, a job, a function, a CLI, a library or a data pipeline, said by its kind. The wire and the code say service; the README and the setup wizard say component when the kind is neutral. Decided in portolan.0004.","source":"GLOSSARY.md:33"},{"id":"portolan.configuration-binding","slug":"configuration-binding","context":"portolan","name":"Configuration binding","definition":"One deployment environment's value for an environment variable source code names, with the file and line that supplied it. It may refine an already-observed call, channel or store, but never creates one by itself. Secret values are never kept; only safe references or a redacted marker reach the catalog.","source":"GLOSSARY.md:39"},{"id":"portolan.context","slug":"context","context":"portolan","name":"Context","definition":"The estate's top grouping level and nothing more: it owns services and states no relationship to its neighbours, because the map of who talks to whom is drawn from the calls and events themselves. Its kind says whether it is a bounded context, a system, a product, a team or a namespace.","source":"GLOSSARY.md:45"},{"id":"portolan.declared","slug":"declared","context":"portolan","name":"Declared","definition":"The status of a fact a fragment states and nothing has yet shown happening.","source":"GLOSSARY.md:50"},{"id":"portolan.deployment","slug":"deployment","context":"portolan","name":"Deployment","definition":"One place a service runs: an Argo CD Application reduced to what a deploy changes - environment, cluster, namespace, the repository and directory it deploys from, the revision that stands there, the images. Two readers say it: an extractor over the GitOps tree says what should run (basis `manifest`), a fetcher over the deployer says what does (basis `api`), and the merge lays the two over each other (basis `both`). A list on the catalog, joined to a service by the labels the Application carries, else by repository and directory; never a health or a sync state, which move without a commit.","source":"GLOSSARY.md:53"},{"id":"portolan.drift","slug":"drift","context":"portolan","name":"Drift","definition":"Where the GitOps tree and the deployer disagree about one deployment: the tree's word on the project, cluster, namespace, path, tracked revision or pinned images that the deployer says otherwise about. Kept on the merged row, worn as a chip on the service page, listed on the Problems page. Set only where the two differ; agreement leaves no mark.","source":"GLOSSARY.md:63"},{"id":"portolan.estate","slug":"estate","context":"portolan","name":"Estate","definition":"Everything the manifest's sources find, merged and validated as one: the whole a reader browses, dated from the sources that carry a stamp.","source":"GLOSSARY.md:69"},{"id":"portolan.event","slug":"event","context":"portolan","name":"Event","definition":"A fact in the past tense that an aggregate publishes, on a channel its service declares, with the shared definition of its payload in defs.","source":"GLOSSARY.md:72"},{"id":"portolan.external","slug":"external","context":"portolan","name":"External","definition":"A system outside the estate with a contract: what it answers on, read from the copy of its document vendored beside the adapter that calls it, and nothing else. Nobody in the estate provides it, so it sits at the root beside the contexts and has no aggregates and no repository.","source":"GLOSSARY.md:75"},{"id":"portolan.extractor","slug":"extractor","context":"portolan","name":"Extractor","definition":"A plugin that reads a tree or a specification and answers with a fragment. It runs before there is a merged catalog and is handed none.","source":"GLOSSARY.md:80"},{"id":"portolan.fetcher","slug":"fetcher","context":"portolan","name":"Fetcher","definition":"A plugin that brings something from elsewhere - a tree from a repository or a schema registry, a snapshot from a deployer - into a cache against a lock, so a later build reproduces it without a socket. A fetched tree is one the extractors read like any other; a fetched snapshot is a fragment the merge reads like any other.","source":"GLOSSARY.md:83"},{"id":"portolan.flow","slug":"flow","context":"portolan","name":"Flow","definition":"A walkthrough of steps between participants, owned by one context: derived from the code of one component, read from a `.flow.md` file, or overlaid by a verifier from a recorded trace.","source":"GLOSSARY.md:89"},{"id":"portolan.fragment","slug":"fragment","context":"portolan","name":"Fragment","definition":"A catalog written beside one service by one extractor, in the `portolan/` directory the sources glob finds. A fragment naming a peer it does not own is normal: referential integrity is a property of the union.","source":"GLOSSARY.md:93"},{"id":"portolan.generator","slug":"generator","context":"portolan","name":"Generator","definition":"A plugin that reads the merged catalog and answers with files: markdown, Mermaid, Backstage entities. It names files and never writes them.","source":"GLOSSARY.md:97"},{"id":"portolan.group","slug":"group","context":"portolan","name":"Group","definition":"The neutral reading of a context whose kind is system, product, team or namespace. The wire and the code say context; the README and the setup wizard say group when the kind is neutral. Decided in portolan.0004.","source":"GLOSSARY.md:100"},{"id":"portolan.hop","slug":"hop","context":"portolan","name":"Hop","definition":"One thing a step records: a call made, an rpc invoked or an event published, from one participant to another. Never a reply.","source":"GLOSSARY.md:104"},{"id":"portolan.host","slug":"host","context":"portolan","name":"Host","definition":"The side that runs the plugins, merges and validates the sources, stamps and writes the fragments and pages, and refuses a file name that climbs out of its output directory: `scripts/gen.mjs` and what it calls.","source":"GLOSSARY.md:107"},{"id":"portolan.lifecycle","slug":"lifecycle","context":"portolan","name":"Lifecycle","definition":"The states an aggregate root can be in and one move per edge, the method that makes it and the event it hands back, read off a table the code keeps and never off the branches of the methods. Terminal states are derived on the page and never written down.","source":"GLOSSARY.md:111"},{"id":"portolan.manifest","slug":"manifest","context":"portolan","name":"Manifest","definition":"`portolan.json`: where the facts come from, what produces them, and what turns them into something to read. Its schema is composed from what every declared plugin says it can be told.","source":"GLOSSARY.md:116"},{"id":"portolan.module","slug":"module","context":"portolan","name":"Module","definition":"A schema module the estate publishes or vendors, a proto module on the Buf Schema Registry or a subject in a Confluent registry. A module names its own owner; a service listing one it does not own reads it.","source":"GLOSSARY.md:120"},{"id":"portolan.owner","slug":"owner","context":"portolan","name":"Owner","definition":"Who to ask about a service, read from CODEOWNERS by a verifier.","source":"GLOSSARY.md:124"},{"id":"portolan.participant","slug":"participant","context":"portolan","name":"Participant","definition":"A lane in a flow: an actor, a service, a broker, a store, an external or an unknown. The order of participants is the order of lanes.","source":"GLOSSARY.md:126"},{"id":"portolan.peer","slug":"peer","context":"portolan","name":"Peer","definition":"The service that answers for what a component calls, told to the extractor by the manifest because the generated client names the package and the operation and only the manifest knows whose it is. A package with no peer line is called as unknown.","source":"GLOSSARY.md:129"},{"id":"portolan.phase","slug":"phase","context":"portolan","name":"Phase","definition":"One of the three passes the host makes over the manifest: extract, verify, generate. Each phase's steps run after the previous phase's files are on disk.","source":"GLOSSARY.md:134"},{"id":"portolan.pin","slug":"pin","context":"portolan","name":"Pin","definition":"A reader's own answer to where they keep coming back to: a kind and a catalog id, kept in the browser, resolved against the catalog at render time and going quiet when the build no longer has the thing.","source":"GLOSSARY.md:138"},{"id":"portolan.plugin","slug":"plugin","context":"portolan","name":"Plugin","definition":"A program that takes one JSON message on stdin and answers with one on stdout, run as a process or as a wasm module, in whichever language it was written. An extractor, a verifier, a generator or a fetcher.","source":"GLOSSARY.md:142"},{"id":"portolan.problem","slug":"problem","context":"portolan","name":"Problem","definition":"An edge that leaves the chart: a call nobody answers, a channel with a second publisher, a column whose lineage crosses a service boundary. Listed on the Problems page, errors first.","source":"GLOSSARY.md:146"},{"id":"portolan.project","slug":"project","context":"portolan","name":"Project","definition":"A named source root in the manifest, so the pipeline inputs that belong to one repository have one name on the Settings page.","source":"GLOSSARY.md:150"},{"id":"portolan.recording","slug":"recording","context":"portolan","name":"Recording","definition":"A file of traces kept beside a project, under `telemetry/recordings/`, that a verifier reads on every run. One is added from the page or by hand; either way it is a file in the repository, so the next regeneration verifies the same hops. A recording is also kept as an **example** of each flow it showed: which steps ran, how long each took, the names the spans carried - never a query text, a header or a path with an id in it.","source":"GLOSSARY.md:171"},{"id":"portolan.repository-pin","slug":"repository-pin","context":"portolan","name":"Repository pin","definition":"A repository the estate was read at and the commit it was read at, so a source path in another repository is still a link. A fact about the estate, not a field on a service.","source":"GLOSSARY.md:153"},{"id":"portolan.service","slug":"service","context":"portolan","name":"Service","definition":"What a context owns: a repository path, what it provides and consumes, its aggregates, the stores and modules it touches. Its kind says what it is when it is not a service in the domain sense; see component.","source":"GLOSSARY.md:157"},{"id":"portolan.source","slug":"source","context":"portolan","name":"Source","definition":"A file the manifest's sources globs find: a fragment an extractor wrote, a hand-written file in `data/`, a fetched repository's pin.","source":"GLOSSARY.md:161"},{"id":"portolan.stamp","slug":"stamp","context":"portolan","name":"Stamp","definition":"The commit and date the host writes onto a fragment: the last commit that touched the input it was read from, never a clock a plugin read. Decided in portolan.0002.","source":"GLOSSARY.md:164"},{"id":"portolan.status","slug":"status","context":"portolan","name":"Status","definition":"Whether the estate stands behind a fact: verified, declared or unresolved, best first.","source":"GLOSSARY.md:168"},{"id":"portolan.step","slug":"step","context":"portolan","name":"Step","definition":"One move in a flow: from a participant to a participant, an rpc, an event or a call, carrying a status. The manifest borrows the word for one plugin run on one input, and the host keys the files it wrote by that; the two meanings never meet in one file.","source":"GLOSSARY.md:179"},{"id":"portolan.store","slug":"store","context":"portolan","name":"Store","definition":"Where a service keeps state: a database with its tables, views, keys and column lineage, naming its own owner. A service that lists a store it does not own reads it.","source":"GLOSSARY.md:184"},{"id":"portolan.term","slug":"term","context":"portolan","name":"Term","definition":"One entry of a context's glossary, read out of its `GLOSSARY.md`: the word and what it means, carried through as written.","source":"GLOSSARY.md:188"},{"id":"portolan.trail","slug":"trail","context":"portolan","name":"Trail","definition":"The pages a reader has been to, most recent first, kept in the browser.","source":"GLOSSARY.md:191"},{"id":"portolan.unknown","slug":"unknown","context":"portolan","name":"Unknown","definition":"A participant a flow names that the catalog has no service for: drawn as unknown and its steps left unresolved, never dropped.","source":"GLOSSARY.md:194"},{"id":"portolan.unresolved","slug":"unresolved","context":"portolan","name":"Unresolved","definition":"The status of a reference nothing in the catalog answers: a call to a method no service provides, an event nobody publishes.","source":"GLOSSARY.md:197"},{"id":"portolan.verified","slug":"verified","context":"portolan","name":"Verified","definition":"The status of a fact a recorded trace showed happening.","source":"GLOSSARY.md:200"},{"id":"portolan.verifier","slug":"verifier","context":"portolan","name":"Verifier","definition":"A plugin that reads evidence, traces or CODEOWNERS, and overlays what it found on the merged catalog: a status, an owner.","source":"GLOSSARY.md:202"},{"id":"portolan.wire-format","slug":"wire-format","context":"portolan","name":"Wire format","definition":"The JSON keys as a fragment spells them. `contexts` and `services` are kept as they were so an old catalog loads; a kind on either says how to read the node. Decided in portolan.0004.","source":"GLOSSARY.md:205"}]}}</script>
  <script>
    (() => {
      const model = JSON.parse(document.getElementById('portolan-reference').textContent);
      const byId = new Map(model.resources.map(resource => [resource.id, resource]));
      const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const slug = value => 'r-' + Array.from(new TextEncoder().encode(value)).map(byte => byte.toString(16).padStart(2, '0')).join('');
      const pretty = value => esc(JSON.stringify(value, null, 2));
      const labelFor = id => byId.get(id)?.name || id;

      document.getElementById('side-title').textContent = model.title;
      document.title = model.title + ' — Architecture reference';

      const overview = `<section class="overview" id="overview"><p class="eyebrow">Architecture reference</p><h2>${esc(model.title)}</h2>${model.summary ? `<p class="intro">${esc(model.summary)}</p>` : '<p class="intro">A complete, portable reading of this catalog profile. Every section keeps its exact catalog record for audit.</p>'}<div class="counts">${model.counts.map(item => `<div class="count"><strong>${item.value}</strong><span>${esc(item.label)}</span></div>`).join('')}</div></section>`;

      const section = resource => `<section class="resource" data-kind="${esc(resource.kind)}" data-search="${esc([resource.kindLabel, resource.id, resource.name, resource.summary, ...(resource.badges || [])].join(' ').toLowerCase())}" id="${slug(resource.id)}"><div class="resource-head"><div><span class="kind">${esc(resource.kindLabel)}</span><h2>${esc(resource.name)}</h2><div class="id mono">${esc(resource.id)}</div></div>${resource.badges?.length ? `<div class="badges">${resource.badges.map(badge => `<span class="badge">${esc(badge)}</span>`).join('')}</div>` : ''}</div>${resource.summary ? `<p class="summary">${esc(resource.summary)}</p>` : ''}${resource.relationships?.length ? `<div class="relationships"><h3>Relationships</h3><div class="relation-list">${resource.relationships.map(link => byId.has(link.id) ? `<a class="relation" href="#${slug(link.id)}"><span>${esc(link.label)}</span><code>${esc(labelFor(link.id))}</code></a>` : `<span class="relation"><span>${esc(link.label)}</span><code>${esc(link.id)}</code></span>`).join('')}</div></div>` : ''}<details class="record"><summary>Exact catalog record</summary><pre>${pretty(resource.record)}</pre></details></section>`;

      document.getElementById('content').innerHTML = overview + model.resources.map(section).join('') + `<details class="record catalog-record"><summary>Complete merged catalog JSON</summary><pre>${pretty(model.catalog)}</pre></details>`;

      const grouped = () => {
        const groups = new Map();
        for (const resource of model.resources) {
          if (!groups.has(resource.kindLabel)) groups.set(resource.kindLabel, []);
          groups.get(resource.kindLabel).push(resource);
        }
        return groups;
      };
      const renderNav = visible => {
        const allowed = new Set(visible.map(item => item.id));
        document.getElementById('nav').innerHTML = `<div class="nav-group"><a class="nav-link" href="#overview"><span class="nav-kind">⌂</span><span class="nav-name">Overview</span></a></div>` + Array.from(grouped()).map(([kind, resources]) => {
          const items = resources.filter(resource => allowed.has(resource.id));
          if (!items.length) return '';
          return `<div class="nav-group"><div class="nav-heading"><span>${esc(kind)}</span><span>${items.length}</span></div>${items.map(resource => `<a class="nav-link" href="#${slug(resource.id)}" title="${esc(resource.id)}"><span class="nav-kind">${esc(resource.kind.slice(0, 3))}</span><span class="nav-name">${esc(resource.name)}</span></a>`).join('')}</div>`;
        }).join('') || '<div class="no-results">No matching resources.</div>';
      };
      renderNav(model.resources);

      const search = document.getElementById('search');
      const filter = () => {
        const query = search.value.trim().toLowerCase();
        const visible = model.resources.filter(resource => !query || [resource.kindLabel, resource.id, resource.name, resource.summary, ...(resource.badges || [])].join(' ').toLowerCase().includes(query));
        const allowed = new Set(visible.map(item => item.id));
        document.querySelectorAll('.resource').forEach(node => { node.hidden = !allowed.has(model.resources.find(resource => slug(resource.id) === node.id)?.id); });
        renderNav(visible);
      };
      search.addEventListener('input', filter);
      document.addEventListener('keydown', event => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); search.focus(); search.select(); }
        if (event.key === 'Escape') { document.body.dataset.nav = ''; search.blur(); }
      });

      const root = document.documentElement;
      const setTheme = theme => { root.dataset.theme = theme; try { localStorage.setItem('portolan-reference-theme', theme); } catch {} };
      let saved = ''; try { saved = localStorage.getItem('portolan-reference-theme') || ''; } catch {}
      setTheme(saved || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'));
      document.getElementById('theme').addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
      document.getElementById('nav-open').addEventListener('click', () => { document.body.dataset.nav = 'open'; });
      document.getElementById('nav').addEventListener('click', event => { if (event.target.closest('a')) document.body.dataset.nav = ''; });
    })();
  </script>
</body>
</html>
