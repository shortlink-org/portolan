mitted default options; ensure an explicit step suppresses the implicit duplicate.\n- [x] 1.3 Run discovery and extraction against Portolan's own change and the read-only Gavel project fixture.\n\n## 2. Git history and branch model\n\n- [x] 2.1 Define a derived specification-history model that references source artifacts without adding Git metadata to `specs[]`.\n- [x] 2.2 Reuse the host history reader to resolve first/latest commit, author, date and uncommitted state for change artifacts, including unavailable reasons.\n- [x] 2.3 Extend branch catalog diff with requirement, scenario, task and lifecycle changes using stable identifiers.\n\n## 3. Automatic path impact\n\n- [x] 3.1 Derive changed repository paths for the active comparison using the existing branch draft/history pipeline.\n- [x] 3.2 Resolve each path to the longest unique repository/service owner and preserve repository-level ambiguous or unmatched results.\n- [x] 3.3 Present impact as `changed with` on specification and Changes pages without promoting it to implementation evidence.\n\n## 4. Exact links\n\n- [x] 4.1 Implement a parser for exact catalog IDs, repository paths, `path:line`, URLs and same-change requirement/task identifiers.\n- [x] 4.2 Resolve parsed references through canonical routes and source-link rules; retain unresolved exact references for diagnostics.\n- [x] 4.3 Render exact links in proposal, design, requirements, scenarios and tasks while proving that similar display names remain plain text.\n\n## 5. Activity feed\n\n- [x] 5.1 Define stable activity events for Git commits, spec diffs, lifecycle transitions, task transitions and path impact.\n- [x] 5.2 Build a deterministic projector shared by the specification detail page, Changes page and generated Markdown/LLM summaries.\n- [x] 5.3 Add the activity timeline to `/specs/:id` with source and architecture links plus explicit evidence labels.\n\n## 6. Search and navigation\n\n- [x] 6.1 Add changes, requirements and scenarios to the global palette/search index with stable IDs and section anchors.\n- [x] 6.2 Add exact requirement/scenario anchors, breadcrumb labels and backlinks without indexing entities removed from the current catalog.\n- [x] 6.3 Verify keyboard navigation and responsive rendering for list, detail, activity and search results.\n\n## 7. Integrated verification\n\n- [x] 7.1 Run focused extractor, discovery, history, diff, link-resolution, search and UI tests.\n- [x] 7.2 Run `npm run typecheck`, schema generation/check, catalog generation and the required rendered UI verification with cache busting.\n- [x] 7.3 Confirm the external Gavel tree is unchanged and document which results are source intent, derived impact and independent evidence.\n"},{"kind":"requirements","path":"openspec/changes/automate-sdd-workflow/specs/automatic-sdd-workflow/spec.md","body":"# Spec Delta\n\n## ADDED Requirements\n\n### Requirement: Standard OpenSpec layouts are connected automatically\nPortolan SHALL detect a project containing `openspec/changes/\u003cchange\u003e/.openspec.yaml` and SHALL include its normalized SDD fragment without requiring plugin options or a manually authored extraction step. An explicit SDD step for the same project SHALL take precedence and SHALL run only once.\n\n#### Scenario: Standard OpenSpec repository is discovered\n- **WHEN** project discovery scans a repository with at least one standard OpenSpec change\n- **THEN** SDD is selected with the project root as input and no redundant default options\n\n#### Scenario: Explicit configuration already exists\n- **WHEN** the manifest already contains an SDD extraction step for the project\n- **THEN** Portolan uses that step and does not add or run an implicit duplicate\n\n### Requirement: Specification history comes from Git\nPortolan SHALL derive first and latest change metadata for a specification and its source artifacts from repository history without writing that metadata into the extracted fragment.\n\n#### Scenario: Full history is available\n- **WHEN** a specification source path has committed history\n- **THEN** its page shows the first commit, latest commit, author and date with links to the exact source revision when repository information is available\n\n#### Scenario: History is unavailable\n- **WHEN** the checkout is shallow, uncommitted-only or not a Git repository\n- **THEN** the specification remains available and history is shown as unavailable with the reason\n\n### Requirement: Changed paths produce explainable impact\nPortolan SHALL relate branch changes to catalog components using repository identity and the longest exact owning path. The relation SHALL be presented as change impact and SHALL NOT be presented as implementation or conformance evidence.\n\n#### Scenario: Changed file belongs to one service\n- **WHEN** a changed repository-relative file is under exactly one known service path\n- **THEN** the specification activity links that service and explains the matching path\n\n#### Scenario: Changed file has no unique owner\n- **WHEN** no service path matches or multiple owners remain equally specific\n- **THEN** impact stays at repository level and Portolan does not choose a service\n\n### Requirement: Only exact textual references become links\nPortolan SHALL recognize web URLs, repository-relative paths with optional lines, exact catalog IDs, and same-change requirement or task IDs. Portolan SHALL preserve unresolved exact references and SHALL NOT link ordinary prose by semantic similarity.\n\n#### Scenario: Exact catalog ID resolves\n- **WHEN** a specification artifact contains an exact ID present in the merged catalog\n- **THEN** the rendered text links to that entity's canonical Portolan route\n\n#### Scenario: Similar display name is ambiguous\n- **WHEN** prose contains a name that resembles one or more catalog entities but is not an exact identifier\n- **THEN** the text remains prose and no relationship is created\n\n#### Scenario: Source path includes a line\n- **WHEN** an artifact mentions a repository-relative `path:line` that exists inside the project root\n- **THEN** the rendered link opens that exact source location\n\n### Requirement: Activity is deterministic and shared\nPortolan SHALL build one activity stream from Git history, spec diffs, lifecycle transitions, task transitions and path impact. The same normalized events SHALL feed the specification page, Changes presentation and generated summaries.\n\n#### Scenario: Several event kinds have the same timestamp\n- **WHEN** activity events cannot be ordered by time alone\n- **THEN** Portolan orders them deterministically by kind and stable key\n\n#### Scenario: A branch changes requirements and tasks\n- **WHEN** the compared branch adds a requirement and completes a task\n- **THEN** both events appear in the activity feed and Changes view with links to their source sections\n\n### Requirement: Specifications participate in global navigation\nPortolan SHALL index changes, requirements and scenarios for global search and command palette navigation. Results SHALL retain their SDD kind and SHALL navigate to a stable route or section anchor.\n\n#### Scenario: Requirement is found by title or ID\n- **WHEN** a reader searches for an exact requirement ID or words from its title\n- **THEN** the result is labeled as a requirement and opens that requirement on its specification page\n\n#### Scenario: Removed requirement exists only in a branch diff\n- **WHEN** a requirement exists on the comparison base but not in the current catalog\n- **THEN** it remains visible in Changes but is not added to the current global search index\n\n### Requirement: Automatic conclusions preserve evidence boundaries\nPortolan SHALL label author intent, changed-with impact, declared architecture, test evidence and runtime observation as separate states. Task completion, co-change and exact links SHALL NOT independently produce verified conformance.\n\n#### Scenario: Every task is checked\n- **WHEN** a specification has a complete checklist but no runtime observation\n- **THEN** lifecycle may be complete while conformance remains unverified\n\n#### Scenario: Code and specification changed together\n- **WHEN** Git shows a code path and specification artifact in the same commit\n- **THEN** Portolan records related change impact without claiming that the requirement is implemented\n"}],"requirements":[{"id":"automate-sdd-workflow/automatic-sdd-workflow/standard-openspec-layouts-are-connected-automatically","title":"Standard OpenSpec layouts are connected automatically","text":"Portolan SHALL detect a project containing `openspec/changes/\u003cchange\u003e/.openspec.yaml` and SHALL include its normalized SDD fragment without requiring plugin options or a manually authored extraction step. An explicit SDD step for the same project SHALL take precedence and SHALL run only once.","source":"openspec/changes/automate-sdd-workflow/specs/automatic-sdd-workflow/spec.md:5","scenarios":[{"name":"Standard OpenSpec repository is discovered","when":["project discovery scans a repository with at least one standard OpenSpec change"],"then":["SDD is selected with the project root as input and no redundant default options"]},{"name":"Explicit configuration already exists","when":["the manifest already contains an SDD extraction step for the project"],"then":["Portolan uses that step and does not add or run an implicit duplicate"]}]},{"id":"automate-sdd-workflow/automatic-sdd-workflow/specification-history-comes-from-git","title":"Specification history comes from Git","text":"Portolan SHALL derive first and latest change metadata for a specification and its source artifacts from repository history without writing that metadata into the extracted fragment.","source":"openspec/changes/automate-sdd-workflow/specs/automatic-sdd-workflow/spec.md:16","scenarios":[{"name":"Full history is available","when":["a specification source path has committed history"],"then":["its page sho code and specifications that already describe a software estate. It is documented here as the system that extracts, merges, validates and presents those facts.","kind":"system","services":[{"id":"portolan.host","slug":"host","name":"Host","repo":"github.com/shortlink-org/portolan","path":"scripts","readme":"# Host\n\nThe side of portolan that runs. `npm run gen` reads the manifest, runs every\nplugin it names, writes what comes back, merges the sources into one estate\nand validates the union. Nothing here draws anything.\n\n## What it does\n\n- Refuses a `portolan.json` that does not match `schema/portolan.schema.json`,\n  the schema `npm run schema` composes out of what every declared plugin says\n  it can be told.\n- Runs three phases in order, extract, verify, generate, and hands each\n  plugin one JSON message: the input root and output directory for an\n  extractor, the merged catalog for a verifier or a generator, the step's\n  options unread. The output path lets a fragment point at a companion file\n  returned in the same response without letting the plugin write it itself.\n- Writes no provenance into a fragment. When a source last changed, and in\n  which commit, is read from the history of the checkout wherever the catalog\n  is read - here, by the LikeC4 generator, by the architecture diff and by\n  the site as Vite builds it - so a fragment is content and nothing else, and\n  regenerating from the same sources changes no byte (portolan.0010).\n- Writes the files a plugin named, refuses a name that climbs out of the\n  step's output directory, keeps a listing per step of what it wrote, and\n  deletes what stopped being generated (portolan.0001).\n- Merges every source the manifest's globs find and validates the union with\n  the code the site runs: `src/merge.ts`, `src/catalog.ts`, `src/enrich.ts`.\n- In `--check` mode writes nothing and fails on the first file that differs\n  from disk, saying where the file first differs and what changed among the\n  step's inputs since its output was last committed - the history is the\n  record of the last generation, so nothing else has to be. Either way it\n  leaves `.portolan/build-report.json` for the Settings page.\n\n## What it does not do\n\n- Know what any plugin can be told: options pass through, and the schema is\n  the plugins' answer, not the host's.\n- Read a plugin's stdout for anything but the one message, or its stderr for\n  anything but notes; a warning is kept beside the step in the build report.\n- Draw the C4 model: `gen-likec4.mjs` writes `likec4/` from the same merged\n  catalog, and the site draws. It runs as the last step of `gen.mjs` -\n  written, or in check mode held to the catalog like every generated page -\n  and on its own before `dev`.\n\n## Files\n\n- `gen.mjs`, the three phases; `plugin-host.mjs` and\n  `plugin-wasm-worker.mjs`, one plugin run as a process or a wasm module;\n  `manifest.mjs`, the manifest read and checked; `catalog-sources.mjs`, the\n  merge; `output-path.mjs`, the one refusal of an unsafe name;\n  `build-report.mjs`, what the Settings page reads.\n- `schema.mjs`, the manifest schema composed; `gen-likec4.mjs`, the C4 model;\n  `diff.mjs`, what a branch changes about the architecture; `forge-comment.mjs`,\n  that report put on the pull request as one comment kept current;\n  `forge-release.mjs`, the same report as one section of a release's notes;\n  `forge.mjs`, what those two share - which forge the CI is, and how to talk\n  to it; `history.mjs`, what the checkout's history says about every file,\n  for a plugin that asks and for the provenance of every source;\n  `provenance.mjs`, that provenance handed to the site as one virtual module;\n  `site-sources.mjs`, the sources themselves, one virtual module per profile;\n  `mcp-server.mjs`, the generated agent bundle exposed as read-only MCP tools\n  over stdio;\n  `output-diff.mjs`, where a generated file first differs from what the\n  generator produces; `site-docs.mjs`, generated documentation put into the\n  built site; `local-api.mjs`, what the dev server answers the site with;\n  `branch-drafts.mjs`, a branch's draft of one project - generated from\n  worktrees of its tip and merge-base, listed and deleted (portolan.0019).","kind":"cli","technologies":["Node.js"],"provides":[],"consumes":[],"aggregates":[],"commands":[{"runner":"npm","name":"dev","run":"npm run dev","body":"node cli/portolan.mjs dev","source":"package.json:61"},{"runner":"npm","name":"build","run":"npm run build","body":"node cli/portolan.mjs build","source":"package.json:62"},{"runner":"npm","name":"preview","run":"npm run preview","body":"vite preview","source":"package.json:63"},{"runner":"npm","name":"test","run":"npm test","body":"vitest run","source":"package.json:64"},{"runner":"npm","name":"test:go","run":"npm run test:go","body":"GOFLAGS=-mod=mod go test ./...","source":"package.json:65"},{"runner":"npm","name":"test:package","run":"npm run test:package","body":"node scripts/package-smoke.mjs","source":"package.json:67"},{"runner":"npm","name":"test:watch","run":"npm run test:watch","body":"vitest","source":"package.json:68"},{"runner":"npm","name":"typecheck","run":"npm run typecheck","body":"tsc --noEmit \u0026\u0026 tsc -p plugins/extract-ts","source":"package.json:69"},{"runner":"npm","name":"lint","run":"npm run lint","body":"oxlint src scripts cli plugins/extract-ts","source":"package.json:70"},{"runner":"npm","name":"likec4:gen","run":"npm run likec4:gen","body":"node scripts/gen-likec4.mjs \u0026\u0026 node scripts/likec4-bundle.mjs","source":"package.json:71"},{"runner":"npm","name":"likec4:validate","run":"npm run likec4:validate","body":"node scripts/likec4-bundle.mjs --validate","source":"package.json:72"},{"runner":"npm","name":"plugins:build","run":"npm run plugins:build","body":"GOFLAGS=-mod=mod GOOS=wasip1 GOARCH=wasm go build -trimpath -ldflags=\"-s -w\" -o plugins/portolan-go.wasm ./plugins/cmd/portolan-go \u0026\u0026 javac --release 21 -d plugins/extract-java/build plugins/extract-java/src/org/portolan/extract/*.java \u0026\u0026 dotnet build plugins/extract-csharp-ddd -c Release --nologo -v q","source":"package.json:74"},{"runner":"npm","name":"schema","run":"npm run schema","body":"npm run plugins:build \u0026\u0026 node scripts/schema.mjs","source":"package.json:75"},{"runner":"npm","name":"schema:check","run":"npm run schema:check","body":"npm run plugins:build \u0026\u0026 node scripts/schema.mjs --check","source":"package.json:76"},{"runner":"npm","name":"gen","run":"npm run gen","body":"npm run plugins:build \u0026\u0026 node scripts/gen.mjs","source":"package.json:77"},{"runner":"npm","name":"gen:check","run":"npm run gen:check","body":"npm run plugins:build \u0026\u0026 node scripts/gen.mjs --check","source":"package.json:78"},{"runner":"npm","name":"diff","run":"npm run diff","body":"node scripts/diff.mjs","source":"package.json:79"},{"runner":"npm","name":"prepack","run":"npm run prepack","body":"npm run plugins:build","source":"package.json:80"}]},{"id":"portolan.plugins","slug":"plugins","name":"Plugins","repo":"github.com/shortlink-org/portolan","path":"plugins","readme":"# Generators\n\nA generator turns the catalog into something else. The built-in generators\nproduce Markdown and LLM indexes, standalone Mermaid diagrams, a Backstage\nSoftware Catalog bundle, and a DX Software Catalog apply plan; each lives in\nits own directory beside the plugin. `fetch-dx` independently reads DX into a\ncatalog fragment; neither direction requires the other.\n\nThe contract is one JSON message in and one JSON message out:\n\n```\n→ { \"portolanVersion\": \"0.1.0\", \"catalog\": { ... }, \"options\": { ... } }\n← { \"files\": [{ \"name\": \"shop/oms/README.md\", \"contents\": \"...\" }] }\n```\n\nThere is a second question, asked with `\"kind\": \"describe\"`, and the answer is\nthe plugin itself rather than its work:\n\n```\n→ { \"portolanVersion\": \"0.1.0\", \"kind\": \"describe\" }\n← { \"files\": [],\n    \"describe\": { \"name\": \"extract-go\", \"summary\": \"...\",\n                  \"category\": \"code\", \"phases\": [\"extract\"],\n                  \"options\": { \"type\": \"object\", \"additionalProperties\": false,\n                               \"properties\": { \"context\": { ... } } } } }\n```\n\nThe options a plugin takes are facts the source does not carry, so only the\nplugin knows what it can be told. `npm run schema` asks all of them and composes\n`schema/portolan.schema.json`, which an editor reads while the manifest is being\nwritten and `gen` checks before it runs anything. `additionalProperties: false`\nis what makes that worth having: `encoding/json` drops a field it does not\nrecognise, so before this a misspelled option was no option at all and nothing\nsaid so.\n\n`category` is what the plugin reads or makes, one of `code`, `contracts`,\n`messaging`, `data`, `infrastructure`, `repository`, `documents`, `evidence`,\n`sources` and `exports` (the constants in `plugin/describe.go`). A phase says\nwhere in a run a plugin goes; the category says what kind of fact it is after,\nwhich is how the site's `/plugins` page groups it. `npm run schema` also writes\n`src/lib/plugin-index.json` - every declared plugin as it describes itself,\nwith how the manifest runs it - and that page and the landing page's list of\ninputs are rendered from it, so a plugin added to `portolan.json` appears on\nboth without being written down twice.\n\nA descriptor may also carry `needs`: what the host must put in the request\nbeyond the tree, because a sandboxed module cannot reach it. The one need so\nfar is `history` (portolan.0007) - when each file under the root was first\ncommitted and last changed, read by the host from one `git log` and handed\nover as `input.history`, keyed by the path the plugin would open. `extract-adr`\nasks for it; a plugin that does not ask is handed nothing.\n\nA generator **names** files; it never writes them. `scripts/gen.mjs` writes what\ncomes back, refuses a name that points outside the output directory, and deletes\npages that stopped being generated. That is what lets a generator run as a wasm\nmodule with no directory preopened at all — the sandbox is not a restriction\nworked around, it is the reason the protocol has this shape.\n\nThree obligations, and they are the whole of it:\n\n1. **Valid output.** Every file a generator names is committed and read.\n2. **Determinism.** The same catalog produces byte-identical output, so\n   reviewing generated documentation is reviewing a diff. Sort anything that\n   comes out of a map; never read a clock.\n3. **One decisive response.** A malformed request, incompatible protocol,\n   unsafe filename or invalid response fails the run. Non-fatal extraction\n   notes go to stderr; there is no advisory response property a caller may\n   accidentally ignore. A note that opens with `warning: ` is kept beside the\n   step in `.portolan/build-report.json`. The Settings page classifies and\n   groups those notes by plugin, stable rule and severity. Typed CEL policies\n   in `portolan.json` can suppress reviewed diagnostics only with an explicit\n   reason; the host evaluates them and records the decision in the build report.\n\nThe repository enforces those obligations with schema/field coverage tests,\nbyte-for-byte permutation tests, generated-link and anchor checks, Mermaid\nparser checks, and Backstage relationship validation. A new catalog field must\neither be rendered or be explicitly acknowledged by the relevant exporter.\n\n## Adding one\n\n1. Write it. In Go, a new package here whose `run` hands its options\n   type to `plugin.Serve`, which reads the request, answers a describe and calls\n   the work; `catalog.Catalog` from `github.com/shortlink-org/portolan/catalog`\n   is the mirror of the schema, and `internal/goscan` is the tree as syntax -\n   the files parsed once, the import path of each package, the string\n   constants followed to their literals - which River and Watermill share and\n   the next Go extractor should not copy. In Python, the same three things live in\n   `pyplugin/` - `protocol.py`, `source.py` for the tree as syntax, and\n   `catalog.py` for the fragment shapes - and `extract-django` and\n   `extract-celery` are what using them looks like. In any other language,\n   anything that speaks the protocol above.\n2. Describe it. An `options.schema.json` beside the source, embedded with\n   `go:embed` and returned in the descriptor. `schematest.Check` in a test keeps\n   it from drifting from the options struct: a field renamed on one side and not\n   the other fails, and so does an option with no description.\n3. Build it. A sandboxed built-in Go plugin is a library package with\n   `Serve(io.Reader, io.Writer) error`; add it to the map in\n   `plugins/cmd/portolan-go/main.go`, and `plugins:build` in `package.json`\n   puts it in `plugins/portolan-go.wasm` with the rest (a test keeps the map\n   and `portolan.json` in step). A built-in that genuinely needs the Go\n   toolchain gets a small command under `plugins/cmd/` and is declared as a\n   `process`; `http-clients` is the example. A plugin of your own is its own\n   module: `GOOS=wasip1 GOARCH=wasm go build`.\n4. Declare it in `portolan.json`, under `plugins` (how to run it) and\n   `generate` (what to run it on), then run `npm run schema` so the manifest\n   schema learns its options.\n\n```json\n{\n  \"plugins\": [\n    { \"name\": \"markdown\", \"wasm\": { \"url\": \"file://plugins/portolan-go.wasm\" } }\n  ],\n  \"generate\": [\n    { \"plugin\": \"markdown\", \"out\": \"docs\", \"options\": { \"title\": \"Example estate\" } }\n  ]\n}\n```\n\n## Lifecycles\n\nAn aggregate whose root has a status gets a `lifecycle` on the catalog: the\nstates, the first being where a new root starts, and one move per edge - the\nmethod that makes it and the event it hands back. All three extractors read it\noff a table the code keeps, never off the branches of the methods, because the\ntable is the claim and the methods are held to it: an edge in the table no\nmethod makes, a move into a state the table lacks, and a status changed\noutside the one way through the table are each reported.\n\nIn Go the table is a `go-sdk/fsm` rule set, `var Rules = fsm.TransitionRuleSet{\nStateLive: {EventRevoke: StateRevoked}, …}`, with the states and events as\nstring constants; the method whose body calls `TriggerEvent` is the mover, and\nevery exported method that hands it a constant makes the edges that constant\nnames. The event type a method returns is what its last move publishes - a\nmethod lapsing a lock and then locking again hands `AccountLocked` back for\nthe lock. In TypeScript it is `export const TRANSITIONS = { open: [\"checked-out\"],\n… }` and the method that assigns `this.status`; see `extract-ts/README.md`. In\nRust it is `pub const TRANSITIONS: \u0026[(\u0026str, \u0026[\u0026str])] = \u0026[(\"placed\", \u0026[\"confirmed\"]),\n…]` and the method that assigns `self.status`, handed a string or a variant of\nthe status enum; see `extract-rust/README.md`. In Python it is that mapping on\nthe Django model, beside the `TextChoices` that names the states, and the\nmethod assigning `self.status` - or django-fsm's `@transition(field=status,\nsource=…, target=…)`, which is the same table written one edge at a time; see\n`extract-django/README.md`. In Java it is `TRANSITIONS` beside the status enum\nand the method assigning `this.status`; Java is also the one language here with\na vocabulary for the model, so the rest of `extract-java` reads what jMolecules\ndeclares rather than what the layout implies.\nTerminal states are derived on the page - nothing leads out - and never\nwritten down. A move the clock makes, a session expiring, a lock running out,\nis not a move: nothing runs when it happens, so it is not in the table.\n\n## Enums\n\nAn aggregate's fields take some of their values from closed sets - a reason,\na status, a code - and a consumer of its events switches on them. Those sets\nare the aggregate's `enums`: one entry per set, id `\u003caggregate\u003e.\u003cslug\u003e`,\nthe values in declaration order, each with its doc and a `deprecated` mark\nwhen the source carries one. A status enum is read here as well as by the\nlifecycle: the lifecycle keeps the moves, the enum keeps the doc on each\nvalue, and a page may draw both.\n\nWhat counts as one is a convention per language, and each extractor's README\nsays which. In Go, which has no enum, it is a named type over a basic one -\n`type Reason string` - and a const block whose constants are of that type,\nlooked for in the aggregate's package, under `vo/`, and under `event/`;\na value's name is the constant's literal, because that is what the wire\ncarries, and the constant's own name only for an iota. A `Deprecated:`\nparagraph in the doc marks the value. In Rust it is a `pub enum` whose every\nvariant is a bare name, the literal an `as_str` answers standing in for the\nvariant. In Java it is a top-level enum in the aggregate's package. In PHP it\nis a backed `enum` anywhere in the module, and on an Eloquent model the\nconstants that share a prefix - `STATUS_PENDING = 'pending'` beside\n`STATUS_CLOSED = 'closed'` - with `@deprecated` in a constant's docblock\nmarking the value; see `extract-laravel/README.md`. In a PHP tree laid out\nby bounded context (`extract-php-ddd`) it is a backed `enum` under a module's\n`Domain/`. In a .NET modular monolith (`extract-csharp-ddd`) it is a C# `enum`\nin the aggregate's directory, `[Obsolete]` marking a value. In proto,\nthe enums the messages reach through their fields sit on the interface as\n`enums`, with the numbers the wire uses.\n\n## A repository without a domain model\n\n`extract-project` is the baseline extractor for any repository. It reads only\nREADME and build/deployment manifests, emits a neutral group and component,\nand leaves `aggregates` empty. This is intentional: a package called `domain`\nis not evidence that the project models aggregates. OpenAPI, AsyncAPI,\nGraphQL, proto and SQL extractors merge their facts into the same component.\n\nThe language-specific domain extractors are optional enrichments. The local\nsetup wizard offers one only when it finds the structure that extractor\nrequires; for Go this means an aggregate package in either\n`internal/domain/\u003caggregate\u003e` or `internal/\u003caggregate\u003e/domain`, containing the\nroot struct named after that aggregate. The extractor follows the same choice\nfor application use cases, transport adapters, policies, integration-event\nDTOs, and assembly bindings, so horizontal layers and feature slices can\ncoexist while a service is being migrated.\n\nThe SQL extractor follows the same migration path. With no `repositories` or\n`projectors` option it discovers both\n`internal/infrastructure/repository/\u003caggregate\u003e/migrations` and\n`internal/\u003caggregate\u003e/infrastructure/repository/migrations` (and the matching\nprojector forms), merging every package into one store. An explicit root keeps\nthe original collection layout for TypeScript, Rust, Java, or custom trees and\nmay also point directly at one feature repository.\n\nWho reads and writes each table comes from the SQL strings in those\nrepository packages and, anywhere in the module, from gorm, sqlx, sqlc, ent\nand squirrel calls, each recognised by its import path. An ent schema adds its\ntables when no migration creates them. A table name the code does not give as\na literal or a constant is reported, never guessed; see\n[extract-sql](extract-sql/README.md).\n\n`extract-river` is another independent enrichment for Go repositories. It\njoins a job argument's `Kind()` to `Client.Insert`/`InsertTx` and the\n`InsertMany*` batches, the selected queue, `Worker[Args].Work`, and\n`river.AddWorker`. The result is a work-queue channel plus a two-hop\nenqueue/dispatch flow, with payload fields and source lines. It does not need\naggregates and does not treat a job as a domain event. The job type is\nfollowed through locals, constructors' results and parameters up to the\ncallers, so an `Enqueue(ctx, args river.JobArgs, opts)` wrapper is read once\nper concrete job passed to it, and a worker registered as\n`river.AddWorker(workers, NewSendWorker(deps))` is registered. The queue is\nthe `InsertOpts.Queue` at the call (a literal, a constant, a config `default:`\ntag, or what the callers pass), else the args type's own `InsertOpts()`, else\n`default`. What no Insert in the tree feeds is not dropped: a registered\nworker's queue is the one its type chooses or the one queue `river.Config`\nlists, and with several and no choice the worker is kept as a flow whose\nreceive is unresolved. The diagnostics keep the two cases apart - an Insert\nwhose job type or queue the reader could not follow is said at the call, a\nworker with no Insert in the tree is said at the worker.\n\n`extract-redis` finds runtime construction of go-redis, rueidis and redigo\nclients in non-test Go source. That source evidence adds a service-owned Redis\nstore to the catalog even when the repository has no SQL migrations or domain\nmodel. It follows literals, constants, concatenation, `fmt.Sprintf`, helper\nfunctions and conditional suffixes into common Redis operations, producing\nkey patterns with their read/write/delete use, TTL, value type and source. The\npatterns remain Redis keyspaces rather than being presented as SQL tables.\n\n`extract-watermill` reads Watermill `Router.AddHandler` and\n`AddNoPublisherHandler` registrations, and `Subscriber.Subscribe` calls made\nwithout a router. It resolves literal and constant topics - typed constants\nthrough `string(...)`, constants concatenated with `+`, single-return\nhelpers - plus defaults on env-config structs, nested (`cfg.Kafka.Orders`) or\nnot; a topic, a name or a handler that a registering function takes as a\nparameter is filled in once per caller, so a `handle(r, name, topic, fn)`\nwrapper yields one handler per call. The handler value may be a function\nliteral, a function or method of the tree (`h.OnOrder`, `handlers.OnShipped`)\nor a constructor returning a literal. It follows direct `Publisher.Publish`\ncalls and one-hop publishing helpers, records what the service publishes\noutside any handler as a `send` on the topic, and traces JSON marshal/unmarshal\nvalues back to their Go payload structs. It carries enclosing `if`/`else`\nconditions and early returns through the handler's control flow: proven\nalternatives become one catalog `alt`; publications whose relationship cannot\nbe proven remain separate possible routes. A handler whose topic does not\nresolve is kept, with its receive step unresolved and no channel claimed, and\nnamed in a diagnostic. The channels merge normally with AsyncAPI declarations\nby address. Generic `NewEventHandler[T]` and `NewCommandHandler[T]`\nregistrations on Watermill CQRS processors are also extracted; fixed topic\ngenerators and the standard event/command-name generator form are resolved\nfrom source.\n\n`extract-go-nats` reads nats.go and JetStream calls into the subjects a service\nlistens on and publishes to. A call is known by the type it is made on -\n`*nats.Conn`, `nats.JetStreamContext`, `jetstream.JetStream`, `jetstream.Stream` -\nand not by its name, because a service's own bus port has a `Subscribe` too.\nThe subject is followed to a literal, a constant, a config default, or a\nparameter; a parameter is followed up to two hops through the callers,\nincluding calls through an interface the adapter satisfies, which is how a\nport `Subscribe(ctx, topic, name, handler)` reads as the assembly's\n`Subscribe(ctx, cart.Topic, cart.BasketCheckedOut{}.Name(), …)`. When the port\ntakes exactly one other string beside the subject, that string is the\nmessage's name; a direct call names no message, and its direction is in the\nchannel's doc. A subject read off a database row is a warning at the call,\nnot a channel. Consumer configs give the filter subject and the durable name;\nstreams, wildcard subjects and work-queue retention are not read yet.\n\n`extract-go-sqs` is its twin for Amazon SQS through aws-sdk-go-v2. A call is\nknown by being made on `*sqs.Client` - `SendMessage`, `SendMessageBatch`,\n`ReceiveMessage` - and the queue is the `QueueUrl` of the input struct,\nwritten inline or built into a local first. `aws.String` and `aws.ToString`\nare taken off, and the `QueueUrl` of a `GetQueueUrl` result is read as the\n`QueueName` that was asked for. The queue is then followed like a subject: to\na literal, a constant, a config default, or a parameter up to two hops through\nthe callers, and when it sits in a field of the receiver, to the constructor\nthat filled the field and on to that constructor's callers - the worker's\nshape, where the queue comes in at `New` and is read at `Run`. A URL becomes\nthe queue's name, its last path segment. Channels are `message` streams, not\ndomain events: a queue is point to point, and the event model is not asked to\nmatch it. A port that takes exactly one other string beside the queue names\nthe message; a direct call names none. `DeleteMessage`, visibility changes and\n`CreateQueue` say nothing about direction and are not read; SNS is not read.\n\n`extract-go-kafka` reads Kafka topics from sarama (IBM and Shopify paths),\nsegmentio/kafka-go, confluent-kafka-go and franz-go. A client struct that\ncarries a topic - `sarama.ProducerMessage`, `kafka.Writer`, `kafka.Message`,\n`kafka.ReaderConfig`, `kgo.Record`, confluent's `TopicPartition` inside a\n`kafka.Message` - is the declaration wherever it is built; consumer calls are\nknown by the type they are made on (`sarama.ConsumerGroup.Consume`,\n`Consumer.ConsumePartition`, confluent `Consumer.Subscribe`/`SubscribeTopics`,\n`kgo.ConsumeTopics`, `Client.AddConsumeTopics`). Topics and lists of topics\nare followed like a NATS subject, through constructors and callers, and an\nunresolved one is a warning. Channels are `message` streams with protocol\n`kafka`, the shape `extract-python-kafka` gives a topic, with the consumer\ngroup in the doc. See `extract-go-kafka/README.md`.\n\n`extract-go-amqp` reads RabbitMQ through amqp091-go and streadway/amqp:\npublishes, consumes, `QueueBind`, `ExchangeDeclare` and `q.Name` of a\n`QueueDeclare`. The channel is the string the broker routes by - the routing\nkey on a direct or topic exchange, the exchange when it is fanout or headers\nor the publish has no key, the queue for the default exchange - and a consumer\nlands on it through its queue's bindings, or on its queue when nothing binds\nit. `extract-go-amqp/README.md` says why the exchange alone is not the address.\n\n`extract-go-eventgrid` reads publishers built with the Azure SDK for Go. For\nbasic and custom topics it recognizes `azeventgrid.Client.PublishEvents`,\n`PublishCloudEvents` and `PublishCustomEventEvents`; for Event Grid namespace\ntopics it recognizes `aznamespaces.SenderClient.SendEvent` and `SendEvents`.\nThe client is followed back through locals, parameters and adapter fields to\nits SDK constructor. A basic-topic endpoint becomes the topic name; a namespace\nendpoint and constructor topic become `namespace/topic`. Event types are read\nfrom Event Grid-schema `EventType` fields and `messaging.NewCloudEvent` calls,\nand are emitted as sent messages with the publishing source line. Credential\narguments are never resolved or copied. Dynamic endpoints remain warnings\nrather than guessed channels. A custom topic and an event domain have the same\nendpoint shape, so domain endpoints are named explicitly with the `domains`\noption. For those endpoints, the Event Grid-schema `Topic` field or CloudEvent\n`source` becomes the domain topic and the channel address is `domain/topic`.\n\n`extract-terraform` reads the other half: the AWS and Azure infrastructure the\ncode runs on, from the `*.tf` files of the directory given as `dir` - or the root, or\nthe one directory under it that holds any. Nothing is evaluated; the files\nare read as syntax with `hashicorp/hcl`, and a name is followed the way a\nsubject is - to a literal, a variable's default, a local, the argument a\ncalling `module` block passed in, or a child module's output - and left out\nwith a warning when none of those reaches it, never taken from the label.\nLocal modules (`source = \"./...\"`) are read where they are called. A registry\nmodule the reader knows - `terraform-aws-modules/lambda`, `sqs`, `sns`,\n`s3-bucket` with its `notification` submodule, `dynamodb-table`, whether\nnamed through the registry or as the git repository behind it with a ref -\nis read as the resource it wraps: its inputs are that resource's attributes\nunder the module's names (`environment_variables`, `attributes = [...]`,\n`event_source_mapping = {...}`, `subscriptions = {...}`, `create_dlq`), and\nits outputs (`lambda_function_arn`, `queue_arn` or `sqs_queue_arn`,\n`dead_letter_queue_arn`, `dynamodb_table_stream_arn`) are references to it,\nso `module.queue` reads as `aws_sqs_queue` would; the dead-letter queue the\nqueue module makes beside itself is `module.queue.dlq`, and a layer the\nlambda module makes is not a function. Any other registry module is noted\nand skipped. A reference from one resource to another\n(`aws_sqs_queue.orders.arn`) is the edge itself and needs no value. What\ncomes out: an `aws_sqs_queue` is a `message` channel and an `aws_sns_topic`\nan `event` channel, each with `messages: []` and the facts in the doc - FIFO,\nthe dead-letter queue and its receive count from `redrive_policy`, the SNS\nsubscription that fills a queue, the S3 notification that fills either; an\n`aws_lambda_function` is a component of kind `function` in the same context,\nits runtime among its technologies - or the service itself when its name\nslugs to the `service` option; an `aws_lambda_event_source_mapping` puts the\nqueue on the function as received, and a topic reaching the function through\na subscribed queue is listed on it too; a value in the function's\n`environment` that reaches a queue, topic, table or bucket lists that on the\nfunction with the variable's name, and without a direction, because\nTerraform does not know one. `aws_s3_bucket`, `aws_dynamodb_table` (keys and\nsecondary indexes as the table), `aws_db_instance` and `aws_rds_cluster`\n(kind from `engine`) are stores at the root, owned by the `service` option;\na queue or topic nothing in the module touches is listed on that service as\nwell, and says so. Kinesis, EventBridge, API Gateway, Step Functions,\nElastiCache, MSK and ECS resources are named once as not read yet.\n\nFor Azure Event Grid, custom topics, system topics, domains and domain topics\nare `event` channels. `azurerm_eventgrid_event_subscription` and\n`azurerm_eventgrid_system_topic_event_subscription` connect those channels to\nAzure Functions, Event Hubs, Service Bus queues or topics, Storage queues,\nRelay hybrid connections and webhooks. Included event types become received\nmessages on a function. Event Hubs and Storage queues declared in the same\nmodule also become first-class `message` channels, and Service Bus queues and\ntopics the channels described below, with the subscription and source Event\nGrid channel recorded on the destination;\nsubject filters, the count of advanced filters,\ndelivery schema, retry policy and the dead-letter blob container stay on the\nchannel as declared routing facts. A subscription scoped directly to an Azure\nresource is kept as a system-event source even when no explicit system-topic\nresource exists. Webhook URLs are deliberately omitted because their query\nstring may carry a validation or access token. Provider state, credentials and\nobserved delivery attempts remain outside the extractor.\n\nFor Azure Service Bus, an `azurerm_servicebus_queue` is a `message` channel and\nan `azurerm_servicebus_topic` an `event` channel, addressed by the entity's\nname; the namespace and its SKU, partitioning, sessions, duplicate detection,\nthe delivery count before dead-lettering, `forward_to` and\n`forward_dead_lettered_messages_to` are facts in the doc, said on the\nforwarding entity and on its target. An `azurerm_servicebus_subscription` is\nnot a channel: it is a sentence on its topic with its rules - a correlation\nfilter by its label and the names of the fields it matches, a SQL filter by\nthe properties it names, never the values either compares with. An Azure\nFunction's `config_json`, written with `jsonencode()` or as JSON text, is read\nfor its `serviceBusTrigger` and `serviceBus` bindings: the queue, or the topic\nand subscription, goes on the function as received or sent. A binding that\nnames an app setting (`%ORDERS_QUEUE%`) is followed to the function app's\n`app_settings` and taken only when the setting reaches a queue or topic\ndeclared here; the connection setting is never read. An `azurerm_role_assignment`\nof a Service Bus data role (Sender, Receiver, Owner, by name or built-in id)\nsays who may send or receive on the entity, the subscription's topic, or every\nentity of the namespace - by the resource whose identity it is, or the\nvariable that gives the id, never an id written out.\n\n`extract-python-kafka` is the framework-independent Kafka enrichment for\nPython. It recognizes confluent-kafka, kafka-python and aiokafka by their\nimported client types, follows literal topics through constants, environment\ndefaults, settings and local factories, and emits generic message streams with\nproducer and consumer flows. Only client-side configuration proven in source\nis retained; authentication values are omitted, while broker-side partitions,\nreplication and retention remain explicitly unknown. See\n`extract-python-kafka/README.md` for the supported call shapes.\n\n`extract-wsdl` reads WSDL 1.1 contracts as structured SOAP APIs. It follows\nlocal WSDL imports and XSD imports/includes without network access, keeps\ndistinct services, ports and SOAP 1.1/1.2 bindings, and records operation\nactions, request/response messages, faults, headers and reachable XSD shapes.\nIt can describe a contract implemented by the component or a vendored copy for\nan external system (`mode: external`). Remote imports are reported as missing\nevidence rather than fetched during generation.\n\n`extract-http-clients` is the outbound counterpart and does not require a\ndomain layout. It reads `net/http` request construction, calls through an\n`oapi-codegen` client, and SOAP `Call`/`CallContext` sites. A generated client\nis joined to the OpenAPI document beside it, so the call uses the document's\noperation id and lands on an external with the contract the document declares.\nSOAP actions are joined to WSDL bindings when the action matches. Generated and\nhand-written wrapper signatures are learned from their call into the SOAP\ntransport or their `SOAPAction`/SOAP 1.2 content-type header, so the action,\nrequest and response positions are taken from code rather than assumed. A\nraw request whose peer or contract cannot be proved is still useful evidence:\nit is emitted as `unresolved`, with its method, path and source line, rather\nthan being assigned to a guessed system. Conditions guarding a call and the\nopposite path after an early return are carried into the flow note.\nCalls through local wrappers retain their argument values, including closure\narguments, so a path and HTTP method declared by a business operation survive\nthe trip into the transport. URL-shaped configuration is followed through a\nconstructor and client field to the request, and the resulting evidence chain\nis included in the flow instead of presenting a receiver field as an endpoint.\nInbound composition also follows fixed factories, string-keyed constructor\nmaps, capability type assertions, and interface fields wired by composite\nliterals, direct assignments, or setters. A standalone flow says whether no\nsource caller exists or callers exist but no inbound/asynchronous root was\nproved, so the UI exposes the missing evidence instead of implying a complete\nbusiness path.\nWhen a provider branch still ends before its transport, the extractor runs as\na workspace-local native sidecar, loads the module with `go/packages`, builds\nSSA, and uses `x/tools` VTA to resolve\ncalls through interface parameters, function values, return values, and\ninterface-typed struct fields. Typed edges are followed only after a concrete\nfactory branch is selected: applying context-insensitive VTA to a shared\ndispatcher would otherwise attach every request implementation to every\nendpoint. Factory conditions and HTTP/SOAP meaning continue to come from the\nsource extractor. The sidecar is built from the Portolan package through the\nproject's Go toolchain and runs with the project as its working directory.\nModule loading is read-only and bounded; unavailable private dependencies,\ntype errors, or a timeout produce a warning and retain the syntax-only result\nrather than failing generation.\nRoutes without a provider factory are also joined to their outbound calls,\nincluding handlers invoked from closures and methods on locally constructed\nvalues. A Swagger `@Router` annotation is medium-confidence root evidence for\nhandler factories behind custom registries. Direct calls reached through a\n`main → Run`/`Start`/`Bootstrap` assembly path become high-confidence startup\nflows. `AddFunc`, `AfterFunc`, and `Schedule` registrations create scheduled\nroots when their handler reaches an outbound call. Extracted HTTP, callback,\nstartup, scheduled, River-job and Watermill-event flows publish that trigger\nprovenance; unmatched transport fragments are explicitly `unproven` with low\nconfidence.\n\nAfter fragments merge, Portolan composes them into root-oriented,\ncross-protocol flows. The seam is machine evidence rather than a display-name\nmatch: an exact source function reached by another extractor, a River job's\nqueue plus `Kind()`, or a Watermill transport plus topic address.\nComposition is recursive, so one request can continue through provider\nHTTP/SOAP calls, enqueue a River job, enter its worker, and make further\noutbound calls. Ambiguous handoffs remain separate. Each composed flow records\nthe source fragment slugs it includes, and the UI exposes that provenance as a\n`cross-protocol` badge. Trigger-bearing job and event flows stay available as\nstandalone entry views; transport-only fragments consumed by a proven root are\nremoved from the top-level flow list.\n\nAfter merge, an empty flow summary is filled from the first paragraph of the\nexact provided operation's documentation. A label-only match is accepted only\nwhen that method name occurs once on the receiving service; ambiguous matches\nremain empty and visible to the quality rule. A summary written at the flow\nsource always wins.\n\n## Flows written by hand\n\n`extract-flows` reads one human-readable `.flow.md` file per journey. The\ncomplete grammar, stable-id guidance, canonical participant references, store\naccess syntax, failure behaviour, and an executable golden example live in the\nfocused `docs/flows-authoring.md` guide. Keeping that\ncontract beside its test fixture prevents this plugin protocol overview from\nbecoming a second, stale language reference.\n\n## Spec-driven changes\n\n`extract-sdd` reads an OpenSpec workspace without modifying it. By default it\ndiscovers changes under `openspec/changes/`, including archived changes, and\nnormalizes proposals, designs, requirements, scenarios, and task checklists\ninto `specs[]`. Set `options.root` when the OpenSpec directory has another\nname.\n\n```json\n{ \"plugin\": \"sdd\", \"in\": \".\", \"out\": \".portolan/fragments/sdd.json\" }\n```\n\nThe lifecycle is derived from the source layout and checklist: a change moves\nfrom `draft` or `planned` to `implementing`, `complete`, or `archived`. This is\nthe authoring lifecycle, not a conformance result. Portolan keeps it separate\nfrom code, deployment, and runtime evidence, so checking the last task cannot\nsilently turn intended architecture into verified architecture.\n\nThe normalized model is format-independent so Spec Kit and Kiro adapters can\nbe added without changing the catalog or UI. The first adapter intentionally\nsupports OpenSpec only; an unfamiliar SDD layout is not guessed.\n\n## Decisions written by hand\n\nEvery decision worth keeping is already written down, in a file beside the code\nit constrains, in the MADR shape a person reads. Typing it a second time into\nthe catalog's JSON - an id, a slug, a number, a scope and a body with every\nnewline escaped - makes the JSON the source and the markdown a copy, and the\ncopy is the one that goes stale: the three records that lived in\n`data/catalog.json` before `extract-adr` existed all named files that were\nnever in the repository at all.\n\nSo the markdown is the source and the fragment is the output. `extract-adr`\nreads `docs/adr/*.md` under a service's root - a `README.md` among them is the\ndirectory's index, not a decision, and is skipped - and answers with one\nfragment holding the records.\n\n```markdown\n# auth.0003 — Session expiry publishes no event\n\n- **Status:** accepted\n- **Date:** 2026-08-22\n- **Scope:** auth.auth\n- **Superseded by:** auth.0007\n- **Supersedes:** auth.0001, auth.0002\n- **Relates:** auth.auth.session.SessionEnded, shop.cart, checkout\n- **Note:** how a revocation is kept out of the cache was decided again in\n  auth.0010; the drop described below turned out not to be enough.\n\n## Context and Problem Statement\n…\n## Decision Outcome\n…\n```\n\nThe title carries the record's id, an em dash, and the title. The id is a\nprefix and four padded digits, and the prefix is whatever the record is about -\na service (`auth`, `cart`, `oms`), a context (`payments`) or the organisation\n(`org`). The file is named `NNNN-kebab-slug.md` with the same number, because\nthe slug the catalog keeps is built from both: the id with its dots opened out,\nthen the file's kebab, as in `auth-0003-expiry-publishes-nothing`. A file\nrenamed away from its record would silently change the address of a decision\nsomebody linked to, so the two are held against each other.\n\n`Status` and `Date` are required, and so is `Scope` unless the step's `scope`\noption names it for the whole tree; the rest are written when there is\nsomething to write, and a bullet the format does not have fails the record\nrather than being dropped. A bullet may wrap onto the next line, indented under\nitself - the break is the author's line width and closes up into a space.\n`Scope` says what the record is about by how many segments it has: none, or\n`org`, for the organisation, one for a context, two for `\u003ccontext\u003e.\u003cservice\u003e`.\n`Relates` names events, services and flows in one list and they are told apart\nby their shape - a flow by its slug, which has no dots, a service by\n`\u003ccontext\u003e.\u003cservice\u003e`, an event by the aggregate and `Name` after that -\nbecause an author should not have to remember which of three lists a name\nbelongs in. `Note` is prose no other field holds, most often that part of a\nrecord was decided again somewhere else without the whole of it being\nsuperseded; it sits in the page's header, above the frozen body.\n\nEverything from the first `##` onward is the record. It goes into the catalog\nexactly as written and comes back out onto the page the same way, headings and\nall: an ADR is frozen history, and nothing on its page is redrawn from the\nmodel as it stands now. Prose above that first `##` is a mistake - a paragraph\nthat drifted up there would be read by a person and dropped by the extractor.\n\nThe [adr-tools](https://github.com/npryce/adr-tools) shape is read too: number\nand title on the title line, `Date:` above the record, status as the first\nsection with its `Superseded by` / `Supersedes` link. It has no prefix or\nscope, so both come from the step's `scope` option.\n\n`src/catalog.ts` fails the whole app on load if a record breaks any of its\nrules, so the extractor checks first, where the file that caused it can be\nnamed: ids and slugs unique, an id ending in its own zero-padded number, a date\nthat parses, a status from the five, and both halves of a supersession. A file\nthat breaks one of them is left out with a warning naming the file and line,\nand the rest of the tree is read; only a supersession with one half recorded\nrefuses the whole run. That is why `Superseded by` and `Supersedes` are two\nbullets rather than one derived from the other - supersession is a two-way\nfact, and half of it recorded is a bug. The halves that live in one step's\ntree are held against each other there; a record superseded by one in another\nservice's tree is a claim only the merged catalog can check, and the validator\nchecks it. The same goes for `Scope` and `Relates`: an extractor sees one root,\nso it validates the shape of a name and leaves whether the thing exists to the\nfar side.\n\nThe demo estate's org-wide and context-wide records live in `data/adr`, and are\nread by a step that points at that directory with a glob of its own. Root\n`docs/` is where `gen-markdown` writes, so nothing hand-written can live there.\n`in` is the directory of records rather than `data` itself: what `gen --check`\nlists as changed inputs is the root less the output directories inside it, and\n`in: data` with `out: data` would list the file the step writes among the\nreasons it was rewritten.\n\n```json\n{\n  \"plugins\": [{ \"name\": \"adr\", \"wasm\": { \"url\": \"file://plugins/portolan-go.wasm\" } }],\n  \"extract\": [\n    {\n      \"plugin\": \"adr\",\n      \"in\": \"data/adr\",\n      \"out\": \"data\",\n      \"options\": { \"files\": [\"*.md\"], \"out\": \"adr.json\" }\n    },\n    {\n      \"plugin\": \"adr\",\n      \"in\": \"examples/auth\",\n      \"out\": \"examples/auth/portolan\",\n      \"options\": { \"out\": \"adr.json\" }\n    }\n  ]\n}\n```\n\n## Vocabulary written by hand\n\nA context's glossary is the one file in a service written for a person and read\nby everyone: what a word means inside the boundary it is spoken in. Nothing\ngenerates it and nothing should - a definition is a decision about language,\nnot a fact about a type - so `extract-glossary` only reads. It takes\n`GLOSSARY.md` at a service's root and answers with a fragment of terms.\n\n```markdown\n# Glossary — auth\n\nOne meaning per word inside this context.\n\n**Session.** Proof that a user logged in, how long that proof is good for, and\nwhether it has been taken away.\n```\n\nA title, an optional line or two saying what the vocabulary covers, then one\nparagraph per term in alphabetical order. The paragraph opens with the term in\nbold and the full stop inside the bold, so `**Email address.**` names a\ntwo-word term and nothing has to guess where the name ends. Everything after it\nis the definition, carried through as written. Hard wrapping is the author's\nbusiness: a soft break inside a paragraph is a space, here as in every markdown\nrenderer.\n\nNothing reads the definition for structure. A glossary is a person explaining a\nword to another person, and a parser that went looking for shapes inside the\nexplanation would be a parser telling an estate how to phrase itself.\n\nThe shapes a glossary is otherwise written in are refused by name: a table, a\nbullet list, a heading per term. Also refused: a file that does not open with\n`# Glossary`, an entry that defines nothing, and one word defined twice -\ninside a file or across the files of one step - because a word with two\nmeanings in one context is the failure the glossary exists to prevent.\n\nWhat is merely untidy comes back as a warning and the fragment is still\nwritten: a file that has drifted out of alphabetical order, a root with no\nglossary at all.\n\nThe term's id is `\u003ccontext\u003e.\u003cslug\u003e` - `auth.session`, `shop.order` - so the\ncontext has to be told to the step rather than derived from the directory: a\nglossary sits beside a SERVICE, and `examples/shop/oms/GLOSSARY.md` holds\nwords that belong to `shop`. The same word in two contexts is two terms, which\nis the point of the id; the same word twice in one context is an error.\n\n```json\n{\n  \"plugins\": [{ \"name\": \"glossary\", \"wasm\": { \"url\": \"file://plugins/portolan-go.wasm\" } }],\n  \"extract\": [\n    {\n      \"plugin\": \"glossary\",\n      \"in\": \"examples/auth\",\n      \"out\": \"examples/auth/portolan\",\n      \"options\": { \"context\": \"auth\", \"out\": \"glossary.json\" }\n    }\n  ]\n}\n```\n\n## Commands: what to type\n\nThe first thing a reader new to a checkout wants is not the aggregate list but\n`how do I build this, test it, run it`. The README answers that sometimes; the\nrunner files answer it always, and they are already in the tree. `extract-commands`\nreads them and puts the answer on the service as a list of commands - the line\nto type, what the file says it is for, what the runner would execute, and where\nit was read.\n\n| File | Runner | Line to type | Description read from |\n| --- | --- | --- | --- |\n| `Makefile` | make | `make \u003ctarget\u003e` | `## comment` on the target's line, else the `#` block over it |\n| `justfile` | just | `just \u003crecipe\u003e` | `[doc(\"...\")]`, else the `#` block over it |\n| `Taskfile.yml` | task | `task \u003cname\u003e` | `desc`, else `summary` |\n| `package.json` `scripts` | npm, or pnpm/yarn/bun by the lockfile | `npm run \u003cname\u003e`; `npm test`, `npm start` | nothing - the script line is the body |\n| `pyproject.toml` | poe (`[tool.poe.tasks]`), pdm (`[tool.pdm.scripts]`) | `poe \u003cname\u003e`, `pdm run \u003cname\u003e` | `help` |\n| `pom.xml` | mvn, or `./mvnw` when the wrapper is there | `mvn test`, `mvn package`, and the goals of declared plugins: `spring-boot:run`, `quarkus:dev`, `flyway:migrate`, … | the goal's own purpose |\n| `build.gradle(.kts)` | gradle, or `./gradlew` | `gradle build`, `gradle test`; `run` with the application plugin, `bootRun` with Spring Boot; every `tasks.register(\"...\")` | the task's `description` |\n| `.cargo/config.toml` | cargo | `cargo \u003calias\u003e` for each `[alias]`; when one runs the `xtask` package, `cargo xtask \u003csub\u003e` for each subcommand of its `main.rs` | `///` over a clap variant, `//` over a match arm |\n\nLeft out, because the runner leaves them out too: `_`-prefixed and `[private]`\nentries, `internal` tasks, make's special and pattern targets (`.PHONY`, `%.o`),\ntargets spelled through a variable, and `pre`/`post` hooks of a script that is\nitself listed. `[project.scripts]` in a pyproject is not read: those are\nprograms the package installs, not tasks a developer runs. `uv` has no task\nsection and Go has no runner of its own, so a repository with only those\ndeclares no commands.\n\nMaven and Gradle are the other way round: the build is the runner, and what\na project declares is which plugins extend it. So a pom lists the two\nlifecycle phases every pom answers to, `test` and `package`, and then the\ngoals a person types that its `\u003cbuild\u003e\u003cplugins\u003e` add - `spring-boot:run` for\nthe Spring Boot plugin, `flyway:migrate` for Flyway - from a short table of\nthe plugins an estate meets. A plugin bound to a phase, like protobuf\ngeneration, is run by the phase and is not listed; neither is one under\n`\u003cpluginManagement\u003e`, which pins a version and runs nothing. A Gradle script\nlists `build` and `test`, `run` when it applies the application plugin,\n`bootRun` for Spring Boot, and every task it registers itself, with the\ndescription it sets. The script is read as text, not run: a task registered\nin a loop or by an unnamed plugin is not here.\n\nCargo declares commands in one place, `[alias]` in `.cargo/config.toml`, and\nthe xtask convention is an alias that runs a package: `xtask = \"run --package\nxtask --\"`. Each alias is a command with its expansion as the body, and when\nthe expansion runs a package and leaves the subcommand to the caller, that\npackage's `main.rs` is read for the subcommands - the variants of a clap enum\nderiving `Subcommand`, in kebab-case, with their `///` comment as the doc, and\nthe string literals of a `match` on the first argument, with a `//` comment\nover the arm. An alias that names its subcommand already, like `gen = \"run -p\nxtask -- gen\"`, is listed as the one command it is.\n\nNothing is evaluated. A target inside an `ifeq` is listed; a name that depends\non a variable's value is not, because the name it would have is not in the\nfile. The pyproject reader is a line scanner that follows the table headers\nand the shapes both runners document, not a TOML parser.\n\nThe fragment names the service and lists its commands, and claims nothing\nelse: merging puts the list on the service a domain extractor described. The\nrunner files sit beside the service, so the step is told which one it is.\n\n```json\n{\n  \"plugins\": [{ \"name\": \"commands\", \"wasm\": { \"url\": \"file://plugins/portolan-go.wasm\" } }],\n  \"extract\": [\n    {\n      \"plugin\": \"commands\",\n      \"in\": \"examples/shop/pricing\",\n      \"out\": \"examples/shop/pricing/portolan\",\n      \"options\": { \"context\": \"shop\", \"service\": \"pricing\", \"out\": \"commands.json\" }\n    }\n  ]\n}\n```\n\n`extract-project` reads the same files for the component it describes, so a\nrepository read by that plugin does not need this one.\n\nDownstream, `gen-markdown` draws the list as a Commands table on the service\npage, and `gen-backstage` puts it on the Component twice, because Backstage\nhas no field for it: as the `portolan.io/commands` annotation, one command a\nline with its description, and as entity links of type `command`, each\nleading to the line of the runner file it was read from, when `sourceBaseUrl`\nsays where the repository is.\n\n## Where it answers, what it dials: the manifests, and the cluster\n\nA catalog that knows what a service provides and what it consumes still has\nholes where the two do not meet by route alone: two services answer\n`POST /foo`, and the caller's code says only that it posts to `$LEDGER_URL`.\nWhat that variable holds is not in the code. It is in the Deployment, the\nConfigMap it reads, and the Service and Ingress objects that give the far end\na name. Two plugins read those - `extract-k8s` from the manifests in a\nrepository, `fetch-k8s` from a live cluster - and put two lists on the\nservice:\n\n- **Hosts** - the names it answers on: a Kubernetes Service's name in its\n  short, namespaced, `svc` and fully qualified forms, and the hosts of the\n  Ingress or attached Gateway API Route in front of it. A Route contributes\n  only through a Gateway listener that accepts its kind, namespace and\n  hostname, and a cross-namespace Service backend requires a ReferenceGrant.\n- **Dials** - the in-cluster names its workload is configured to reach, cut\n  out of its containers' `env` and the ConfigMaps they read.\n\nThe merge then has both facts in one place. A call that names a host, or a\ncaller whose manifests dial one, resolves against the providers of its route\nwhen exactly one of them answers on that name, and the evidence says\n`kubernetes-host` as the basis. A host only ever decides between providers of\nthe route; it never conjures a provider that does not have it.\n\n### What is never written\n\nA manifest holds configuration, and configuration is where the passwords are.\nThe rule that keeps them out is a rule of shape, not a list of words:\n\n- A `Secret`, a `SealedSecret`, an `ExternalSecret`, or any document with\n  `stringData` is passed over at its `kind`, before its body is decoded. A\n  `secretKeyRef` or `secretRef` is not followed.\n- A value from `env` or a ConfigMap is reduced to the host it names, or to\n  nothing. A URL gives up its hostname and keeps nothing else - not the\n  scheme, the port, the path, the query, nor the user and password in front\n  of the host. A bare `host[:port]` gives up the port. `info`, `true`, a\n  token, a DSN written as `key=value` pairs: none of these is a host, and\n  none passes.\n- What is left qualifies only when the cluster resolves it: a form the tree's\n  own Services answer to, or `\u003cname\u003e.\u003cnamespace\u003e.svc[.cluster.local]`, the\n  one shape no name outside a cluster has. A bare `cart` from another\n  repository's manifests is not taken, because nothing distinguishes it from\n  a word.\n- Warnings name files and directories, never values, because the build\n  report is committed.\n\nThe fragment carries the variable's name no more than its value: the\n`environmentVariable` the HTTP client extractor records stays what it was, and\nno value is attached to it.\n\n### The manifests: extract-k8s\n\nEvery `*.yaml` and `*.yml` under the root, or under the `paths` named in the\noptions; anything without `apiVersion` and `kind` - a compose file, a\nworkflow - is passed over silently. Multi-document files are split. A file\nholding `{{` is a template and not YAML until rendered, so a directory of\nHelm templates is passed over with one warning for the directory; render the\nchart into the tree, or point `paths` at plain manifests, to have it read.\nKustomize is read without running it: the base and the overlays are all under\nthe root, and two documents of one kind and name - a Deployment and the patch\nlaid over it - fold into one, their env and labels unioned. `namespace`\nnarrows workloads, Services, Ingresses and ConfigMaps to one namespace;\nGateway API objects in other namespaces remain available to resolve shared\nGateways and cross-namespace Routes. An object naming no namespace is read\neither way.\n\nThe workload the step is about is the Deployment, StatefulSet, DaemonSet,\nReplicaSet, Job or CronJob named like the service, or labelled so with\n`app.kubernetes.io/name` or `app`, or the only one in the tree. A Job or\nCronJob makes the service's kind `job`; a Deployment says nothing about kind,\nbecause a webapp and a worker both deploy that way. Several workloads and\nnone named is a warning, not a guess.\n\n### The cluster: fetch-k8s\n\nThe manifests say what should run; the cluster says what does, and for an\nestate deployed by Helm or Argo the rendered objects are in no repository at\nall. `fetch-k8s` asks `kubectl` for the workloads, Services, Ingresses, Gateway\nAPI Gateways, Routes and ReferenceGrants, Namespace metadata, and ConfigMaps of\nthe namespaces named - never for a Secret - and answers with one fragment for\nevery workload it saw, placed\ninto contexts and services by label. It runs in the host (portolan.0008)\nbecause it needs the binary, the socket and kubectl's own credential, which\ncomes from the kubeconfig and is never in the manifest.\n\n```json\n{ \"name\": \"k8s-cluster\", \"host\": \"fetch-k8s\" }\n\n{\n  \"plugin\": \"k8s-cluster\",\n  \"in\": \".\",\n  \"out\": \"data\",\n  \"options\": {\n    \"kubeContext\": \"prod-eu\",\n    \"namespaces\": [\"shop\", \"auth\", \"payments\"],\n    \"gatewayNamespaces\": [\"platform-networking\"],\n    \"labels\": { \"context\": \"app.kubernetes.io/part-of\", \"service\": \"app.kubernetes.io/name\" },\n    \"namespaceContexts\": { \"shop-jobs\": \"shop\" },\n    \"cache\": \"data\",\n    \"out\": \"k8s-cluster.json\"\n  }\n}\n```\n\n`namespaces` controls which workloads are emitted. `gatewayNamespaces` adds\nnamespaces that hold shared Gateways or Routes without adding their workloads.\nWhen `namespaces` is omitted, the all-namespaces read already includes both.\nHTTPRoute and GRPCRoute are read as standard kinds; TLSRoute is used when its\nexperimental CRD is installed. TCPRoute and UDPRoute carry no hostname and do\nnot contribute to `hosts`.\n\nThe context is the value of the `app.kubernetes.io/part-of` label and the\nservice the value of `app.kubernetes.io/name`; an estate that labels\ndifferently names its own keys under `labels`. A workload without the\ncontext label falls back to `namespaceContexts`; one with neither is counted\nin a warning for its namespace and left out, not guessed at. A workload\nwithout the service label is named after itself. Several workloads landing\non one service - a Deployment and the CronJob beside it - fold into one; a\nservice that is only jobs is a `job`, one with a Deployment beside them is\nwhatever its code says.\n\nThe same offline rule as fetch-git: with `PORTOLAN_OFFLINE` set, or in CI,\nthe fragment committed at `cache` is used unchanged; when the cluster cannot\nbe reached it is used with a warning that names the failed command and its\nexit status, not the server; with no committed copy, that is an error and\nnot a short answer. What kubectl itself said on stderr goes to the terminal,\nwhere the person at the keyboard can read the connection error, and not into\nthe build report, which is committed. Nothing but the fragment is written to\ndisk: the objects live in the process for the length of one call.\n\n### The event control plane: fetch-eventbridge\n\nTerraform says what should be deployed; the EventBridge API says which buses,\nrules and targets are deployed now. `fetch-eventbridge` asks that read-only API\nin every region named in the step and writes service message channels from\nenabled event-pattern rules. The bus ARN is the channel address, a literal\n`detail-type` is the message name, a mapped event `source` sends it, and a\nmapped target receives it. A disabled rule is not an active route. Scheduled\nrules are left to the separate EventBridge Scheduler integration instead of\nbeing made to look like bus messages.\n\n```json\n{ \"name\": \"eventbridge\", \"host\": \"fetch-eventbridge\" }\n\n{\n  \"plugin\": \"eventbridge\",\n  \"in\": \".\",\n  \"out\": \"data/eventbridge\",\n  \"options\": {\n    \"regions\": [\"eu-west-1\", \"us-east-1\"],\n    \"buses\": [\"orders\"],\n    \"sources\": {\n      \"com.acme.orders\": \"shop.orders\"\n    },\n    \"targets\": {\n      \"lambda:invoice-handler\": \"shop.billing\",\n      \"arn:aws:sqs:eu-west-1:123456789012:audit-events\": \"shop.audit\"\n    },\n    \"ruleTags\": {\n      \"context\": \"portolan.context\",\n      \"service\": \"portolan.service\"\n    },\n    \"cache\": \"data/eventbridge\"\n  }\n}\n```\n\nAuthentication is the standard AWS SDK credential chain: environment,\nworkload role, shared credentials or an `AWS_PROFILE`. A separate step and\noutput directory can be used for each account. The smallest useful policy is\nread-only and grants `events:ListEventBuses`, `events:ListRules` and\n`events:ListTargetsByRule`; add `events:ListTagsForResource` only when\n`ruleTags` is configured. No profile, credential, token, full event pattern,\nfixed target input or input-transformer template is retained. `source` and\n`detail-type` are kept because they are the event's routing identity; other\npattern values are reduced to field names.\n\nIn a local catalog, `/plugins/eventbridge/settings` edits these options,\ncatalog scope and explicit service mappings in `portolan.json`. It can save\nwithout contacting AWS or save and run the reader immediately. A published\ncatalog keeps the page read-only and offers a starter step to copy; credentials\nare never form fields.\n\nThe control plane cannot say which application calls `PutEvents`, and a target\nARN does not identify a Portolan service by itself. That is why `sources` and\n`targets` are explicit maps and an unmapped identity is a warning, not a name\ninferred from the ARN. `ruleTags` is a fallback for a rule whose targets all\nbelong to one service. With `PORTOLAN_OFFLINE` set, in CI, or after a failed\nAWS call, the plugin replays `eventbridge.json` only when its digest matches\n`eventbridge.lock.json`.\n\nportolan.0011 records why both readers keep names and nothing else.\n\n## Where it runs: the GitOps tree, and the deployer\n\nA service's manifests say what it is; what deploys them says where it\nstands - which environment, cluster and namespace, from which directory of\nwhich repository, tracking which revision. Two plugins read that, and the\nmerge lays one under the other (portolan.0012, portolan.0013):\n\n- **extract-argocd** reads the Argo CD `Application` and `ApplicationSet`\n  objects in a GitOps tree, as wasm over the workspace, and answers with\n  what *should* run: one deployment per Application, basis `manifest`. An\n  ApplicationSet is expanded as far as a tree allows - `list` generators\n  whole, `git` directories and files by walking this repository, `matrix`\n  over those, the template rendered as Go `text/template` or fasttemplate\n  as it declared. A `clusters`, `pullRequest`, `scmProvider`, `merge` or\n  `plugin` generator, or a `git` one pointing at another repository, is a\n  warning naming the ApplicationSet and no rows. When the source path holds\n  a `kustomization.yaml`, the tool is kustomize and the images the overlay\n  pins are the declared images.\n- **fetch-argocd** asks the Argo CD API for what *does* run - the revision\n  synced, the images running, the link - and commits it as a snapshot\n  beside a lock, basis `api` (see the fetchers above).\n\n```json\n{ \"name\": \"argocd-gitops\", \"wasm\": { \"url\": \"file://plugins/portolan-go.wasm\" } }\n\n{\n  \"plugin\": \"argocd-gitops\",\n  \"in\": \"examples/gitops\",\n  \"out\": \"examples/gitops/portolan\",\n  \"options\": {\n    \"repo\": \"github.com/shortlink-org/portolan\",\n    \"paths\": [\"bootstrap\", \"appsets\"],\n    \"labels\": { \"context\": \"app.kubernetes.io/part-of\", \"service\": \"app.kubernetes.io/name\" },\n    \"out\": \"argocd.json\"\n  }\n}\n```\n\nAn Application is placed on a service by the labels it carries -\n`app.kubernetes.io/part-of` and `app.kubernetes.io/name`, the same pair\nfetch-k8s reads off a workload, or whichever the manifest names under\n`labels` - and, without them, by deploying from the service's repository\ninside the service's directory. One that matches neither way is listed on\nthe Problems page as unclaimed rather than guessed at.\n\nWhere both plugins spoke for one Application the merge folds the two into\none row, basis `both`: the deployer's shape, the tree filling what the\ndeployer did not say, and the fields the two disagree on kept as the tree's\nword under `drift` - a `deployment-drift` problem, and a chip on the\nservice page that says the difference in words. A row only the tree spoke\nfor wears `declared`.\n\n## Outside the estate: an external with a contract\n\nA service calls things nobody here builds - a card network, a tax API, a\ncarrier. The first answer the catalog gave was `unknown`: the call was\nrecorded and left unresolved, the lane drawn dashed and red, and the Problems\npage listed it beside real defects. True, and unhelpful, once the far end is\nStripe and Stripe publishes a document.\n\nAn **external** is what the catalog may claim about such a system, and no\nmore: what it answers on, read from the copy of its document vendored beside\nthe adapter that calls it, and what the manifest says it is called and is\nfor. It sits at the root beside the contexts (`catalog.externals`) with a bare\nid, no context, no aggregates and no repository, and the estate's picture\ndraws it outside, muted, exactly where it is.\n\nTwo steps describe one, and neither knows the other exists:\n\n```json\n{ \"plugin\": \"openapi\", \"in\": \"examples/payments/ledger\",\n  \"out\": \"examples/payments/ledger/portolan\",\n  \"options\": { \"external\": \"stripe\", \"externalName\": \"Stripe\",\n               \"externalUrl\": \"https://docs.stripe.com/api\",\n               \"spec\": \"src/main/java/.../infrastructure/stripe/openapi/openapi.yaml\",\n               \"out\": \"stripe.json\" } },\n{ \"plugin\": \"java-domain\", \"in\": \"examples/payments/ledger\", \"...\": \"...\",\n  \"options\": { \"externals\": { \"stripe.v1\": \"stripe\" } } }\n```\n\nThe first reads the copy and says what `stripe` answers on. The second reads\nthe adapter, finds the verb and the route in each call, looks the operation up\nin the same copy, and - told by `externals` that the copy's api id belongs to\n`stripe` - records the call as `stripe.v1/PostPaymentIntents`, declared, on a\nlane of kind `external`. The merge joins the two by the id; a call to an\noperation the copy declares resolves, one it does not is reported by the\nextractor and left out.\n\nNeither line is needed when the tree can say it itself. An `openapi` step\nwith no `spec` walks the tree for every document and reads what sits beside\neach one: a server generated from it - oapi-codegen's `ServerInterface`,\nswag's `docs` package, a handler or controller written against it - means the\nservice implements it, and the document is what the service provides; a\nclient generated from it - `ClientInterface`, a `client.gen.go`, an adapter\nnamed after a client - means the service calls it, and the document names a\nsystem this tree does not implement. That system is an external, with the\nid, the name and the summary the document gives itself: a copy titled\n\"Gordian Flights \u0026 Ancillaries API\" becomes `gordian-flights-ancillaries`,\nthe trailing \"API\" dropped because the system is the thing and not its\ninterface. `peers` on the same step says which called documents are ours -\n`{\"auth.v1\": \"auth.auth\"}` - and those are skipped, because the service that\nimplements them describes them; `externals` names a system when the title\nwould not, `{\"stripe.v1\": \"stripe\"}`. A document with neither a server nor a\nclient beside it is reported and left alone, since reading it as either would\nbe a guess.\n\nThe domain extractor keeps the same rule from its side: a generated HTTP\nclient whose api no `peers` line claim
