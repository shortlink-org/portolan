branch worktree and saved in\nthe same file, so the site renders them with the renderer it already has.\n\nThe site overlays a saved draft on the catalog it is built from. An entity main\nchanged since the draft's base, and the branch changed too, is a conflict and\nshows both versions. A draft is shown only when the reader ticks it, and the\nversion on screen is part of the address (`?v=\u003cbranch\u003e`). Every page reads the\nbranch's version of its entity in the catalog's own shape and marks what\ndiffers on the rows it already has; a page of its own is used only where there\nis nothing in main to lay the branch over.\n\nA draft stays until someone deletes it. The site does not track whether the\nbranch merged or still exists; `portolan dev` reports a branch that moved past\nthe saved tip, that failed to regenerate, or that is gone.\n\n### Consequences\n\n- Good: the branch is read in the flow, event, aggregate and service pages the\n  reader already knows, including on a static site.\n- Good: the merge-base keeps main's own progress out of the branch's changes,\n  and makes a conflict with main something that can be shown.\n- Good: no forge token, CI minutes or artifact download stands between a reader\n  and a draft.\n- Bad: a draft is as fresh as its last generation; nothing refreshes it when\n  the branch moves.\n- Bad: a draft generated with the current extractors does not show a change the\n  branch makes to an extractor itself.\n- Bad: saved drafts are files in the repository and have to be deleted by hand.\n- Neutral: flow steps at the base and on the branch are paired by what they\n  do - their ends, kind and call - rather than by their positional ids, so a\n  step inserted near the top reads as one added step rather than a renumbered\n  flow. Extractors keep their ids as they are.\n","relates":{},"source":"adr/0019-a-branch-draft-is-generated-in-dev-compared-from-its-merge-base-and-saved-beside-main.md","created":{"commit":"e183e551e2109a50ecba5796565b5da32c46168a","author":"Victor Login","date":"2026-09-15T11:49:28+07:00"},"revised":{"commit":"af83021e63e9c22be8fab4f73a616ed3faf78140","author":"Victor Login","date":"2026-09-15T11:53:47+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0020","name":"Task links are read from the history, never written into a fragment","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0020","slug":"portolan-0020-task-links-are-read-from-the-history-never-written-into-a-fragment","number":20,"title":"Task links are read from the history, never written into a fragment","status":"accepted","date":"2026-09-15","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nThe work-items verifier connects a task to what it changed: a commit whose\nmessage names `SHO-7` touched a flow's source file, so the flow shows `SHO-7`,\nand the task's card lists that commit, its subject, author, date and paths.\nThe verifier wrote those links into a fragment under `portolan-work-items/`,\nand the fragment was committed like any other.\n\nThat is the record portolan.0010 took out of fragments, under another name. A\nlink names the commits that mention the task, and a file cannot name the\ncommit it lands in. A commit that changes a flow for `SHO-7` and carries the\nregenerated catalog, as portolan.0010 asks, adds itself to the links the moment\nit is made: `gen --check` is red on the commit that regenerated everything. A\nsecond commit catches up only if its message names no task; if it names one,\nit links itself and the check never agrees. A rebase moves every hash and the\nlinks go stale again. Every task landed so far needed a regeneration commit\nthat was careful not to say what it was for.\n\n## Decision Drivers\n\n- A commit that changes a source for a task, with the catalog regenerated in\n  the same commit, passes `gen --check` (kept from portolan.0010).\n- The reader sees the task on the flows, steps, services and decisions it\n  changed, including for the commit just made.\n- Catalog profiles keep choosing which estates show which verifier's links,\n  with the configuration the settings page already writes.\n- A plugin knows no clock and no repository for provenance (portolan.0002,\n  portolan.0010); the work-items scan reads a repository by design, and stays\n  the only code that does.\n\n## Considered Options\n\n1. **The history's.** Nothing is generated; whoever reads the catalog asks the\n   history which commits name which tasks, as it asks when a source changed.\n2. **Leave out the commits that touch the output.** A commit carrying its\n   regenerated links would not link itself.\n3. **Keep writing the fragment, and leave it out of `gen --check`.**\n\n## Decision Outcome\n\nChosen option: **the history's**.\n\nThe verifier's `run` writes nothing, and a fragment written by an earlier\nversion is swept by the next generation. `scanWorkItems` does what `run` did:\nit reads the checkout's history against the merged catalog and returns the\nlinks as a fragment in memory. `scripts/work-items-history.mjs` calls it for\nevery work-items verifier the manifest declares, where the catalog is read:\n\n- the site gets the links from the virtual module `virtual:portolan-work-items`,\n  built at build time and re-read under the dev server when a source changes,\n  the same as `virtual:portolan-provenance`;\n- each verifier's links keep the path the settings page writes\n  (`\u003cout\u003e/\u003cfile\u003e`), and a catalog profile shows them when its sources match\n  that path, as before;\n- a full scan from the settings page is a reading without the commit limit\n  for that verifier until the dev server stops, and runs no generation.\n\nOption 2 drops exactly the commits that follow the rule: a commit that changes\na flow for a task and regenerates the catalog touches the output, so the task\nwould never be linked to the change it describes. Option 3 keeps a file that is\nwrong on every commit that matters, and a check that looks away from it checks\nnothing.\n\n### Consequences\n\n- Good: a task's commit is one commit. `gen --check` is green on it, a rebase\n  changes nothing on disk, and a regeneration commit may say what it is for.\n- Good: the links are never older than the checkout; the commit just made shows\n  after a dev server restart or the next change to a source.\n- Bad: reading task links needs git and the whole catalog where the site is\n  built. The build reads the history for provenance already, and the Pages\n  workflow fetches the full history for it.\n- Bad: the generator's outputs - the markdown pages, LikeC4, exports - carry no\n  task links. None drew them.\n- Neutral: explicit links authored as catalog fragments are unchanged; they\n  name no commit, and stay files.\n","relates":{},"source":"adr/0020-task-links-are-read-from-the-history-never-written-into-a-fragment.md","created":{"commit":"6dd9a041d7abb604001aa87cec3dfbea268715b1","author":"Victor Login","date":"2026-09-15T19:41:09+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0021","name":"An inferred HTTP verb links a call, at medium confidence","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0021","slug":"portolan-0021-an-inferred-http-verb-links-a-call-at-medium-confidence","number":21,"title":"An inferred HTTP verb links a call, at medium confidence","status":"accepted","date":"2026-09-15","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA Django URLConf proves a path, and often nothing about the verb: a view\nmounted as a plain function answers every verb Django routes to it.\n`extract-django` reads the verb from what the code declares - decorators,\n`http_method_names`, a branch on `request.method`, a project wrapper - and,\nwhen none of those speaks, infers it from what the handler reads off the\nrequest: `request.POST`, `request.FILES`, `request.body` or `request.read()`\nmean POST, `request.GET` alone means GET.\n\nThe catalog had no way to say a verb was inferred. So the extractor kept the\ninferred verb out of `provides` and left `http.method` empty there, carrying\nit only in the OpenAPI export as `x-portolan-verb: inferred`. The merge\nmatches an outbound `http-client/\u003cVERB\u003e \u003cpath\u003e` call against `provides` by\nverb and path, and never against an empty verb, so a caller of such a route\nstayed unresolved. On one real estate four routes were affected: two proxy\nGETs and two upload POSTs.\n\n## Decision Drivers\n\n- A call that plainly reaches a route should link; an unresolved call on\n  Problems that everyone knows the answer to trains readers to ignore it.\n- A guess must not read as a declaration, on the route or on the link.\n- The status vocabulary - verified, declared, unresolved - is read by the\n  problem rules, the map and every chip; a fourth value costs all of them.\n- A declared route, and every committed fragment, must read as it did.\n\n## Considered Options\n\n1. **The route carries the verb with its basis; the link keeps status\n   `declared` and lowers its resolution confidence.**\n2. **A new status, `inferred`,** on the call and the step.\n3. **Keep the verb out of `provides`** and leave such calls unresolved.\n4. **Write the verb into `provides` as if declared.**\n\n## Decision Outcome\n\nChosen option: **1.**\n\nAn `HttpRoute` gains `methodBasis` - absent reads `declared`, `inferred` is a\nverb no declaration names - and, for an inferred verb, `methodEvidence`: the\nrule and where it was read, `{rule: \"reads request.FILES\", source:\n\"geo/views.py:64\"}`. Validation refuses an inferred basis with no verb or no\nevidence. The field is the same shape as `basis` elsewhere in the catalog:\nwho said so, with the default left unwritten.\n\nThe merge treats an inferred verb as a candidate like any other; an empty verb\nstill never is. A link made on one keeps status `declared`, because the route\nit names is declared by the URLConf, and its `destination.resolution` carries\n`confidence: medium` with the provider's `methodEvidence`. A link on a\ndeclared verb writes no confidence, which reads `high`, and so every existing\nresolution is unchanged. `confidence` uses the vocabulary a flow trigger and\na composition seam already use; `extract-django` already set its trigger to\n`medium` for the same inference. When two fragments give the same method a\nroute on the same path, a declared verb replaces an inferred one, and either\nreplaces an empty one.\n\nThe page shows the lowered confidence and the reading in the step's HTTP\ndestination evidence, and a \"verb inferred\" mark beside the route on the\nservice's contract; generated Markdown says the same.\n\nOption 2 was rejected because the uncertainty is in one part of one match, not\nin whether the relationship is stated by source: the call site is read, the\nroute is mounted. A status would move every such edge out of the declared set\nthat the map and the problem rules count, for a fact the resolution can carry.\nOption 3 left a known link unresolved. Option 4 made a guess indistinguishable\nfrom a decorator.\n\nA call that uses a different verb from the inferred one still does not link,\nthough Django would route it: the inference names the verb the handler is\nwritten for, and a caller using another one is worth a look. A unique-suffix\nmatch is also a heuristic and writes no confidence yet; it keeps saying so\nthrough its basis.\n","relates":{},"source":"adr/0021-an-inferred-http-verb-links-a-call-at-medium-confidence.md","created":{"commit":"1a91a71e422ecf63e7f5b681d805945dcff860b8","author":"Victor Login","date":"2026-09-15T23:16:59+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0022","name":"The site toolchain is optional, and the image that needs it ships as its own tag","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0022","slug":"portolan-0022-the-site-toolchain-is-optional-and-ships-as-its-own-image-tag","number":22,"title":"The site toolchain is optional, and the image that needs it ships as its own tag","status":"accepted","date":"2026-09-16","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\n`ghcr.io/shortlink-org/portolan:0.6.2` was 830 MB compressed, near 4 GB on\ndisk. A pipeline that runs `portolan check` on every merge request pulls that\nimage, and what it pulls is mostly things the command never opens: the full\nNode image carries a C toolchain nothing here compiles with, the JDK carries\nthe tools to build a JDK, and `node_modules` carries vite, React, LikeC4,\nmermaid and the icon sets the browsable site draws with.\n\nOnly `build` and `dev` load that last group. `generate`, `check`, `diff` and\n`comment` read a workspace, run extractors and write fragments; between them\nthey need a JSON schema validator, a CEL evaluator, a TypeScript parser and an\nEventBridge client. The package declared all of it as one dependency list, so\nan image that only ever checks a catalog installed the site as well.\n\nA plugin looked like the thing to move out, because plugins are what the image\nis for. They are not what it weighs: the wasm module, the Rust binary and the\nJava classes together are under 2% of the compressed image.\n\n## Decision Drivers\n\n- The command a pipeline runs on every merge request should pull as little as\n  possible.\n- A catalog is generated in a pipeline far more often than a site is built.\n- What the image installs must be exactly what the commands in it run, and\n  the ones it cannot serve must say so.\n- A developer running `npm install` still gets every command, without\n  remembering a flag.\n- Nothing may be fetched from the network at run time that was not fetched at\n  build time: a generated catalog is a build output, and a pipeline that\n  reaches GitHub for a plugin is a pipeline that fails when GitHub does.\n\n## Considered Options\n\n- Download the plugins from GitHub releases on first use and ship none of\n  them.\n- Keep one image and trim only what is not a dependency: the base image and\n  the JDK.\n- Declare the site toolchain optional, publish the image without it, and\n  publish a second tag that has it.\n\n## Decision Outcome\n\nChosen: the site toolchain is optional, and the image that needs it is its own\ntag.\n\n`dependencies` holds what every command needs. `optionalDependencies` holds\nvite, React, LikeC4 and what they draw with. An `npm install` still brings\nboth, because npm installs optional dependencies by default; only an\ninstallation that opts out skips them, and the container image is the one that\ndoes. Asked for a site it has not got, the CLI names what is missing and where\nto get it rather than failing on a module it cannot resolve, and `portolan\ndoctor` reports the toolchain the way it reports Go, Python and Java.\n\nThe Dockerfile has two targets. `runtime` is published under the version tags\nand holds what generate, check, diff and comment read. `site` is the same\nimage with the optional toolchain installed on top, published as `-site`, and\nthe GitLab Pages preset asks for that tag. Because one is a layer over the\nother, a registry stores the difference once.\n\nThe image drops what it was carrying for nobody. The base is `node:24-slim`,\nsince no dependency is compiled and the compilers that are needed live in\nbuild stages. The Java extractor reads sources through\n`javax.tools.JavaCompiler`, so it keeps `jdk.compiler` - a JRE would not do -\nbut as a `jlink` runtime of that module and `java.base` alone rather than a\nfull JDK. Type declarations and source maps are deleted after install, and\n`.dockerignore` mirrors the build output `.gitignore` keeps out of the\nrepository, so a developer's checkout does not put a local binary in the\nimage.\n\nDownloading plugins was rejected on its own terms: it trades a run-time\nnetwork dependency for about 2% of the image. What is expensive about a plugin\nis the toolchain it runs in, not the plugin.\n\n### Consequences\n\n- Good: the tag a pipeline pulls on every merge request went from 830 MB to\n  185 MB compressed, and the tag that builds a site to 319 MB.\n- Good: the image installs what its commands run, and a command it cannot\n  serve says which tag can.\n- Good: nothing is fetched at run time that was not fetched at build time.\n- Bad: two tags are published per release, and a Pages job that names the\n  wrong one fails at `build` rather than at pull.\n- Bad: `npm install --omit=optional` leaves an installation that cannot build\n  a site, and the flag is one a user may pass for unrelated reasons.\n- Neutral: `npm ci --omit=optional` cannot be used to produce the smaller\n  tree, because it drops every optional dependency in the tree - including the\n  platform bindings a native package declares that way, without which the\n  TypeScript extractor does not load. The image removes the optional\n  dependencies from `package.json` and installs from the lockfile instead.\n","relates":{},"source":"adr/0022-the-site-toolchain-is-optional-and-ships-as-its-own-image-tag.md","created":{"commit":"8cb3a3b4bdbe15cd0ad1f5b3611945acb15be630","author":"Victor Login","date":"2026-09-16T16:07:13+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0023","name":"The rules the code checks are held against the rules the document promises","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0023","slug":"portolan-0023-the-rules-the-code-checks-are-held-against-the-rules-the-document-promises","number":23,"title":"The rules the code checks are held against the rules the document promises","status":"accepted","date":"2026-09-16","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nSince portolan.0015 a rule on a field arrives in one vocabulary whatever\nsource it came from: `min_len`, `format uuid`, `in USD, EUR`. `extract-proto`\nand `extract-openapi` read them off a contract, `extract-django` off a model,\nand `extract-ts` now reads them off the zod schema a handler parses a request\nwith.\n\nThat last one is different in kind. A proto and an OpenAPI document are what a\ncaller is promised; a zod schema is what the service will actually refuse. A\nservice that has both has said two things about one field, and the catalog\nheld them apart: the document's word on the interface's request message, the\ncode's word on the operation the handler runs. Nothing anywhere said when the\ntwo disagree.\n\nThe disagreement is a real defect on both sides of the arrow. `cart`'s\ndocument says `AddItemRequest.sku` is a string; its handler refuses an empty\none. A caller written to the document, generated from it, or tested against\nit, gets a 400 nothing documented. The other direction is worse in a quieter\nway: a document that promises `maxLength` the handler never checks sends the\nvalue on to something that did not expect it.\n\n## Decision Drivers\n\n- A projection says what is, a rule says what should not be (portolan.0017):\n  the comparison belongs on a row, the judgement in CEL, and neither in an\n  extractor.\n- Nothing about a problem is written into a fragment (portolan.0016), and the\n  two sides arrive from two different extractors that first meet at the merge.\n  Whatever compares them has to run over the merged catalog.\n- Neither side is the authority. The catalog does not know whether the bound\n  in the code is the truth the document is behind on, or a check nobody meant\n  to keep; a row that named a culprit would be guessing.\n- Only what both sides say about the same field can be compared. A route's\n  path parameter is in no body message; a field the document carries and this\n  handler never parses is another operation's or another layer's.\n- The one vocabulary is what makes any of this possible: a source whose rules\n  the catalog does not yet map is silent here, not wrong.\n\n## Considered Options\n\n1. **A subject the rule reads: `operation`, carrying the differences, with a\n   shipped rule `rules-drift` over it.** The row says which field's rules\n   differ and how, in both sides' words; the rule says that a difference is\n   worth a reader's time, and the estate can switch it off or re-grade it like\n   any other.\n2. **Compare at generation and write the drift into a fragment.** A fragment\n   would carry a judgement, and the extractor that writes it sees one side of\n   the comparison only.\n3. **Have the extractor warn.** `extract-ts` reads the schemas and the\n   document's operationIds, so it could - but not the document's shapes, which\n   `extract-openapi` reads, and a service whose contract is a proto in another\n   repository is out of its reach entirely.\n4. **Pick a side: generate the document from the schemas, or fail a build\n   where they differ.** A good practice, and a decision about one codebase\n   rather than something a catalog of many can take. A service that already\n   does it has no rows here, which is the point.\n\n## Decision Outcome\n\nChosen option: **1.**\n\n`operation` joins the subjects a rule may be written over: one row per use\ncase of an aggregate, with its kind, what exposes it, the fields its handler\nchecks, the contract and method a caller reads it as, how many fields both\nsides name, and `ruleDifferences` - one line per disagreement, in the order\nthe handler states its fields.\n\nThe comparison is over the fields both sides name, and over three things about\neach: a rule only the handler has, a rule only the document has, and a rule\nboth have with different bounds. `required` is compared the same way, since\n\"must be sent\" is the first rule a caller wants. Each line says both words and\nnames neither as wrong - `sku: the handler checks min_len = 1, the document\nsays nothing` - and the row's far end is the contract, so the reader can open\nwhat the caller reads.\n\nThe shipped rule is a warning: `size(operation.ruleDifferences) \u003e 0`. An\noperation whose handler parses nothing has no fields and no rows; so has one\nnothing exposes, or one whose method declares no request shape.\n\n#### Consequences\n\nA defect that was in neither half of the catalog - each side correct on its\nown, the pair wrong together - is now a row on the Problems page, next to the\nservice that owns both halves. The example estate shows two of them, both\nreal: `cart`'s `sku`, and the two fields `mergeBaskets` checks and its\ndocument does not.\n\nThe rule grows with the vocabulary rather than with the sources. Laravel's\nrules and Java's validation annotations map onto the same names\n(portolan.0015); when they do, the same rule holds those services to their\ndocuments with nothing new written.\n\nAn operation has no page of its own, so the row lands on the aggregate that\nhandles it, as the palette's entry for a command already does.\n\nWhat is not compared is what neither side can be held to: the type, which the\n`column-type` and `proto-drift` rules already own where it is a wire claim; a\nrule inside a nested schema a field only names; and a field one side names\nalone, which is a question about shapes rather than about bounds.\n","relates":{},"source":"adr/0023-the-rules-the-code-checks-are-held-against-the-rules-the-document-promises.md","created":{"commit":"346b30a53a319b3be7414ecc377dd9833474e1b3","author":"Victor Login","date":"2026-09-16T16:59:02+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0024","name":"A path across services is composed in the reading, not in the catalog","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0024","slug":"portolan-0024-a-path-across-services-is-composed-in-the-reading-not-in-the-catalog","number":24,"title":"A path across services is composed in the reading, not in the catalog","status":"accepted","date":"2026-09-16","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA flow stops where its service stops. `cart-checkout` ends by publishing\n`BasketCheckedOut`; what happens next is `oms`'s flow, and after that\n`ledger`'s. The catalog has known where one ends and the next begins since\ncontinuations were added — a step's `continuesAt`, its `reaches`, a handoff's\ntransport and channel, a shared event — and the rail said so with a link:\n*continues in Place order on basket checked out*. The reader clicked it, and\nthe thread they were following stayed on the page behind them.\n\nThat is the common question and the expensive one. In the example estate a\ncheckout crosses four services; in a real one read into portolan — five avia\nservices, 343 flows — half of the 316 outbound calls have a flow on the other\nside, and the other half end at a system outside the estate, correctly.\nAnswering \"and then what?\" three times in a row meant three pages, three\ncanvases and nothing that held them together.\n\n## Decision Drivers\n\n- The catalog is what the sources say. A path that crosses four services is\n  not a fact any one of them states: it is an inference made by pairing a\n  step with a flow, and the pairing already carries its own confidence.\n- A composed flow written into a fragment would be a fifth service's claim\n  about four other services' code, regenerated whenever any of them changed.\n- A reading is worth sharing. Whatever the reader opened has to survive being\n  pasted into a chat.\n- 343 flows in one estate, median two steps: opening everything for everybody\n  would make the common page worse to pay for the rare one.\n- Following forever is not following: a service that calls back into its\n  caller is a cycle, and four services deep the reader is asking a different\n  question from the one they opened.\n\n## Considered Options\n\n1. **Compose in the reading.** `flow/journey.ts` takes the rail's rows and,\n   under a step the reader opened, splices the rows of the flow it continues\n   in — indented, marked with whose they are, and keyed by the door they came\n   through. What is open lives in the address. Closed by default.\n2. **Compose at generation, into the catalog.** The model already has the\n   shape for it: `Flow.includes` and `Flow.composition` record fragments\n   spliced into a root flow with the seam that proved each one. Composing\n   across services would make one flow out of four services' code.\n3. **A page of its own: the journey as an entity.** A third kind of page\n   beside flows and services, listing end-to-end paths.\n4. **Leave the link.** What was there.\n\n## Decision Outcome\n\nChosen option: **1.**\n\nA journey is a reading of the catalog, built where it is read. `journey.ts`\nis pure: rows in, rows out, with two guards that say so on the row rather\nthan stopping quietly — a flow already on the path reads *already on this\npath*, and the fourth flow deep reads *as deep as this goes*. Every row of a\nfollowed flow carries which flow and which service it came from, and its key\nis spelled from the door it came through, so two flows that both call their\nfirst step `s1` stay apart.\n\nThe rail's continuation link becomes a door: **follow** opens the other\nflow's steps under the step that calls it, **hide** closes them, and the link\nto that flow's own page stays beside it. The toolbar says what the whole path\nwould cost before it is opened (`follow 2`) and what it added once it is\n(`+99 steps · 4 services`). What is open is in the address — `?open=` with\nthe keys, or `?open=*` for \"follow all\", since the list of a deep estate is a\nkilobyte of URL and what the reader asked for was one thing. Nothing is open\nuntil the reader opens it.\n\nSelecting a followed step selects it in the flow it belongs to, so the panel\nthat opens is that flow's; the canvas keeps drawing the flow the page is\nabout, because its picture is a generated LikeC4 view of that flow and the\npath is a reading rather than a view. The Mermaid copy takes the opened path:\n`journeyFlow` composes the same rows into one `Flow` object, participants\njoined, and the existing sequence writer draws it — so what is copied is what\nis on the rail.\n\n#### Consequences\n\nThe question \"and then what?\" is answered without leaving the page, and the\nanswer can be sent to somebody as a link.\n\nOption 2 was rejected because it puts an inference in the catalog, where it\nwould be regenerated on every change to any service on the path and where a\nreader could no longer tell what one service's code says from what the pairing\nguessed. The `composition` fields stay what they are: an extractor's record of\nfragments it spliced into a root flow *within one service*, with the seam that\nproved each one.\n\nOption 3 was rejected because a journey has no identity of its own. It starts\nat a flow, and which flow the reader started from is the whole of what makes\none path rather than another.\n\nThe canvas and the rail now disagree about how much is on screen. That is the\nhonest state of it — the picture is a generated view of one flow — and the\ndoor rows are where the difference is visible rather than hidden.\n","relates":{},"source":"adr/0024-a-path-across-services-is-composed-in-the-reading-not-in-the-catalog.md","created":{"commit":"a69db7e10d49cde1bbbdc38c4e335c110059a016","author":"Victor Login","date":"2026-09-16T18:19:45+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0025","name":"An endpoint flow names the method it answers, and that is what pairs a call with its handler","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0025","slug":"portolan-0025-an-endpoint-flow-names-the-method-it-answers-and-that-is-what-pairs-a-call-with-its-handler","number":25,"title":"An endpoint flow names the method it answers, and that is what pairs a call with its handler","status":"accepted","date":"2026-09-16","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nportolan.0024 made a path across services readable: a step that calls the next\nservice opens that service's flow under it. It worked on the example estate and\nbarely anywhere else.\n\nThe pairing was `continuesAt`/`reaches` — the identity of the source function a\nstep reaches, which one extractor knows because it read both the call site and\nthe handler in one repository. Between two services read separately there is no\nsuch identity, and nothing else connected them: a caller's step says which\nmethod it calls (`cart.v1/addItem`), and the flow on the other side said\nnothing about which method it was. The handler's extractor knew the route and\nthe handler; the contract was the other extractor's business.\n\nMeasured on a real estate of five avia services: 343 flows, 316 outbound rpc\nsteps, of which 70 land on a service of the estate and 246 on systems outside\nit. Three steps had a continuation. In the example estate, `cart-checkout`\nhad two, both from events; its calls to `auth` and `pricing` had none.\n\n## Decision Drivers\n\n- The two halves of the pairing live in two extractors' readings. Neither can\n  state it; the merged catalog can.\n- A wrong pairing is worse than no pairing: it would put another service's\n  steps under a call that never makes it.\n- The difference between \"answers this call\" and \"makes the same call\" is the\n  direction, and the catalog already records it — an endpoint flow's opening\n  step comes in from an actor lane and lands on the service that serves it.\n- Eight extractors would each have to be taught the same thing, in five\n  languages, and a ninth would forget.\n\n## Considered Options\n\n1. **Name the served method in `enrich`, pair on it in `continues`.** The\n   opening step of an endpoint flow gains the `ref` of the interface method it\n   answers; a call's step pairs with the flow whose opening step serves that\n   method on that service.\n2. **Each extractor writes it.** Every extractor knows its own operationId —\n   and `extract-openapi`, which reads the contract, is not the one that reads\n   the handler, so several of them would have to guess at the interface id.\n3. **Pair on the trigger label, with no ref.** \"POST /v1/baskets/{id}/items\"\n   against a call's route, at read time, every time, for every pair of flows.\n4. **Compose the flows into one at enrich.** The machinery is there:\n   `composeExecutionContinuations` already splices a flow into another when\n   `continuesAt` matches an `entrypoint`.\n\n## Decision Outcome\n\nChosen option: **1.**\n\n`nameServedMethods` runs in the enrichment pipeline, before anything composes\nor summarises. For a flow whose first step comes in from an actor lane and\ncarries no `ref` of its own, it finds the method of the service that step lands\non: by the name the trigger and the step already carry — an operationId, an\nrpc, `GraphQL · Query.basket` — and failing that by the route the trigger\nspells, matched against the provider's path the way a call is matched. Two\nmethods answering to one name is silence, not a guess. A flow with no trigger\nis left alone: a recording of an endpoint running is an example of it, not a\nsecond way in, and pairing a caller with a trace would make the recording look\nlike the handler.\n\n`continues.ts` gains the rule that pairing rests on: a step of kind `rpc`\nnaming method `R` on service `S` continues in a flow whose opening step is `R`\nbeing served on `S`. Confidence is high — both halves are the contract's word —\nand the direction is what keeps two callers of one method from continuing each\nother, which they never do.\n\n#### Consequences\n\nThe path now crosses services that were read separately, which is every estate\nmade of more than one repository. On the example, `cart-checkout` goes from two\ndoors to four — `validateSession` into `auth` and `GetQuote` into `pricing`\njoin the two events — and 17 calls in total find their handler. On the avia\nestate the three become 47: `aviacore`'s `POST /search` alone opens fourteen,\ninto `aviasupp`'s search, book and get-booking and back into `aviaadmin`. What\nstays unpaired there is what should: 246 calls to avianotifier, mailota,\nAmadeus and websky, which are outside the estate and end where the estate does.\n\nA ref on an endpoint flow's opening step is a fact the rest of the app can read\ntoo, and one reader already did: the command chain pairs a caller with the\nserver entry when exactly one flow serves the method, which now happens by\ndesign rather than by luck.\n\nOption 2 spreads one rule across five languages. Option 3 does the same\nmatching on every render instead of once, and leaves nothing on the step for\nanything else to read. Option 4 is what portolan.0024 decided against, and at\nthis scale it would also make every endpoint flow swallow its callees': the\nreader asked for a door, not for a hundred-step flow by default.\n","relates":{},"source":"adr/0025-an-endpoint-flow-names-the-method-it-answers-and-that-is-what-pairs-a-call-with-its-handler.md","created":{"commit":"81c172ff9448d7c70e678b7336076095879ab6fe","author":"Victor Login","date":"2026-09-16T18:45:18+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0026","name":"The whole path is drawn; a partly opened one is not","summary":"Context and Problem Statement","badges":["superseded"],"record":{"id":"portolan.0026","slug":"portolan-0026-the-whole-path-is-drawn-a-partly-opened-one-is-not","number":26,"title":"The whole path is drawn; a partly opened one is not","status":"superseded","date":"2026-09-16","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nportolan.0024 put the path on the rail and left the canvas alone, and said so\nin its consequences: \"the canvas and the rail now disagree about how much is on\nscreen\". A reader who opened three services deep read the sequence in the list\nand looked at a picture of one service.\n\nThe reason given was that a flow's picture is a LikeC4 dynamic view generated\nand laid out at build time, and a path is opened at read time, one door at a\ntime — there is nothing to generate a view *for*. That is true of a path the\nreader is part-way through. It is not true of the whole path: \"follow\neverything\" is one answer, `openEverything` computes it from the catalog, and\nthe same answer is available to the generator.\n\n## Decision Drivers\n\n- The rail and the picture are two readings of one thing; they should not\n  disagree about what the thing is.\n- A view has to be laid out before it is drawn, so only a shape decided\n  beforehand can have one. Every subset of doors a reader might open is not\n  that; the full path is.\n- Two thousand views is a slow build and a big bundle. The cost has to be\n  proportional to what it buys.\n- A picture that is not of what the reader opened is worse than no picture, so\n  a partly opened path must keep the flow's own view rather than pretend.\n\n## Considered Options\n\n1. **Generate one more view per flow that continues somewhere: the whole\n   path.** The canvas switches to it when, and only when, the reader has the\n   whole path open.\n2. **Render the sequence ourselves** — mermaid, or our own SVG — so any\n   partial opening can be drawn. Two sequence renderers in one product, and\n   the second one would have to learn everything LikeC4's already does.\n3. **Leave it as portolan.0024 had it.**\n\n## Decision Outcome\n\nChosen option: **1.**\n\n`fullJourney` composes a flow with every continuation the guards allow\nfollowed, deterministically; `gen-likec4` draws it as\n`flow_\u003cslug\u003e_journey`, titled \"— the whole path\", for each flow that\ncontinues somewhere. In the example estate that is 28 views over 72 flows; in\na five-service avia estate, 45 over 343. The page uses it when `?open=*` is on\nand the flow has a path, and keeps the flow's own view for a partly opened one\n— the picture is then honestly of the flow, and the rail is where the rest of\nthe path is.\n\nComposing for a picture made two things visible that the rail had been getting\naway with, and both are now fixed in the composition itself, so the rail and\nthe picture say the same:\n\n- **The answered call is one hop, not two.** A flow that answers a call opens\n  with that call seen from the other side. Following it drew the call again —\n  on the canvas as a second arrow out of nowhere. The opening step of a flow\n  entered through a contract continuation is dropped; an event's send and\n  receive are two hops and are both kept.\n- **The callee's caller is whoever is calling.** A flow read on its own names\n  its caller `client`, because from where it was read that is who calls.\n  Inside a path the caller is the service one hop up, so that lane is renamed\n  to it — otherwise the picture puts a browser where a service stands, and\n  `auth.auth -\u003e client` reads as an answer to the end user.\n\n#### Consequences\n\nThe reader who follows everything gets a sequence diagram of the whole path,\nlaid out by the same generator as every other picture, with the lanes of every\nservice on it. `?open=*` is what the address already carried, so the link that\nshares the path shares the picture.\n\nWhat portolan.0024 decided still stands: nothing is composed into the catalog,\nand a path is a reading. A generated view is a rendering of that reading, not a\nfact about the estate — which is why the journey view carries no ids of its own\nand is rebuilt from the catalog on every generation.\n\nA partly opened path still has no picture of itself. That is the one case where\nrail and canvas differ, and the difference is now the exception rather than the\nrule.\n","supersededBy":"portolan.0028","relates":{},"source":"adr/0026-the-whole-path-is-drawn-a-partly-opened-one-is-not.md","created":{"commit":"388a085dd4662194cec842d95033b9984cc6f8f4","author":"Victor Login","date":"2026-09-16T19:34:01+07:00"},"revised":{"commit":"96c871c9ea49e0e277ff49fa4e8ba61442e5f675","author":"Victor Login","date":"2026-09-16T22:32:19+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0028","name":"A followed flow opens as a document of its own","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0028","slug":"portolan-0028-a-followed-flow-opens-as-a-document-of-its-own","number":28,"title":"A followed flow opens as a document of its own","status":"accepted","date":"2026-09-16","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA flow stops where its service stops. The step that calls the next one names\nthe flow that answers it (portolan.0025), and the reader wants to see that\nanswer without losing the flow they are reading.\n\nThree shapes were tried for that, in order. A link, which left the page.\nUnfolding the other flow's steps into this one's rail (portolan.0024), which\nread well and drew badly: the rail said five services, the canvas drew one.\nThen pictures for the path — the whole path generated for every flow that\ncontinues (portolan.0026), and, when only part of it was open, a view composed\nand laid out in the browser (portolan.0027).\n\nThe last one is where it ended. A picture has to be laid out before it is\ndrawn, LikeC4 lays out at generation time, and the generator is a language\nservice over the whole workspace. Asking for a view per door meant a second\nlanguage service inside the release build; that build ran out of a four\ngigabyte heap and the release broke. The two commits were reverted.\n\nWhat all three share is the assumption that the path is one drawing. It is\nnot: the reader opened a door to see another flow, and that flow has a picture\nalready — laid out, generated, on its own page.\n\n## Decision Drivers\n\n- A picture is laid out before it is drawn. Anything assembled while reading\n  therefore has no picture of its own, and buying one costs a generated view\n  per shape a reader might assemble.\n- The flow being followed is a flow. Whatever is right for it on its own page\n  is right for it here.\n- Following is not one step deep. A call lands in a flow that calls further,\n  and the reader wants both on screen without either replacing the other.\n- The address should carry what is open, so a path can be sent.\n\n## Considered Options\n\n1. **Open the followed flow as another document beside this one**, with its\n   own rail and its own canvas, drawn by the view it already has.\n2. **Keep composing pictures** and pay for the layout — pre-generate more\n   shapes, or run a layouter in the browser. The first is what portolan.0026\n   and portolan.0027 did and what broke the build; the second is a second\n   layout engine in the product.\n3. **Leave the rail unfolding as portolan.0024 had it** and accept that the\n   canvas shows one service while the rail shows five.\n\n## Decision Outcome\n\nChosen option: **1.**\n\n`flow/panes.ts` holds the whole of it. A door is named as the rail and the\naddress already name it, `\u003cstep id\u003e\u003e\u003cflow slug\u003e`, and a door inside a document\nis named from that document: `s2\u003eauth-validate-session/t4\u003eledger-authorize`.\nSo the key says the chain, closing a document closes what was read through it,\nand `?open=` carries the keys in the order they were opened. A key naming a\nflow this catalog does not have is dropped rather than refused, so a link from\nan older estate opens what it still can.\n\nThe page the reader came to is the first document, with its rail as it was.\nThe ones they open stack in the column beside it: the second opens the column,\nthe third goes under it, and so on, each a `FlowPane` with a header that folds\nits steps open, fits its picture, opens the flow on its own page, or closes\nthe document. Their rails come folded — a document opened to see where a call\nlands is looked at before it is read, and a list of steps under every window\nwould leave no room for the pictures that are the point of opening them.\n\nOne door does both. It unfolds the other flow's steps into this rail, where\nportolan.0024 put them, and it opens that flow as a document: the rail is\nwhere a path is read, the document is where it is drawn, and neither has to\npretend to be the other. Pointing at a row of a followed flow lights that\nflow's own step on its own picture and says which window is being read, so\nthe two readings stay one reading.\n\n#### Consequences\n\nNothing is composed and nothing is generated. There is no view per path and\nnone per door, so the build has no second language service in it, the bundle\ngrows by nothing, and the class of problems that took the release down is\ngone with the code that made it.\n\nWhat portolan.0024 decided stands whole: a path across services is a reading,\nthe catalog holds flows, and the rail is where that reading is followed. What\nit could not do was draw it, and that is the part the documents answer.\nportolan.0026 is superseded: the whole-path views it generated are what the\ndocuments replace, and they are removed. portolan.0027 was reverted before\nthis was written.\n\nSeveral documents means several canvases on one screen, each with a LikeC4\nview in it. That is the cost, and it is the reader's to spend: nothing is open\nuntil they open it, and closing a document closes what was read through it.\n","supersedes":["portolan.0026"],"relates":{},"source":"adr/0028-a-followed-flow-opens-as-a-document-of-its-own.md","created":{"commit":"96c871c9ea49e0e277ff49fa4e8ba61442e5f675","author":"Victor Login","date":"2026-09-16T22:32:19+07:00"},"revised":{"commit":"b16c879fe0630f7b9f9d432f6eb7765f9d9f2ad6","author":"Victor Login","date":"2026-09-16T22:49:16+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0029","name":"A branch of a vendored service is drafted from a clone of its own repository","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0029","slug":"portolan-0029-a-branch-of-a-vendored-service-is-drafted-from-a-clone-of-its-own-repository","number":29,"title":"A branch of a vendored service is drafted from a clone of its own repository","status":"accepted","date":"2026-09-17","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA draft is generated from two worktrees of the workspace (portolan.0019): the\nbranch's tip and its merge-base with main. That holds for an estate whose\nservices live in the repository the catalog is built from, and for no other.\n\nAn estate whose services live in repositories of their own vendors them: a\n`fetch-git` step writes a pinned snapshot of each service under\n`vendor/repos/\u003cowner\u003e/\u003cname\u003e`, and the workspace holds text, not history. The\nbranches a reader wants to see are branches of `aviacore`, not of the catalog,\nand the workspace has none of them. The feature that shows a branch beside main\nis therefore unavailable exactly where an estate is largest: many repositories,\none catalog, one task touching several services at once.\n\nTwo facts make this more than a missing switch. A task spans repositories, so a\nbranch name is the only thing its drafts share, and two projects may be on a\nbranch of the same name that share nothing else. And the branch under review is\noften not where the manifest points: it may be unpushed, or pushed to a remote\nthe manifest does not name, while the manifest names the repository the catalog\ncites in its source links.\n\n## Decision Drivers\n\n- The comparison must stay the one portolan.0019 makes; only where the two\n  sides come from may differ.\n- A draft must be generatable without a forge token and without the branch\n  being pushed anywhere.\n- A source link in a draft must open the branch's commit on the forge the\n  manifest names, not a path on somebody's laptop.\n- A build, a check and a published site must need none of this: a clone is a\n  fact about one machine.\n\n## Considered Options\n\n- Fetch the branch from the forge with the `fetch-git` step, pinning it to the\n  branch tip.\n- Make the catalog's own repository carry a branch per service branch.\n- Read the branch out of a clone of the service's repository on this machine.\n\n## Decision Outcome\n\nChosen: read it out of a clone.\n\nA project may name a `clone`: a checkout of its `repository` on this machine,\nrelative to the workspace. `portolan dev` lists that project's branches there,\nagainst that repository's own main, and offers only the branches whose changed\npaths the snapshot takes.\n\nGenerating a draft of such a branch puts the service's tree where the snapshot\nsits. Both sides are worktrees of the workspace at its current commit; what\ndiffers between them is the vendored copy, written at the branch's tip on one\nside and at its merge-base on the other, by the manifest's own `fetch-git`\nstep with the commit replaced and the tree read out of the clone instead of\nfetched. The pin beside the copy keeps naming the repository the manifest\nnames, with the commit of that side, so the draft's source links open the\nbranch's commit on the forge. Everything after that - the extract steps, the\nentity comparison, the views, the saved file - is portolan.0019 unchanged.\n\nA clone is read, never written and never fetched into: what is on this machine\nis what is drafted. A clone that is not there is reported on the branches page,\nproject by project, and the other projects are still drafted.\n\n### Consequences\n\n- Good: an estate of many repositories gets branch drafts, and a task that\n  touches four services is four drafts of one branch name.\n- Good: a branch that was never pushed, or one pushed to a remote the manifest\n  does not name, is drafted like any other.\n- Good: nothing about a build changes; `clone` is read by `portolan dev` alone,\n  and a published site never sees it.\n- Bad: the draft is only as current as the clone. A branch that moved on the\n  forge but not on this machine is drafted at the commit the clone has, and\n  reported as fresh.\n- Bad: a manifest now carries a path that is true on one machine. It is\n  committed like everything else, and a teammate without that checkout is told\n  the clone is missing rather than being shown a draft.\n- Neutral: the workspace side of a vendored draft is its current commit, not a\n  branch of the catalog. A change to the catalog's own extract steps is\n  therefore in both sides of the comparison, which is what makes the service's\n  commit the only difference.\n","relates":{},"source":"adr/0029-a-branch-of-a-vendored-service-is-drafted-from-a-clone-of-its-own-repository.md","created":{"commit":"6191dd2815d8768f95d9757f6232363a36d06bfd","author":"Victor Login","date":"2026-09-17T15:17:03+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0030","name":"Two changes to one entity conflict only when they touch the same thing","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0030","slug":"portolan-0030-two-changes-to-one-entity-conflict-only-when-they-touch-the-same-thing","number":30,"title":"Two changes to one entity conflict only when they touch the same thing","status":"accepted","date":"2026-09-17","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA draft is compared from the commit the branch was cut at, and laid over main\nas it is now (portolan.0019). When main has moved the same entity since that\ncommit, the entity was called a conflict and both versions were shown in red.\n\nOn a real estate that is mostly wrong. A service gains calls all the time: a\nbranch adds two callbacks to another service while main, in the meantime,\ngained four calls to a third. Nothing is in dispute - the two changes are in\none entity because a service is one entity, not because they are about the\nsame thing - and a reader who is told \"conflict\" has to read both columns to\nfind out there was nothing to resolve. Said often enough, the word stops\nmeaning anything, and the conflict that does matter is read past.\n\n## Decision Drivers\n\n- The word conflict has to keep its meaning: something a person must decide.\n- What main did since the base is worth showing either way; only its severity\n  is in question.\n- The rule must be computed from what the catalog already knows, without\n  asking an extractor for a diff of its own.\n\n## Considered Options\n\n- Keep every entity both sides moved as a conflict, and soften the wording.\n- Compare the two versions field by field, generically, over the whole entity.\n- Compare the changes the two sides made, by what each change is about.\n\n## Decision Outcome\n\nChosen: compare what each side's changes are about.\n\nEvery line a draft shows - a step relabelled, a field retyped, a call added, a\nmethod removed - is produced with a subject: the step's id at the base, the\nfield's name, the call's id, the method's key. The branch's changes and main's\nchanges are both computed against the same base, so their subjects are\ncomparable.\n\nA subject that appears on both sides is a conflict: one step relabelled two\nways, one field given two types, one call added here and removed there. No\nshared subject is `grown` - both sides moved the entity, neither touched what\nthe other did - and it is shown in the neutral tone, with both columns, as\n\"also on main\".\n\nAn entity main removed while the branch changed it, and one the branch adds\nthat main has added differently, stay conflicts: there is no pair of changes\nto compare, and the two versions are the whole disagreement.\n\n### Consequences\n\n- Good: a conflict is again something to act on, and the estate's ordinary\n  parallel growth reads as what it is.\n- Good: what main did since the base is still shown for both, so nothing is\n  hidden by the softer grading.\n- Bad: two changes about the same thing under different names - a call whose\n  id changed and a call added - read as parallel growth rather than a\n  conflict. The subject is the catalog's identity for the change, and where\n  the catalog cannot tell, neither can this.\n- Neutral: the states a draft's entity can be in are now five, and a page that\n  files entities by state has one more column.\n","relates":{},"source":"adr/0030-two-changes-to-one-entity-conflict-only-when-they-touch-the-same-thing.md","created":{"commit":"5988fd29f0a85fa38e68b42d98b80fe6bde76db2","author":"Victor Login","date":"2026-09-17T15:59:26+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0031","name":"A verifier is handed the flows as declared, not as enriched","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0031","slug":"portolan-0031-a-verifier-is-handed-the-flows-as-declared-not-as-enriched","number":31,"title":"A verifier is handed the flows as declared, not as enriched","status":"accepted","date":"2026-09-18","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA verifier reads evidence against the catalog and writes back a fragment. For\n`verify-otel` that fragment is the flow a recording opened, with the steps the\nrecording showed raised and counted and the hops the code does not declare laid\nin (portolan.0014). The merge lays that flow over the declaration step for step\nand refuses it when the two disagree about anything but what a recording can\nvouch for.\n\nThe generator handed verifiers the catalog after enrichment. Enrichment writes\ninto flows: the opening step of an endpoint flow gains the method it answers\n(portolan.0025), the exits of a synchronous handler gain synthesized response\nsteps, a callee a step continues into is composed in. The verifier copied the\nflow it was handed, so its overlay carried all of it, and the merge found an\nopening with a ref the code never gave and steps with ids the code never gave\nthat carried no `seen`. It refused the overlay. On the example estate that was\ntwelve flows of `auth` and `cart` - every recording of them thrown away, the\n`seen` counts, the raised statuses and the examples with it - reported as\ntwelve `merge-conflict` errors.\n\n## Decision Drivers\n\n- An overlay says what the evidence saw. What the enrichment derived is said\n  again at every read; written into a source it would be said twice, and a\n  derived fact frozen into a fragment goes stale when the rule deriving it\n  changes.\n- The merge's rule for a second declaration of a flow is narrow on purpose:\n  it may raise, count and add what a recording witnessed, and nothing else.\n- Every verifier should be fixed at once, not each taught which enrichments\n  to strip.\n- A verifier still needs the enriched estate to name what it saw: a call is\n  known by the id the flows imply, an event by the consumers the flows imply.\n\n## Considered Options\n\n1. **Hand verifiers the enriched estate with the flows as declared.**\n   `loadCatalog` returns `verifierCatalog` - the enriched catalog whose `flows`\n   are the merged sources' - and the verify phase passes that.\n2. **Hand verifiers the catalog before enrichment.** The flows come out\n   right, and the calls and consumers the flows imply are gone from the\n   estate a recording is matched against.\n3. **Strip enrichment in `verify-otel`.** A synthesized response has a shape\n   one could recognise; a derived ref has none, and `oms` writes the same ref\n   itself. The next enrichment that writes into a flow would break it again.\n4. **Let the merge tolerate it.** Accept an incoming ref where the code has\n   none on an opening from an actor lane, and skip unseen steps with new ids.\n   The merge would then accept a flow that says something the code does not,\n   which is the one thing its rule exists to refuse.\n\n## Decision Outcome\n\nOption 1. The verify phase of `gen.mjs` and the site's reading of the\nwork-items verifier both take `verifierCatalog`, so a verifier sees one\ncatalog wherever it runs.\n\n`verify-otel` also counts an opening that names its method as the call in:\nan endpoint flow's first step is keyed by the route or operation it answers\nwhether or not it carries the ref. It used to be keyed by the ref when it had\none, which no recording ever matches - `oms`'s openings, whose extractor\nwrites the ref, were never counted as seen.\n\n### Consequences\n\n- The twelve flows keep what their recordings showed: on the example estate\n  `merge-conflict` goes from 12 to none, and `flow-observed-coverage-low`\n  from 66 to 60.\n- `observed.json` says only what the recordings saw on top of what the code\n  declared; the ref of an opening and the responses are derived at read time\n  as for every other flow.\n- A verifier that links evidence to steps (work-items) no longer sees the\n  steps composed into a flow from its callee, only the callee's own flow,\n  which is where those steps' source lines belong.\n","relates":{},"source":"adr/0031-a-verifier-is-handed-the-flows-as-declared-not-as-enriched.md","created":{"commit":"e83eafc36cf396bf3c5f13aac0d5b8e68d301782","author":"Victor Login","date":"2026-09-18T15:16:09+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0032","name":"A gRPC call outside the estate is named by the manifest and described by the copy","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0032","slug":"portolan-0032-a-grpc-call-outside-the-estate-is-named-by-the-manifest-and-described-by-the-copy","number":32,"title":"A gRPC call outside the estate is named by the manifest and described by the copy","status":"accepted","date":"2026-09-18","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA system outside the estate that answers over HTTP already has a place in the\ncatalog: an external, described by the copy of its document vendored beside\nthe adapter that calls it (an `openapi` step with `external`), and joined to\nthe caller by the domain extractor's `externals` line, or, failing that, by\nthe title of the document.\n\nA system that answers over gRPC had none. Auth asks a risk service before it\nissues a session, on purpose and by a decision of its own (auth.0007), and\nvendors a narrowed copy of `risk.v1` to do it. The call was recorded against\nthe package, unresolved, and Problems listed it twice - a call that resolves\nto nothing and a flow step that lands nowhere - beside real defects. It was\ntrue that no service here answers, and wrong that nobody knew who does.\n\n## Decision Drivers\n\n- One convention for an external, whatever the contract's format: the\n  manifest names it, the copy describes it, the merge joins them by id.\n- The catalog claims nothing about a third party beyond the copy.\n- No name is guessed where the tree does not write one.\n\n## Considered Options\n\n- Derive the external from the package, `risk.v1` giving `risk`, the way an\n  HTTP document's title gives its system.\n- Map the package under the proto step's `peers`, since that is where a\n  vendored copy's caller is already described.\n- Keep the caller's `externals`, now for a proto package as well as an api\n  id, and give the `proto` extractor the same `external` options the\n  `openapi` one has.\n\n## Decision Outcome\n\nChosen: `externals` on the caller's domain step, and `external` on a `proto`\nstep over the copy.\n\nThe domain extractor already looked a gRPC client's package up in\n`externals`; what was missing was saying so, and a step that describes the\nfar end. A `proto` step with `external` set reads the protos under `paths` as\nwhat that external answers on, and writes a fragment with the external and\nnothing else - no context, no service, no module, no shared types, because\nthe copy is a narrowed excerpt the caller keeps, not a module anybody\npublishes. The call is then declared against the external, and the merge\nresolves it against the interface the copy declares.\n\nA package is not a name for a system. `risk.v1` could be answered by a vendor\ncalled anything, and `peers` is for services of the estate; neither is read as\nan external without a manifest line.\n\n### Consequences\n\n- Good: a gRPC call out of the estate reads the way an HTTP one does - on an\n  external lane, declared, with the rpc and its messages on the external's\n  page.\n- Good: the proto step keeps one meaning per option; `peers` still names only\n  services of the estate.\n- Bad: two lines in the manifest for one external, one on each side, and\n  nothing checks that they name the same id except the call that fails to\n  resolve when they do not.\n- Neutral: an HTTP client still falls back to the document's title; a gRPC\n  client has no such fallback and stays unresolved until the manifest speaks.\n","relates":{},"source":"adr/0032-a-grpc-call-outside-the-estate-is-named-by-the-manifest-and-described-by-the-copy.md","created":{"commit":"e43d1bbf484e6c982e2ba6947df209c3a90d9b41","author":"Victor Login","date":"2026-09-18T15:16:24+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0033","name":"A rule carries its examples, and check holds it to them","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0033","slug":"portolan-0033-a-rule-carries-its-examples-and-check-holds-it-to-them","number":33,"title":"A rule carries its examples, and check holds it to them","status":"accepted","date":"2026-09-29","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA rule of the estate's own is one CEL condition over one subject\n(portolan.0016, portolan.0017). The editor ran it over the catalog as it was\ntyped and showed the first rows it matched, which answers \"what does it\nmatch today\". It did not answer \"does it say what I meant\", and nothing\nkept the answer once the rule was saved: a later edit that widened a regular\nexpression, or a catalog that stopped carrying the row that motivated the\nrule, changed what the rule meant without anyone being told.\n\nThe rule page now lists every row of the subject, matched or not, and shows\nfor an opened row which field decided it. That is the moment an author knows\nthe rule is right about a row - and the moment to write that down.\n\n## Decision Drivers\n\n- The claim \"this row should match, that one should not\" belongs to the\n  rule, next to its condition, in the file the rule lives in.\n- The page and `check` must agree about an example, so they run the same\n  function.\n- portolan.json stays readable: an example must not copy a whole row.\n- A shipped rule is not the estate's to change.\n\n## Considered Options\n\n1. **Examples on the rule's manifest entry.** `problemRules[].examples` is a\n   list of `{ name, expect: row | none, row, estate? }`. `row` holds only the\n   fields the condition reads, plus the id; every other field is its zero\n   value. `estate` holds the estate lists the condition reads, when it reads\n   any. The manifest check runs each example after the expressions\n   type-check and fails, naming the example, when the rule disagrees.\n2. **Examples as files beside the manifest.** Tests in their own files keep\n   the manifest short, but split a rule across two places and need a loader,\n   a naming convention and a second write path from the page.\n3. **Snapshot the rule's matches.** Store the ids a rule matched when it was\n   saved and report any change. It catches every drift and explains none:\n   the catalog changes daily, and a snapshot cannot tell a wrong rule from a\n   new service.\n\n## Decision Outcome\n\nOption 1.\n\nAn example is kept from the rule page - open a row, keep it as an example\nthat should or should not match - or written by hand. `exampleMatches` in\n`problem-rules-cel.mjs` fills the missing fields, checks the written ones\nagainst the subject's schema, and runs the condition; the page and\n`problemRuleProblems` both call it. A shipped rule's entry may not carry\nexamples, like any other field of a rule's body.\n\n## Consequences\n\n- Save is refused while an example disagrees with the rule: the server\n  writes through the same check. The page says which example and offers to\n  remove it.\n- An example is evaluated with zero values for the fields it leaves out, so\n  a condition that reads a field the example did not keep sees `\"\"`, `0`,\n  `false` or `[]`. Keeping an example again after the condition starts\n  reading a new field is the author's step.\n- A field removed from a subject's projection now also breaks the examples\n  that name it, in the same way it breaks the expressions (portolan.0017).\n- An example does not depend on the catalog: it is about the rule, not the\n  estate, and gives the same answer on the page, in `check` and in CI.\n","relates":{},"source":"adr/0033-a-rule-carries-its-examples-and-check-holds-it-to-them.md","created":{"commit":"9f80c5670a77db86bd25cb0893e43f0204263662","author":"Victor Login","date":"2026-09-30T00:07:59+07:00"}}},{"kind":"adr","kindLabel":"decision","id":"portolan.0034","name":"Each catalog profile is its own LikeC4 project","summary":"Context and Problem Statement","badges":["accepted"],"record":{"id":"portolan.0034","slug":"portolan-0034-each-catalog-profile-is-its-own-likec4-project","number":34,"title":"Each catalog profile is its own LikeC4 project","status":"accepted","date":"2026-09-30","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA manifest names catalog profiles, and the site shows one of them at a time:\nthe page loads the active profile's sources when it starts, and every page\nafter that is about that estate alone. The LikeC4 model was not: it was one\nmodel over every source the site staged, with a pair of views per profile to\nnarrow it.\n\nTwo estates may use the same words. The example estate and the modular\nmonolith each have a `payments` context; the example estate and CodelyTV's\neach have a `bus`; several have a `client`. One model merged each pair into\none element, so the Payments context page of either estate drew the other's\nservices beside its own, and the one `bus` travelled on NATS and RabbitMQ at\nonce and could name neither.\n\n## Decision Drivers\n\n- A picture shows the estate the page is about, and nothing of another.\n- Catalog ids stay what the catalog says: the app and the generator derive\n  every LikeC4 name from them without a table of renames (`src/likec4/ids.ts`).\n- The committed `likec4/` covers what the repository's own site can load, as\n  it did before.\n\n## Considered Options\n\n1. **A LikeC4 project per profile.** The generator writes\n   `likec4/\u003cprofile\u003e/` with a `likec4.config.json` naming it, from that\n   profile's own merged catalog; `likec4 gen react --project` writes\n   `src/likec4/generated/\u003cprofile\u003e.jsx`; the page loads the active profile's\n   bundle.\n2. **One model, colliding ids renamed.** The first profile keeps an id, later\n   ones get a prefix. Every field of a catalog that names an id would have to\n   be rewritten before the merge, and the app would have to find out which ids\n   were renamed for the profile it shows.\n3. **Keep the one model, rename brokers only.** Cheap, and leaves `payments`\n   and `client` merged.\n\n## Decision Outcome\n\nOption 1.\n\nA profile is drawn when every source it names is also matched by the\nmanifest's top-level `sources` - the profiles the site can load. In this\nrepository those are `portolan` and `example`; `portolan dev` stages every\nprofile's sources at the top level, so there every profile is drawn. A\nmanifest without profiles keeps its single unnamed model and its `default`\nbundle.\n\n## Consequences\n\n- `likec4/` holds one directory per drawn profile; nothing sits at its root.\n  `npm run likec4:validate` validates each project by name, since LikeC4 asks\n  which project to lay out in a workspace of several.\n- `src/likec4/bundle.ts` is the one place the page gets its model from. It\n  loads `generated/\u003cprofile\u003e.jsx` with a top-level await, falling back to the\n  unnamed bundle, so a page downloads one estate's diagrams, not every one.\n- Each project still carries its profile's `landscape_\u003cprofile\u003e` and\n  `containers_\u003cprofile\u003e` views beside `landscape` and `containers`, so the\n  view ids the app asks for are unchanged.\n- A view built from a catalog other than a profile's - a branch draft's flow\n  (portolan.0019) - is still laid out as one model from the catalog it is\n  given.\n","relates":{},"source":"adr/0034-each-catalog-profile-is-its-own-likec4-project.md","created":{"commit":"3a0e422a6b68a24811d2b4b0464d18cf6dc00b92","author":"Victor Login","date":"2026-09-30T15:25:15+07:00"}}},{"kind":"spec","kindLabel":"change spec","id":"automate-sdd-workflow","name":"Automate sdd workflow","badges":["openspec","complete"],"record":{"id":"automate-sdd-workflow","slug":"automate-sdd-workflow","title":"Automate sdd workflow","format":"openspec","lifecycle":"complete","source":"openspec/changes/automate-sdd-workflow/proposal.md","artifacts":[{"kind":"proposal","path":"openspec/changes/automate-sdd-workflow/proposal.md","body":"# Proposal\n\n## Why\n\nPortolan can already read normalized OpenSpec changes, but users still have to connect the extractor manually, and a specification remains an isolated screen without history, automatically derived impact, or shared navigation. SDD should become useful as soon as a standard directory appears in a repository, without `portolan.yaml`, hand-authored catalog IDs, or additional configuration.\n\n## What Changes\n\n- Detect supported SDD layouts automatically and connect the built-in extractor with safe defaults.\n- Show the Git history of a change and its artifacts without writing provenance into the generated fragment.\n- Identify affected components from changed paths and known repository and service path boundaries.\n- Turn only exact textual references—catalog IDs, file paths, `path:line`, URLs, and known identifiers—into verifiable links.\n- Build a deterministic activity feed from Git, specification diffs, checklists, and automatically derived impact.\n- Include changes, requirements, and scenarios in global search, the command palette, breadcrumbs, and backlinks.\n\n## Capabilities\n\n### New Capabilities\n\n- `automatic-sdd-workflow`: zero-config discovery, history, exact links, path impact, activity feed, search and navigation for supported SDD artifacts.\n\n### Modified Capabilities\n\nNone. Existing extractor, catalog merge, architecture evidence, and branch draft semantics are extended without changing their current contracts.\n\n## Impact\n\n- **Local discovery/setup:** a standard `openspec/` layout becomes a high-confidence detection and creates an SDD extraction step automatically.\n- **Catalog host:** Git history and branch diff remain external enrichment so identical source files continue to produce byte-identical fragments.\n- **Catalog model:** SDD links, path impact, and activity are derived facts; author lifecycle and implementation evidence remain separate dimensions.\n- **UI:** `/specs`, global search, the command palette, breadcrumbs, Changes, and backlinks gain SDD entries.\n- **Safety:** free-form text is not used for semantic matching. Ambiguous names remain plain text or unresolved exact references.\n- **Out of scope:** editing OpenSpec from Portolan, changing task checkboxes automatically, generating requirements with an LLM, Spec Kit or Kiro adapters, and claiming runtime conformance from path co-change alone.\n"},{"kind":"design","path":"openspec/changes/automate-sdd-workflow/design.md","body":"# Design\n\n## Context\n\nSDD in Portolan is a read-only control plane. Source artifacts belong to OpenSpec; Portolan extracts them, joins them to known facts, and exposes the provenance of every relationship. Zero-config means following standard conventions, not applying hidden heuristics.\n\n## Goals\n\n- Provide a useful SDD experience as soon as `openspec/` is added to a Git repository.\n- Reuse the existing history, branch draft, catalog index, source-link, and command-palette mechanisms.\n- Preserve strict boundaries between intent, related change, declared architecture, test evidence, and runtime observation.\n- Make every automatically derived conclusion reproducible and explainable.\n\n## Non-goals\n\n- Do not infer conformance from task completion, co-commit history, or similar text.\n- Do not guess an architecture entity from its display name.\n- Do not write Git metadata into a source fragment.\n- Do not modify OpenSpec files, task state, or archive layout.\n\n## Decisions\n\n### 1. Discovery follows a standard layout\n\nLocal discovery considers SDD present only when `openspec/changes/\u003cchange\u003e/.openspec.yaml` exists. The detection is selected automatically and creates an `sdd` step with the project root as input; the `root` option is omitted when the standard name is used. An empty directory or a Markdown file with a similar name does not count as SDD.\n\nCLI generation outside setup also gains a convention-based implicit step when the manifest does not already contain SDD output for the same project root. An explicit step always takes precedence and prevents duplicate extraction.\n\n### 2. Git history is derived beside the fragment\n\nThe extractor remains a deterministic tree → fragment function. The host reads history for the source paths of the change, proposal, design, requirements, and tasks, then provides the UI with derived records: first commit, latest commit, author, date, and current uncommitted state. Shallow or absent history produces an explicit unavailable state, not invented dates.\n\n### 3. Path impact is ownership, not conformance\n\nFor the selected branch/range the host obtains changed paths. A path affects a service only when it is inside that service's repository and declared `path`; the longest matching service path wins. Contract, deployment and documentation paths use their existing catalog owners. Shared or ambiguous paths remain repository-level impact.\n\nThe UI labels this relation `changed with`, never `implements`. It can support prioritization and navigation but cannot satisfy a requirement.\n\n### 4. Text links require exact syntax\n\nThe linker recognizes:\n\n- absolute web URLs;\n- repository-relative file paths, optionally with `:line`;\n- exact catalog IDs resolved through the catalog index;\n- exact route-safe slugs only when the entity kind is stated by the source syntax;\n- requirement/task identifiers defined inside the same change.\n\nUnresolved exact references are retained and surfaced as problems. Ordinary prose and display-name similarity are never converted into links.\n\n### 5. One derived activity model feeds every presentation\n\nActivity events are normalized from Git commits, spec diffs, lifecycle transitions, task state transitions and path impact. Each event carries stable key, timestamp when known, source, kind and links. Stable ordering is timestamp descending, then kind and key. The `/specs/:id` feed, `/changes`, Markdown output and summaries consume the same model.\n\n### 6. Search indexes intent as intent\n\nPalette/search entries are added for change, requirement and scenario. Results retain their kind and route to the exact change section. Search ranking may use title, ID and exact source text, but must not manufacture relationships. Breadcrumbs and backlinks use the same stable anchors.\n\n## Data flow\n\n1. Discovery identifies a standard SDD root.\n2. `extract-sdd` emits normalized author intent.\n3. Merge and validation establish unique change, requirement and task identities.\n4. Host-side Git enrichment derives history, branch diff and changed paths.\n5. Exact-link resolution and ownership matching join intent to known catalog facts.\n6. Activity, search and navigation project those derived facts without mutating the source model.\n\n## Failure modes\n\n- Missing Git history: specifications remain readable; history states why it is unavailable.\n- Duplicate explicit/implicit step: the explicit step is used once.\n- Ambiguous service ownership: impact stays at repository level and names the ambiguity.\n- Broken exact reference: source text remains visible and Problems links back to its location.\n- Removed requirement: branch diff retains the removed side without adding it to the current search index.\n\n## Rollout\n\nImplement vertically: discovery first, then history/impact, exact links, shared activity, and finally search/navigation. Each slice is tested against this repository's own OpenSpec change and the external Gavel fixture without modifying Gavel.\n\n## Verification and evidence boundaries\n\n- Proposal, requirement, scenario, lifecycle, and task state are **source intent** extracted from authored OpenSpec files. A completed task does not prove implementation or conformance.\n- Git history, branch diffs, and `changed with` path ownership are **derived impact**. They explain when and where related changes occurred, but do not prove that a requirement is satisfied.\n- Focused extractor, discovery, history, diff, link-resolution, search, UI, type, schema, generation, and rendered-preview checks are **independent evidence** for the implemented Portolan behavior.\n- The external Gavel checkout is a read-only fixture. Integrated verification compares both its HEAD and complete working-tree status before and after Portolan checks; neither value may change.\n"},{"kind":"tasks","path":"openspec/changes/automate-sdd-workflow/tasks.md","body":"# Tasks\n\n## 1. Zero-config SDD discovery\n\n- [x] 1.1 Add high-confidence OpenSpec detection to local project discovery using `.openspec.yaml` markers and cover standard, empty and malformed layouts.\n- [x] 1.2 Add an automatically selected `sdd` extraction plan with project-root input and o
