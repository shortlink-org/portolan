venance must stay exact: when a fact last changed, and in which commit.\n- A plugin must know no clock and no repository (kept from portolan.0002).\n- `gen --check` must say why an artifact is out of date.\n\n## Considered Options\n\n1. **Provenance is the history's.** Nothing is written into a fragment;\n   whoever reads the catalog asks git when each source file last changed.\n2. **Keep the stamp in the fragment, but keep the old one while the content\n   stands.**\n3. **Stamp from a hash of the input tree** instead of from a commit.\n4. **Record the commit of the last generation in one file** and diff the\n   inputs against it.\n\n## Decision Outcome\n\nChosen option: **provenance is the history's**.\n\nA fragment is content and nothing else. The request carries no `commit` and\nno `generatedAt`; a plugin that used to copy them writes nothing in their\nplace. When the catalog is read - by `gen`, by the LikeC4 generator, by the\narchitecture diff, by the site as Vite builds it - the host asks the history\nwhen each source file last changed (`scripts/history.mjs`, one `git log` per\ncheckout, cached for the process) and hands that to the merge as the source's\nstamp. A file with uncommitted changes is `uncommitted` and dated by its\nmtime; a file outside any repository is the same. A generated page carries\nonly the sentence that says it is generated; when it was generated, and from\nwhat, is the page's own history.\n\n`gen --check` explains drift with the same history. The commit that last\ntouched a step's output is when the output was last generated, and `git diff`\nfrom there over the step's inputs - its root and the manifest, less the\noutput directories inside the root - lists what moved. When nothing did, the\nplugin did. Beside that, every file that differs names the first path or line\nwhere it does.\n\n| | same sources, same bytes | fresh = incremental | says when | needs git to read |\n|---|---|---|---|---|\n| the history's | yes | yes | the commit the change landed in | yes |\n| stamp kept while content stands | yes | no | the parent, or a second commit | no |\n| hash of the input tree | yes | yes | never | no |\n| recorded last-generation commit | yes | no | the parent | no |\n\nOption 2 makes a stamp that depends on what was on disk before: a fresh\nregeneration and an incremental one disagree, and neither names its own\ncommit. Option 3 dates nothing, and at the granularity of a root it is the\ncommit again under another name. Option 4 records what the history already\nholds - the commit that last touched the output IS the last generation - and\na commit recorded before the commit it lands in is the parent, the same\noff-by-one portolan.0002 had.\n\n### Consequences\n\n- Good: `npm run gen` after unrelated commits is a no-op. A regenerated\n  catalog lands in the same commit as the change that moved it, and\n  `--check` is green on that commit.\n- Good: two extractors on one root are dated separately, each by its own\n  fragment's history.\n- Good: `PORTOLAN_GENERATED_AT`, the vendored-copy stamp and the refusal of\n  shallow clones leave the host; `stampFor` and `vendor-lock.mjs` are gone.\n- Bad: reading provenance needs git where the catalog is read. The site gets\n  it from a Vite plugin at build time. A shallow checkout dates everything by\n  the one commit it has and says so once; the Pages workflow fetches the full\n  history.\n- Bad: a fragment from before this decision still carries a stamp. The merge\n  takes the history's when it has one and the file's otherwise, so a copy\n  vendored from an older portolan is dated by the fetch that brought it in -\n  which is what freshness means to the estate that vendored it; the pin says\n  which upstream commit that was.\n- Neutral: the dev server re-reads provenance when a source changes, not when\n  a commit is made; a commit shows after a restart.\n","supersedes":["portolan.0002"],"relates":{},"source":"adr/0010-provenance-is-read-from-the-history-never-written-into-a-fragment.md","created":{"commit":"f2da58d8ef99748d6aa1ba0fcb4eb443509a1dcd","author":"Victor Login","date":"2026-09-10T21:47:36+07:00"}},{"id":"portolan.0011","slug":"portolan-0011-only-names-are-read-from-what-deploys-a-service","number":11,"title":"Only names are read from what deploys a service","status":"accepted","date":"2026-09-11","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nThe catalog knows what a service provides and what it consumes, and the merge\njoins the two by route: a client's `POST /foo` meets the one service whose\nOpenAPI or framework fragment declares it. Where two services declare the\nsame route, or where the client's code names its destination only as\n`$LEDGER_URL`, the join has nothing to go on and the call stays unresolved.\n\nWhat the variable holds is not in the code. It is in what deploys the\nservice: the Deployment's `env`, the ConfigMap it reads, and the Service,\nIngress and HTTPRoute objects that give the far end a name. Those objects\nexist in two places - as manifests in a repository, and as what a cluster\nis running now - and both are wanted: the manifests because they are in git\nand reproducible, the cluster because it is the truth about what runs, and\nbecause for an estate deployed by Helm or Argo the rendered objects are in\nno repository at all.\n\nBoth places are also where the passwords are. A reader of either has to say\nwhat of what it reads may reach a fragment that is committed, rendered and\npublished.\n\n## Decision Drivers\n\n- The join needs the one fact a route cannot carry: which of the estate's\n  services answers on the name the caller is configured with.\n- Regenerating from the same sources must change no byte (portolan.0010);\n  a run that has lost the cluster must not lose the catalog.\n- A plugin that needs a socket or a binary runs inside the host\n  (portolan.0008); everything else runs as wasm over the tree.\n- No value from a manifest or a cluster - a password, a token, a DSN, a\n  flag, a level, a variable's name - may reach a fragment, a warning or a\n  page. The build report is committed too.\n- Internal DNS names may: a name is topology, and the catalog is a map.\n\n## Considered Options\n\n1. **Read names only, from both places.** A wasm extractor over the\n   manifests in a repository, and a host plugin over `kubectl`; both reduce\n   what they read to the names a service answers on and the in-cluster\n   names its workload dials, and write nothing else.\n2. **Keep the configuration.** Put a service's environment - variable and\n   value - into the catalog, and let the merge resolve from it.\n3. **Snapshot the cluster raw.** Commit what `kubectl get -o json` said,\n   as fetch-git commits a tree, and read the snapshot as manifests.\n4. **Manifests only.** Leave the cluster alone and require every estate to\n   keep rendered manifests in git.\n\n## Decision Outcome\n\nChosen option: **read names only, from both places.**\n\nTwo plugins put the same two lists on a service. `hosts` are the names it\nanswers on: a Kubernetes Service's name in its short, namespaced, `svc` and\nfully qualified forms, and the hosts of the Ingress or HTTPRoute in front of\nit. `dials` are the in-cluster names its workload is configured to reach,\nread from its containers' `env` and the ConfigMaps they reference and\nreduced to the host alone. `extract-k8s` reads them from the YAML under a\nrepository, one service per step, as one more entry of `portolan-go.wasm`.\n`fetch-k8s` reads them from a live cluster through `kubectl`, every\nworkload of the namespaces named in one fragment, placed into contexts and\nservices by the recommended labels `app.kubernetes.io/part-of` and\n`app.kubernetes.io/name` - or by whichever labels the manifest names\ninstead, with a namespace-to-context map for workloads that carry none.\n\nThe merge resolves an ambiguous route to the one provider that answers on\nthe host the call names, or on a host the caller dials, and the evidence\nsays `kubernetes-host` as the basis. A host only decides between providers\nof a route; it never conjures one.\n\nWhat keeps values out is a rule of shape, not a list of words, and it is\nthe same rule in both readers, held together by one table of cases in\ntheir tests. A `Secret` is never asked of the cluster and never decoded\nfrom a file - nor a `SealedSecret`, an `ExternalSecret`, or any document\ncarrying `stringData`; a `secretKeyRef` or `secretRef` is not followed.\nEvery other value is looked at once, in memory, for one question - does it\nname a host inside the cluster - and what survives is the hostname: a URL\ngives up its scheme, port, path, query and the user and password in front\nof the host, and a bare `host[:port]` gives up the port. What is left\nqualifies only when the cluster resolves it: a form one of the Services\nread answers to, or `\u003cname\u003e.\u003cnamespace\u003e.svc`, the one shape no name\noutside a cluster has. Warnings name namespaces, kinds, files and\ndirectories, never values; what `kubectl` prints on stderr reaches the\nterminal and not the build report.\n\n`fetch-k8s` follows fetch-git's rules for the far end: offline, or when\nthe cluster cannot be reached, the fragment committed in the repository is\nused unchanged with a warning; with no committed copy that is an error,\nnever a short answer. Nothing but that fragment is written to disk.\n\n### Consequences\n\nThe two readers agree on what a host is, so a `dials` entry from a\nrepository's manifests and a `hosts` entry from the cluster meet in the\nmerge like any two fragments. An estate keeps whichever source it has, or\nboth: the manifests say what should run, the cluster says what does, and\na page that shows both is the diff.\n\nThe catalog gains two list fields on a service and one basis on the\nevidence, and no entity. An environment, a cluster, an Ingress as a thing\nof its own: each is a page nobody has asked for yet, and a decision to be\nmade when one does.\n\nOption 2 would put every password one misplaced `value` away from a\npublished page and ask the reader to trust a list of forbidden words.\nOption 3 puts the same values on disk under a different name; a committed\nsnapshot of ConfigMaps is configuration in the repository, whatever it is\ncalled. Option 4 answers the estate that has no manifests in git with\nnothing, and even for one that has, what runs is a fact worth having.\n","relates":{},"source":"adr/0011-only-names-are-read-from-what-deploys-a-service.md","created":{"commit":"7d85c99c8f1e785df916ea46872dad5b1d0eed10","author":"Victor Login","date":"2026-09-11T14:11:48+07:00"}},{"id":"portolan.0012","slug":"portolan-0012-where-a-service-runs-is-read-from-the-deployer-as-a-snapshot","number":12,"title":"Where a service runs is read from the deployer, as a snapshot","status":"accepted","date":"2026-09-11","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nportolan.0011 reads the names a service answers on and dials, from the\nmanifests in a repository and from a live cluster, and keeps nothing else;\nit leaves an environment and a cluster as things of their own to a decision\nmade when a page asks for them. This is that page. Neither a tree nor a\ncluster says which revision of which repository stands in which cluster and\nnamespace today, under what name, running which images: a tree says what\nshould run, a cluster shows objects with no revision on them, and only the\nthing that deploys knows the two together. The answer is the state of a\ncontrol plane.\n\nThe question is asked on a service page: is this in production yet, at\nwhich commit, and where do I look. Answering it means reading Argo CD,\nwhich needs a socket and a token, and means keeping something that has no\ncommit of its own to pin to.\n\n## Decision Drivers\n\n- The fact is not in a tree, so no extractor can read it (portolan.0006);\n  reading it needs a socket and a credential, which are the host's\n  (portolan.0008).\n- Regenerating from the same sources must change no byte (portolan.0010).\n  A build must not read a clock, and CI must not need a token or a control\n  plane that is up.\n- Nothing that moves without a deploy may reach a page. A page that said\n  \"healthy\" and was not regenerated since is a page that lies.\n- No value from the deployer - a Helm parameter, a plugin env, a\n  credential - may reach a fragment, a warning or a page, for the reason\n  portolan.0011 gives.\n- The fetcher reads a control plane and knows no service; which service an\n  Application is has to be decided where the whole estate is known.\n\n## Considered Options\n\n1. **A host plugin reads the Argo CD API into a snapshot** committed\n   beside a lock, replayed offline, reduced to what a deploy changes.\n2. **An extractor reads the Application manifests** from the GitOps\n   repository, fetched with `fetch-git` like any other tree.\n3. **Keep the status too**: health, sync state, the last operation, so the\n   page shows what the deployer shows.\n4. **The fetcher writes the deployment onto the service**, joining by name\n   or label at fetch time.\n\n## Decision Outcome\n\nChosen option: **a host plugin reads the API into a snapshot.**\n\n`fetch-argocd` is declared as `{ \"name\": \"argocd\", \"host\": \"fetch-argocd\" }`\nand runs like `fetch-bsr`: one call to `/api/v1/applications`, narrowed by\nproject and selector, with `ARGOCD_AUTH_TOKEN` as the argocd CLI reads it\nand nothing in the manifest. It names two files. `argocd.apps.json` is a\ncatalog fragment holding `deployments` and nothing else; `argocd.lock.json`\nholds the server, the applications and the fragment's digest. Offline and\nin CI the committed snapshot is replayed against the lock and the file list\nis identical; a fetch that fails falls back to it with a warning; a fetch\nthat fails with no snapshot is an error, never a short file list.\n\nThere is no pin, because there is nothing to pin to: an Application has no\nimmutable commit the way a module or a repository has. The snapshot is the\nfact, and it moves when a deploy moves it. An online run after a deploy\nchanges the committed snapshot, and that diff - what went where - is the\nreview worth having.\n\nWhat is kept is what a deploy changes: the environment, the cluster, the\nnamespace, the repository and directory the manifests come from, what the\nApplication tracks and what it resolved to, the tool, the images, and the\nlink to the Application. What is not kept is what moves without one: health,\nsync state, the time of the last operation. The link goes to where they\nlive. No parameter and no value is read at all; the source's `helm` and\n`plugin` blocks are not looked into.\n\n`Deployment` is a list on the catalog, beside `repos`, and the join is made\nin the index, two ways. When the Application carries the recommended\nlabels - `app.kubernetes.io/part-of` and `app.kubernetes.io/name`, the same\nones fetch-k8s reads off a workload, or whichever the manifest names under\n`labels` - they decide: the fetcher writes `\u003ccontext\u003e.\u003cservice\u003e` as\n`Deployment.service` and nothing else is looked at. A GitOps repository's\nApplication points at an overlay in that repository, not at the service's\ndirectory, so the path alone cannot place it, and an ApplicationSet stamps\nthe labels on every Application it makes (`examples/gitops`). Without the\nlabels, the path: an Application is a service's when it deploys from the\nservice's repository, inside the service's directory. An Application that\nmatches neither way is not an error; a control plane manages more than the\nestate's services, and the Problems page lists it.\n\n### Consequences\n\nThe service page gains \"Where it runs\": one row per environment the\nsnapshot places it in, with the commit as a link to the forge, the images,\nand the Application. The catalog gains one list and one index; the Go\nmirror gains the struct, held by the round-trip test over the committed\nsnapshot.\n\nThe snapshot is only as current as the last online run, and says so by\nbeing a committed file with a history. An estate that wants it current\nruns `gen` on a schedule and reviews the diff; an estate that does not can\nleave the step out and lose nothing else.\n\nThe environment is the application's label, `env` unless the manifest\nnames another, and the cluster when there is none: Argo CD has no\nenvironment of its own, and this is the fact closest to one.\n\nOption 2 answers a different question: what the GitOps repository says\nshould be deployed, which is a tree and could be read by an extractor -\nbut not what is, nor at which revision, nor with which images, and an\nApplicationSet with a cluster generator is not readable without the\ncluster. It remains open for an estate whose Argo CD nobody may call.\nOption 3 would put a fact that changes every hour into a file regenerated\nonce a day. Option 4 would have the fetcher guess a service from a name,\nin the one place the estate is not known.\n","relates":{},"source":"adr/0012-where-a-service-runs-is-read-from-the-deployer-as-a-snapshot.md","created":{"commit":"4f09c61a76df01d0b0a98f142c2d827f0cb5c223","author":"Victor Login","date":"2026-09-11T14:28:38+07:00"},"revised":{"commit":"cec4f2018e338fb0c3c840b834c318d675285c86","author":"Victor Login","date":"2026-09-11T15:21:21+07:00"}},{"id":"portolan.0013","slug":"portolan-0013-what-should-run-is-read-from-the-gitops-tree-and-laid-under-what-does","number":13,"title":"What should run is read from the GitOps tree, and laid under what does","status":"accepted","date":"2026-09-11","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nportolan.0012 reads where a service runs off the deployer, as a snapshot,\nand left the other source open: the GitOps tree that tells the deployer\nwhat to run. The two answer different questions. The tree says what should\nbe deployed - which directory, tracking which revision, into which cluster\nand namespace, pinning which image - and says it in a commit, reproducibly,\nwith no token. The deployer says what is - the revision synced, the images\nrunning - and says it over a socket. An estate that keeps both wants both,\nand wants the difference most of all: a tag bumped in the tree that the\ncluster does not run yet is the fact a reader opens the page for.\n\nReading the tree is not reading a list of Applications. Since\nApplicationSets, the Applications are made from generators, and what a\ntree holds is the recipe: a matrix of the environments under `envs/*` and\nthe services under each. Some generators can be expanded from the tree\nalone; some ask a cluster, a forge or a plugin.\n\n## Decision Drivers\n\n- The tree is a tree: reading it is an extractor's, as wasm over the\n  workspace (portolan.0006), and needs no token.\n- Regenerating from the same sources must change no byte (portolan.0010).\n- One Application must be one row a reader sees, however many sources\n  spoke for it; the difference between them must not be lost in the fold.\n- A generator a tree cannot expand must be a warning naming it, never a\n  guess at what the controller would have made.\n- The join of a deployment to a service must be the one portolan.0012\n  settled on: the labels when the Application carries them, the path\n  otherwise.\n\n## Considered Options\n\n1. **An extractor over the tree, and a fold in the merge**: `extract-argocd`\n   expands what it can and writes rows with basis `manifest`; `fetch-argocd`\n   writes rows with basis `api`; the merge lays a manifest row under the\n   api row of the same id and keeps their differences as drift.\n2. **Two rows per Application**, one from each source, shown side by side.\n3. **The extractor only**, dropping the fetcher: the tree is enough.\n4. **Expand every generator** by asking Argo CD to render the\n   ApplicationSet, as the fetcher already talks to it.\n\n## Decision Outcome\n\nChosen option: **an extractor over the tree, and a fold in the merge.**\n\n`extract-argocd` runs as one more entry of `portolan-go.wasm` over a\nGitOps tree. It reads every Application and ApplicationSet under the paths\nnamed and expands the generators a tree can answer: `list` whole; `git`\ndirectories and files by walking the same repository - repository-relative\npaths from the workspace root, a `**` walked as one level and said so; and\n`matrix` over those, the second generator rendered with each row of the\nfirst, which is what lets `envs/{{.env}}/shop/*` follow `envs/*/cluster.yaml`.\nThe template is rendered the way the ApplicationSet declared it: Go\n`text/template` under `goTemplate`, else `{{a.b}}` over the flattened row.\nA `clusters`, `pullRequest`, `scmProvider`, `merge` or `plugin` generator,\nand a `git` generator pointing at another repository, is a warning naming\nthe ApplicationSet and no rows.\n\nEach Application, declared or rendered, is reduced the way the fetcher\nreduces the API's answer, minus what a tree cannot know - no revision, no\nrunning image, no link - plus what a tree can know first: when the source\npath holds a `kustomization.yaml`, the tool is kustomize and the images the\noverlay pins are the declared images. The row carries basis `manifest`.\n\n`fetch-argocd` now marks its rows basis `api`. The merge holds one row per\nid. A manifest row and an api row fold into one: the api row's shape, since\nit is what runs; the manifest filling a service the labels name or an image\nthe overlay pins when nothing runs yet; and the fields the two disagree on -\nproject, cluster, namespace, path, tracked revision, pinned images not\nrunning - kept as the tree's word under `drift`, with basis `both`. Two\nrows of one basis for one id are a collision and are reported as one. A\nrow with drift is a `deployment-drift` problem on the service's row, and\nthe service page wears a `drift` chip that says the difference in words; a\nrow only the tree spoke for wears `declared`.\n\n### Consequences\n\nAn estate that keeps a GitOps tree reads its deployments in CI, offline,\nwith no token, and gains the snapshot's revisions and images whenever a run\nwith a token refreshes it. The service page shows one row per environment\neither way. The Problems page shows where the tree and the deployer have\nparted, which is the one place a reader would otherwise open two tools to\nfind.\n\nThe catalog gains two fields on a deployment, one type and one problem\nkind. The Go mirror follows. Nothing is added to a service.\n\nOption 2 shows the same Application twice on every page for the ordinary\ncase, agreement, to make the rare case, disagreement, visible; a fold with\ndrift makes disagreement visible and agreement quiet. Option 3 loses what\nruns, which is the question portolan.0012 was answering. Option 4 needs\nthe token and the socket for the part of the work that needs neither, and\nanswers nothing the tree cannot for the generators a tree can expand; for\nthe ones it cannot, it is the case for a later need, not for making the\ncommon case need a control plane.\n","relates":{},"source":"adr/0013-what-should-run-is-read-from-the-gitops-tree-and-laid-under-what-does.md","created":{"commit":"26ef3fe9f8832f781f6c18164a0e8945d9bd95ab","author":"Victor Login","date":"2026-09-11T16:44:18+07:00"}},{"id":"portolan.0014","slug":"portolan-0014-a-recording-is-kept-beside-the-code-and-lays-what-it-showed-over-the-flow","number":14,"title":"A recording is kept beside the code, and lays what it showed over the flow","status":"accepted","date":"2026-09-12","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\n`verify-otel` read a recording of traces and said which declared hops had\nbeen seen running. That was all it said. A hop the recording showed that\nthe code did not declare was dropped; two recordings of one endpoint that\ndiffered in the middle - a happy path and a refusal - became two observed\nflows with one name each; and nothing of what the spans carried reached\nthe page, so a reader who wanted to know what a real run of the flow looked\nlike had to open the recording.\n\nThe recording itself lived wherever somebody had put it and was named in\nthe manifest by hand. Adding one meant a file, a glob and a run, on a\nmachine with the repository checked out. The page, which is where a reader\nholds the flow and the recording side by side, could not take one.\n\n## Decision Drivers\n\n- A recording is evidence, and evidence must survive regeneration: the\n  catalog is rebuilt from files by anyone, on any machine (portolan.0010).\n- What a recording showed and the code did not declare is a fact about the\n  system, not noise; a reader should see it on the flow, marked as such.\n- Two recordings of one flow are one flow, more fully known.\n- The catalog is published. A span attribute is somebody's data until shown\n  otherwise.\n- The page may propose; only a reviewed run writes (the preview-then-write\n  rule every local write already follows).\n\n## Considered Options\n\n1. **A recording is a file beside the project; the verifier lays it over the\n   flow and keeps it as an example.** Uploaded from the page or copied by\n   hand, it lands under `\u003cproject root\u003e/telemetry/recordings/`, and the\n   project's `otel` verify step reads that directory. The verifier counts,\n   per declared step, the recordings that showed it; puts an rpc or an event\n   the code does not declare into the flow after the declared step it\n   followed, as a step whose id the code never gave and whose `seen` says\n   why it is there; lays every observed recording that opens the same way\n   over one observed flow; and keeps up to a handful of recordings as\n   `examples` of the flow, each naming the steps it showed with the span's\n   name, its length and an allowlist of attributes.\n2. **A recording is held by the dev server**, in `.portolan/`, and the page\n   shows it live. Nothing to commit, nothing to review - and nothing the\n   next regeneration knows about. A flow verified once, on one machine.\n3. **A recording is an example only.** Kept, shown, never laid over the\n   flow. The reader sees a run and a flow that disagree and is left to\n   reconcile them by eye.\n4. **Carry every attribute.** The most useful example is the fullest one -\n   and the fullest one carries `db.query.text` with an email in it into a\n   published catalog. Once.\n\n## Decision Outcome\n\nOption 1.\n\nThe recording is a file in the repository because that is the only place\nregeneration can find it. The page takes an upload, runs the generator over\na copy of the workspace with the file in place, and shows what changed -\nwhich flows the recording showed, what it raised and added, which names the\nverifier could not place - before anything is written. Keeping it writes\nthe file, widens or adds the project's verify step, records the mappings\nthe reader gave for unplaced names, and regenerates through the same\nwrite run every other local change goes through.\n\nWhat the verifier writes is accepted by the merge under the one rule it\nalready had for a second declaration of a flow, widened: the second may\nraise a status, and it may add a step that carries `seen` and an id the\nfirst does not have, a lane after the declared ones, and examples. It may\nnot move or remove anything declared. A store call is never added: a\n`SELECT` ran, which is not the claim that `ByEmail` was called, and the\ncode's word on which repository method it was is the better one. A\nconsumer met inside a trace opens a flow of its own and belongs there.\n\nAn example carries a closed allowlist of attributes - routes, verbs, status\ncodes, operation and service names, destinations, the host a call went to.\nThe list is in `plugins/verify-otel/examples.go` with the argument for each\nentry, and an attribute not on it is not carried, whatever it is called.\nQuery text, headers, full URLs and paths with ids in them are not on it and\nare not going to be. A flow keeps five examples unless the step's options\nsay otherwise: the recordings that show the most of it, earliest first, so\nthat a day of traffic does not become the page.\n\n### Consequences\n\n- A declared flow can now carry steps no source file declares. They are\n  marked - `seen` on the step, `seen\u003cn\u003e` as the id, a note saying in how\n  many recordings - and the page says so next to them.\n- `Step.seen` and `Flow.examples` are in the model, the Go mirror and the\n  validator: an example must name steps the flow has, once each.\n- An observed flow is keyed by how it opens, not by its whole shape. Two\n  observed flows that used to differ only in the middle are one flow now,\n  and their old ids are gone.\n- A recording uploaded from the page is committed like any other source.\n  The reviewer of that commit sees a `.jsonl` under `telemetry/recordings/`\n  and a widened verify step; the data the fragment carries is bounded by\n  the allowlist, but the recording itself is whatever the collector wrote,\n  and is the reviewer's to read before it is pushed.\n- The local API takes one upload, as bytes with the project and file name\n  in headers, up to 32 MB. Everything else it takes is still JSON.\n","relates":{},"source":"adr/0014-a-recording-is-kept-beside-the-code-and-lays-what-it-showed-over-the-flow.md","created":{"commit":"014b5d70a13621a0189563c7a00b220dfb5292a7","author":"Victor Login","date":"2026-09-12T12:35:04+07:00"}},{"id":"portolan.0015","slug":"portolan-0015-a-rule-on-a-field-is-read-into-the-catalog-in-one-vocabulary","number":15,"title":"A rule on a field is read into the catalog, in one vocabulary","status":"accepted","date":"2026-09-12","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA schema says more about a field than its type. A proto carries\nProtovalidate options - `(buf.validate.field).string.min_len = 1`,\n`required = true`, an `in` list on a currency - and an OpenAPI document\ncarries the same facts as JSON Schema keywords: `minLength`, `required`,\n`pattern`. These are the first things a caller wants to know after the\ntype, and the catalog dropped them. `extract-proto` read past an aggregate\noption and left a note saying so; `extract-openapi` kept only whether a\nfield was required, and kept it by writing \"Optional.\" in front of the\ndescription, where it was text rather than a fact.\n\nEventCatalog's protobuf viewer (event-catalog/eventcatalog#2878) started\nshowing Protovalidate rules and custom options by parsing the raw `.proto`\nin the browser. portolan does not hold raw schemas on the page: an\nextractor reads a source into a fragment, and the page renders the model.\nSo the question is where a rule lives in the model, and in whose words.\n\n## Decision Drivers\n\n- The model is one for every source (portolan.0001): a page must not know\n  whether a field came from a proto or an OpenAPI document to show what\n  it must satisfy.\n- What a reader compares against is the source: a bound must be shown as\n  it was written, and a 64-bit bound must not pass through a float.\n- A custom option the catalog has no words for is still a fact about the\n  field; hiding it is how a reader ends up in the raw file.\n- Regenerating from the same sources must change no byte (portolan.0010).\n\n## Considered Options\n\n1. **Rules on the field, in the catalog's own vocabulary.** A field gains\n   `required` and a list of `{name, value}` rules; each extractor maps its\n   source's spelling to one set of names.\n2. **Rules on the field, spelled as the source spells them.** The same\n   list, with `minLength` from OpenAPI and `min_len` from Protovalidate.\n3. **Parse the source on the page.** Keep the raw schema in the fragment\n   and read the options in the browser, as EventCatalog does.\n4. **Leave rules in the documentation.** Extractors fold a rule into the\n   field's doc text, as `extract-openapi` did with \"Optional.\".\n\n## Decision Outcome\n\nChosen option: **rules on the field, in the catalog's own vocabulary.**\n\nA field carries `required` when the source says the field must be sent -\na Protovalidate `required`, a name in a JSON Schema `required` list - and\nnothing when the source does not say, since in proto3 and OpenAPI alike\nthat means it may be left out. It carries `rules`, in the order the source\nwrote them, each a name and the bound as text: `min_len`, `max_len`,\n`len`, `pattern`, `prefix`, `suffix`, `contains`, `not_contains`,\n`format`, `gt`, `gte`, `lt`, `lte`, `const`, `in`, `not_in`,\n`multiple_of`, `min_items`, `max_items`, `unique`, `min_pairs`,\n`max_pairs`, `defined_only`, `lt_now`, `gt_now`, `cel`. A rule on what a\nlist holds is prefixed `items.`; on a map's keys or values, `keys.` or\n`values.`.\n\n`extract-proto` reads every field option, one per leaf of an aggregate\nbody, and maps `(buf.validate.field)` onto that vocabulary: the type\nsegment of the path is dropped, since the field's type is already known;\na well-known string shape spelled as a bool - `email = true` - becomes\n`format email`; `ignore`, `example` and a CEL rule's id and message say\nhow a rule is checked, not what it is, and are not rules. Any other\ncustom option - `(acme.pii) = true` - is kept under the name the source\ngave it, so a reader sees that the field is annotated rather than\nfinding out in the raw file. Protobuf's own options - `deprecated`,\n`json_name`, `packed` - are the wire's, not rules.\n\n`extract-openapi` maps the validation keywords onto the same names and\nsets `required` from the list instead of prefixing the description; a\n`$ref` property carries the target's keywords, and an array's `items` one\nlevel down. `format` and `enum` stay in the type, where they already were.\n\nThe page shows each rule as a short mark beside the type - \"≥ 1 chars\",\n\"one of USD, EUR\", \"uuid\" - and keeps the spelling for the tooltip. The\nmarkdown site adds a Rules column to a field table when any field has\none.\n\n### Consequences\n\nA caller reading an event or a request sees what must be sent and what a\nvalue must satisfy, from either source, in one form. The Go mirror gains\na type and two fields; `extract-proto` stops noting aggregate options it\nnow reads.\n\nA field's `required` is a flag only when true; the \"Optional.\" prefix is\ngone from OpenAPI descriptions, and a reader who wants the negative reads\nthe absence, as they would in the document.\n\nOption 2 makes the page carry a synonym table, and a third source a third\ncolumn of it. Option 3 keeps rules out of the model, where a check cannot\nsee them and the markdown site cannot print them, and puts a proto parser\non the page. Option 4 is what was there: a fact as text, invisible to\nanything that is not a reader.\n\nWhat the vocabulary does not yet carry is left as it came: a rule name\nthe page has no words for is shown spelled as the fragment has it. Java's\nvalidation annotations, Django's `max_length` and Laravel's rules are the\nnext sources to map, onto these names.\n","relates":{},"source":"adr/0015-a-rule-on-a-field-is-read-into-the-catalog-in-one-vocabulary.md","created":{"commit":"58731ceb16abfe1954a681d23efa951d15f52099","author":"Victor Login","date":"2026-09-12T13:31:58+07:00"}},{"id":"portolan.0016","slug":"portolan-0016-a-problem-is-a-rule-with-a-passport-and-a-new-one-is-written-in-cel-over-one-subject","number":16,"title":"A problem is a rule with a passport, and a new one is written in CEL over one subject","status":"accepted","date":"2026-09-12","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nThe Problems page was made of seventeen checks written in TypeScript across\nfive readers. A check had a kind and a severity and nothing else a reader\ncould hold: no name to refer to it by, no words on what it looked for or\nwhat to do about a row, no way to switch it off for an estate that shares\none database by design, and no way to add one. An estate whose rule was\n\"every event has a consumer by the end of the quarter\" had no place to\nwrite it down where the page would enforce it.\n\nWarnings from the extractors had already been given ids and a CEL policy\nin `portolan.json` (`warningPolicies`) - typed, checked when the manifest\nis read, evaluated at generation and written into the build report, so a\ndeployed site receives decisions and not an expression runtime. Problems\nare not warnings: they are computed in the browser from the merged catalog\non every load, because the catalog is what they are about and nothing about\nthem is a fact worth a fragment.\n\n## Decision Drivers\n\n- A rule a reader cannot see is a rule they cannot trust or argue with.\n- Switching a check off is a decision about the estate, and belongs in the\n  manifest with a reason, next to the other decisions about the estate.\n- Half the checks walk the graph - who else writes this table, where a\n  column's value came from, which two services publish on one channel. A\n  predicate over one row cannot make them.\n- The manifest already has CEL, and a second expression language would be\n  one too many.\n- A rule should run where the reader is, over the catalog they are looking\n  at, and the page should say what a rule would produce before it is saved.\n\n## Considered Options\n\n1. **Built-in checks stay code with a passport in a file; new rules are CEL\n   over one subject; every rule is applied in the browser.**\n   `rules/builtin.json` names each reader's kind with a subject, a severity,\n   a title, the words on the row, a description and an action; a test holds\n   the file and the readers' kinds equal. `problemRules` in the manifest\n   switches or re-grades a built-in rule by id, with a reason, or declares a\n   rule of its own: `over` names a subject - service, event, channel, table,\n   deployment, flow, aggregate, call - and `when` and `message` are CEL over a flat, typed\n   view of one such row and `estate`, the names the catalog answers to. The\n   expressions are type-checked when the manifest is read and again in the\n   page, by one module. The Settings page lists every rule with the rows it\n   produces, and writes the manifest through the local API after the same\n   check.\n2. **Rewrite the built-in checks as CEL.** A shared store is \"another\n   service's access to a table whose store this service owns\" - a join over\n   two lists the row does not carry. Giving the expression the whole catalog\n   makes every rule a program, and a slow one, and the seventeen readers\n   already exist and are tested.\n3. **Evaluate rules at generation, like `warningPolicies`, into a fragment.**\n   Consistent with the rule that a deployed site gets decisions. But the\n   readers already run in the browser, a switch on the page would take a\n   build to show, and a rule being written could not show what it matches\n   until it had been saved and generated. The site would carry both the\n   findings and the decisions about them, and the two could disagree.\n4. **Rules per browser, in local storage.** Nothing to commit and nothing to\n   review; a rule switched off is switched off for one person, and the\n   published page still shows the rows the estate agreed to hide.\n\n## Decision Outcome\n\nOption 1.\n\nThe readers are unchanged in what they find. What they return is a finding\n- kind, severity, ends, words - and the registry turns findings into\nproblems: a finding whose rule is off is dropped, one whose rule is\nre-graded takes the new severity, and the manifest's own rules add their\nrows after, each stamped with the rule's id. The Problems page, the\nsidebar's badge, the overview and the landing subscribe to the rules in\nforce, so a switch flipped on the Settings page is visible on the next\nrender and nothing is rebuilt.\n\nA rule of the manifest's own reads one subject - a service, an event, a\nchannel, a table, a deployment, a flow, an aggregate or a call - as a flat record - strings,\nints, bools and lists of strings, the fields listed in\n`src/lib/problem-rules-cel.mjs` - and `estate`, so `call.peer in\nestate.services` is a rule and `event.consumers.exists(c, c in\nestate.services)` is one. It does not read the catalog. A check that needs\nthe graph is a reader in TypeScript with a passport, which is what the\nseventeen are, and what the next one will be when a predicate will not do.\n\nThe CEL environment is one module, plain JavaScript, imported by the\nmanifest loader under Node and by the page in the browser, so that a\nmanifest `gen` accepts is a manifest the page runs, and the error under the\ntext box is the error `gen` prints. The evaluator is in the bundle now,\nwhich is the cost of option 1 over option 3, and is accepted: the page\nalready computes the problems it shows, and the expressions it runs are\nthe estate's own, checked twice.\n\n### Consequences\n\n- `Problem` carries `rule`; readers return `Finding`. The Problems page\n  filters by rule, and every row's words link to the rule on the Settings\n  page.\n- `rules/builtin.json` is part of the package. A new reader adds a kind to\n  `PROBLEM_KINDS` and a passport to the file, or the test fails.\n- `problemRules` is in the schema in two shapes under one `id`: a built-in\n  id may carry `enabled`, `severity` and `reason` and nothing else; any\n  other id must carry `over`, `when`, `message` and `title`. A disabled\n  built-in rule needs a reason.\n- The local API reads and writes `problemRules` with a revision of the\n  file, through the same `writeManifest` every other local change uses, so\n  the file keeps its shape and a stale page cannot overwrite a hand edit.\n- A deployed site carries the CEL evaluator and the manifest's rules, and\n  applies them on load. `warningPolicies` are unchanged: they are about the\n  build, and the build is where they run.\n- A rule that fails on one row - a type the check did not foresee - fails as\n  a rule: its rows are absent and the page says so, rather than showing a\n  list that is short by an unknown number.\n","relates":{},"source":"adr/0016-a-problem-is-a-rule-with-a-passport-and-a-new-one-is-written-in-cel-over-one-subject.md","created":{"commit":"d4edf2f167f71a72c9b61c62274b94c98fed4e4c","author":"Victor Login","date":"2026-09-12T13:41:54+07:00"},"revised":{"commit":"2e17e4f5a406a1504b2e1b783ab08bab64434257","author":"Victor Login","date":"2026-09-12T17:14:32+07:00"}},{"id":"portolan.0017","slug":"portolan-0017-every-problem-rule-is-cel-over-a-row-that-already-carries-its-joins","number":17,"title":"Every problem rule is CEL over a row that already carries its joins","status":"accepted","date":"2026-09-12","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nportolan.0016 gave every problem a rule with a passport, let the manifest\nswitch and re-grade the shipped rules, and let an estate write rules of its\nown in CEL over one subject. It kept the seventeen shipped checks as code,\nwith this argument: half of them walk the graph - who else writes this\ntable, who else publishes on this channel, what the provider's copy of an\ninterface says - and a predicate over one row cannot make that walk.\n\nThat left two kinds of rule on one page. A shipped rule showed a passport\nand a link to a file; a rule of the estate's own showed its condition. A\nreader could not see what a shipped rule checked in the terms the page\nhad taught them, could not copy one to make a stricter version, and had to\ntake the passport's prose as the rule. The page said \"rules\" and meant two\nthings.\n\n## Decision Drivers\n\n- One kind of rule: what is shipped and what the estate writes should be\n  the same shape, read the same way, and be copied from one to the other.\n- The argument in 0016 was about where the join happens, not whether a\n  rule can be an expression.\n- The seventeen checks have tests that hold each to a fixture; whatever\n  replaces them must pass the same tests.\n- A row should link where it linked, and say what it said.\n\n## Considered Options\n\n1. **Move the joins into the subject rows; write every shipped rule in\n   CEL.** A subject's projection computes, once per row, the facts a rule\n   would have joined for: a table's `aggregateOwner`, a column's `fkOwner`\n   and `foreignFrom`, a channel's `otherPublishers`, a call's `peerKnown`\n   and `methodDeclared`, a copy's `differences`. The projection is code\n   and says what is; the rule is CEL and says what should not be. Three\n   subjects are added for rows the old readers produced that no existing\n   subject had - `consumer`, `column`, `copy`, `subscription` - and the\n   five readers are deleted, their tests re-pointed at the rules.\n2. **Keep the readers, generate their CEL for display.** The page would\n   show an expression nobody runs, which is worse than a link to a file.\n3. **CEL over the whole catalog.** Rejected in 0016 and still: every rule\n   becomes a program over nested lists, slow and unreadable, and the type\n   check that catches `event.nme` today cannot follow it.\n\n## Decision Outcome\n\nOption 1.\n\n`rules/builtin.json` carries eighteen rules, each with `over`, `when`,\n`message` and `peer` beside its passport - seventeen from the readers and\none, `cross-service-view`, split out of `cross-service-lineage` because a\nview reading another service's relation is a row about the view, not about\na column, and a rule is over one subject. The manifest's entries for a\nshipped rule are what they were: `enabled`, `severity`, `reason`. A rule of\nthe estate's own reads the same rows with the same fields, so the shipped\n`shared-store` is one line a reader can copy and tighten.\n\nThe projections live in `src/lib/problem-subjects.ts` and keep the\nreaders' judgement calls as fields, not conditions: a projection table is\nnot a second writer, so `role` is on the row and the rule says\n`table.role != 'projection'`; a narrowed copy may omit fields, so\n`differences` lists only what it carries and disagrees on. A row's id and\nsource are what the reader's were - a channel row is its first event when\nthe service has one on the address and the service otherwise - so every\nrow leads where it led.\n\nGranularity moved in two places, both accepted. A copied value with\nseveral foreign sources is one row with the sources joined, not one row a\nsource; a subscriber met by several publishers of different encodings is\none row naming the first. The fixture has neither.\n\n### Consequences\n\n- `Problem` has `rule` and no `kind`; there is no `Finding`. What was\n  `derive.ts`'s `problems()` and the four `*-problems.ts` readers is gone,\n  and `driftLines` moved to `deployment-drift.ts`.\n- `builtinProblems(catalog, index, ids?)` runs the shipped rules for a\n  test; the readers' tests are `rules-*.test.ts` and pass unchanged in\n  what they assert.\n- Every rule on the Settings page shows its CEL on the row. A shipped\n  rule's condition is the one that runs.\n- A new check is a projection field, if the row lacks one, and a line in\n  `rules/builtin.json`. The test that every shipped rule type-checks over\n  its subject and runs clean on the fixture holds it.\n- The subject schema is larger, and part of the manifest's contract: a\n  field removed from a projection is a manifest rule that stops\n  type-checking. Fields are added, not renamed.\n","relates":{},"source":"adr/0017-every-problem-rule-is-cel-over-a-row-that-already-carries-its-joins.md","created":{"commit":"855fbb7b31774a90f6ac3998356b0b438e253427","author":"Victor Login","date":"2026-09-12T18:03:33+07:00"}},{"id":"portolan.0018","slug":"portolan-0018-a-gateway-route-contributes-hosts-only-through-a-valid-attachment","number":18,"title":"A Gateway Route contributes hosts only through a valid attachment","status":"accepted","date":"2026-09-14","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nPortolan reads Kubernetes names to distinguish providers of the same HTTP or\ngRPC route (portolan.0011). The first Gateway API reader treated an HTTPRoute,\nGRPCRoute or TLSRoute as an ingress by itself: when one of its backendRefs named\na Service, every hostname on the Route was added to that Service.\n\nA Route is not an entry point by itself. It has to name a Gateway in parentRefs,\nthe Gateway has to accept the Route on a listener, and the listener and Route\nhostnames have to intersect. Namespace boundaries add two different handshakes:\nallowedRoutes controls Route-to-Gateway attachment, while ReferenceGrant\ncontrols a Route referring to a Service in another namespace. Ignoring those\nrelationships can publish a hostname on which the service is not reachable.\n\n## Decision Drivers\n\n- A host used to resolve an ambiguous call must be proven, not inferred from an\n  unattached Route.\n- Manifest and live-cluster readers must apply the same rules.\n- The catalog needs the reachable name, not a second model of the Kubernetes\n  control plane.\n- Kubernetes Secrets and certificate references must remain unread.\n- A namespace-scoped cluster read must not silently widen the workload scope.\n\n## Decision Outcome\n\nA Gateway API hostname contributes to `service.hosts` only through the complete\nRoute -\u003e Gateway listener -\u003e Service relationship.\n\nThe reader resolves HTTPRoute and GRPCRoute, and TLSRoute when its experimental\nCRD is available. It applies parentRef defaults, sectionName and port listener\nselection, protocol and allowed kind compatibility, allowedRoutes namespace\nrules, and listener/Route hostname intersection. A cross-namespace backendRef\nto a Service is accepted only when a ReferenceGrant in the Service namespace\nallows that Route kind and source namespace.\n\n`GatewayClass`, policies, listener status and controller-specific resources do\nnot become catalog entities. They do not add a name that an application calls.\nThe readers use declarative configuration, not status conditions, so a manifest\nand the same objects returned by a cluster produce the same answer.\n\nFor `fetch-k8s`, `namespaces` remains the set whose workloads are emitted.\n`gatewayNamespaces` may additionally name namespaces holding shared Gateways or\nRoutes; only Gateway API and Namespace metadata is read there. When namespaces\nis omitted the existing all-namespaces read already covers both.\n\nNamespace objects are read only for labels used by allowedRoutes selectors.\nSecrets are still never requested. TLS certificateRefs and every other value\nthat does not become a hostname are ignored.\n\n## Consequences\n\nAn unattached Route, a listener with no hostname intersection, a disallowed\nnamespace, and an ungranted cross-namespace backend no longer create false\nhosts. A Route without hostnames can inherit a concrete listener hostname.\n\nThe Go manifest extractor and JavaScript cluster reader keep separate\nimplementations because they run in different environments. A shared table of\nGateway API object graphs and expected hosts holds their behavior together.\n\nTCPRoute and UDPRoute carry no hostname, so they do not affect `service.hosts`.\nGateway addresses and status conditions may be added later if the catalog needs\nto distinguish desired attachment from controller-observed reachability.\n","relates":{},"source":"adr/0018-a-gateway-route-contributes-hosts-only-through-a-valid-attachment.md","created":{"commit":"4e46949b143c1554c1638ec58753c0f40b540260","author":"Victor Login","date":"2026-09-14T15:04:27+07:00"}},{"id":"portolan.0019","slug":"portolan-0019-a-branch-draft-is-generated-in-dev-compared-from-its-merge-base-and-saved-beside-main","number":19,"title":"A branch draft is generated in dev, compared from its merge-base and saved beside main","status":"accepted","date":"2026-09-15","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA catalog built from main shows the estate as it is. A feature branch that adds\na flow, an event or a call to another system is invisible until it merges, and\nthe review of what it does to the architecture happens in a diff of source\nfiles rather than in the catalog a reader already knows.\n\nShowing a branch next to main raises three questions the catalog cannot answer\nby itself: which catalog the branch has, what the branch changed as opposed to\nwhat main changed since the branch was cut, and where that answer lives so a\npublished static site can show it without a server.\n\n## Decision Drivers\n\n- The reader compares a branch with main in the pages they already use, not on\n  a separate page with its own vocabulary.\n- A change main made after the branch was cut must not be shown as the\n  branch's change.\n- A published catalog is static; nothing can generate on the reader's request.\n- A branch is regenerated with the extractors of the checkout that generates\n  it, so a draft never needs a plugin build per branch.\n- One repository holds many projects, and a branch is reviewed per project.\n\n## Considered Options\n\n- Compare the branch's committed fragments with main in the browser, loading\n  them from the forge at runtime.\n- Generate the branch in CI and read the result from a pipeline artifact.\n- Generate the branch in `portolan dev` against its merge-base and save the\n  result as a file in the repository.\n\n## Decision Outcome\n\nChosen: generate in `portolan dev` and save the draft beside main.\n\nA draft is one file per project and branch. `portolan dev` resolves the\nbranch's tip and `git merge-base` with main, checks both out as detached\nworktrees, runs the project's extract steps in each, and compares the two\ncatalogs entity by entity. What the branch did - added, changed, removed - is\nwritten with the base version and the branch version of every entity it\ntouched, together with the branch, its tip and the base. The LikeC4 views of\nthe flows the branch touched are generated in the branch worktree and saved in\nthe same file, so the site renders them with the renderer it already has.\n\nThe site overlays a saved draft on the catalog it is built from. An entity main\nchanged since the draft's base, and the branch changed too, is a conflict and\nshows both versions. A draft is shown only when the reader ticks it, and the\nversion on screen is part of the address (`?v=\u003cbranch\u003e`). Every page reads the\nbranch's version of its entity in the catalog's own shape and marks what\ndiffers on the rows it already has; a page of its own is used only where there\nis nothing in main to lay the branch over.\n\nA draft stays until someone deletes it. The site does not track whether the\nbranch merged or still exists; `portolan dev` reports a branch that moved past\nthe saved tip, that failed to regenerate, or that is gone.\n\n### Consequences\n\n- Good: the branch is read in the flow, event, aggregate and service pages the\n  reader already knows, including on a static site.\n- Good: the merge-base keeps main's own progress out of the branch's changes,\n  and makes a conflict with main something that can be shown.\n- Good: no forge token, CI minutes or artifact download stands between a reader\n  and a draft.\n- Bad: a draft is as fresh as its last generation; nothing refreshes it when\n  the branch moves.\n- Bad: a draft generated with the current extractors does not show a change the\n  branch makes to an extractor itself.\n- Bad: saved drafts are files in the repository and have to be deleted by hand.\n- Neutral: flow steps at the base and on the branch are paired by what they\n  do - their ends, kind and call - rather than by their positional ids, so a\n  step inserted near the top reads as one added step rather than a renumbered\n  flow. Extractors keep their ids as they are.\n","relates":{},"source":"adr/0019-a-branch-draft-is-generated-in-dev-compared-from-its-merge-base-and-saved-beside-main.md","created":{"commit":"e183e551e2109a50ecba5796565b5da32c46168a","author":"Victor Login","date":"2026-09-15T11:49:28+07:00"},"revised":{"commit":"af83021e63e9c22be8fab4f73a616ed3faf78140","author":"Victor Login","date":"2026-09-15T11:53:47+07:00"}},{"id":"portolan.0020","slug":"portolan-0020-task-links-are-read-from-the-history-never-written-into-a-fragment","number":20,"title":"Task links are read from the history, never written into a fragment","status":"accepted","date":"2026-09-15","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nThe work-items verifier connects a task to what it changed: a commit whose\nmessage names `SHO-7` touched a flow's source file, so the flow shows `SHO-7`,\nand the task's card lists that commit, its subject, author, date and paths.\nThe verifier wrote those links into a fragment under `portolan-work-items/`,\nand the fragment was committed like any other.\n\nThat is the record portolan.0010 took out of fragments, under another name. A\nlink names the commits that mention the task, and a file cannot name the\ncommit it lands in. A commit that changes a flow for `SHO-7` and carries the\nregenerated catalog, as portolan.0010 asks, adds itself to the links the moment\nit is made: `gen --check` is red on the commit that regenerated everything. A\nsecond commit catches up only if its message names no task; if it names one,\nit links itself and the check never agrees. A rebase moves every hash and the\nlinks go stale again. Every task landed so far needed a regeneration commit\nthat was careful not to say what it was for.\n\n## Decision Drivers\n\n- A commit that changes a source for a task, with the catalog regenerated in\n  the same commit, passes `gen --check` (kept from portolan.0010).\n- The reader sees the task on the flows, steps, services and decisions it\n  changed, including for the commit just made.\n- Catalog profiles keep choosing which estates show which verifier's links,\n  with the configuration the settings page already writes.\n- A plugin knows no clock and no repository for provenance (portolan.0002,\n  portolan.0010); the work-items scan reads a repository by design, and stays\n  the only code that does.\n\n## Considered Options\n\n1. **The history's.** Nothing is generated; whoever reads the catalog asks the\n   history which commits name which tasks, as it asks when a source changed.\n2. **Leave out the commits that touch the output.** A commit carrying its\n   regenerated links would not link itself.\n3. **Keep writing the fragment, and leave it out of `gen --check`.**\n\n## Decision Outcome\n\nChosen option: **the history's**.\n\nThe verifier's `run` writes nothing, and a fragment written by an earlier\nversion is swept by the next generation. `scanWorkItems` does what `run` did:\nit reads the checkout's history against the merged catalog and returns the\nlinks as a fragment in memory. `scripts/work-items-history.mjs` calls it for\nevery work-items verifier the manifest declares, where the catalog is read:\n\n- the site gets the links from the virtual module `virtual:portolan-work-items`,\n  built at build time and re-read under the dev server when a source changes,\n  the same as `virtual:portolan-provenance`;\n- each verifier's links keep the path the settings page writes\n  (`\u003cout\u003e/\u003cfile\u003e`), and a catalog profile shows them when its sources match\n  that path, as before;\n- a full scan from the settings page is a reading without the commit limit\n  for that verifier until the dev server stops, and runs no generation.\n\nOption 2 drops exactly the commits that follow the rule: a commit that changes\na flow for a task and regenerates the catalog touches the output, so the task\nwould never be linked to the change it describes. Option 3 keeps a file that is\nwrong on every commit that matters, and a check that looks away from it checks\nnothing.\n\n### Consequences\n\n- Good: a task's commit is one commit. `gen --check` is green on it, a rebase\n  changes nothing on disk, and a regeneration commit may say what it is for.\n- Good: the links are never older than the checkout; the commit just made shows\n  after a dev server restart or the next change to a source.\n- Bad: reading task links needs git and the whole catalog where the site is\n  built. The build reads the history for provenance already, and the Pages\n  workflow fetches the full history for it.\n- Bad: the generator's outputs - the markdown pages, LikeC4, exports - carry no\n  task links. None drew them.\n- Neutral: explicit links authored as catalog fragments are unchanged; they\n  name no commit, and stay files.\n","relates":{},"source":"adr/0020-task-links-are-read-from-the-history-never-written-into-a-fragment.md","created":{"commit":"6dd9a041d7abb604001aa87cec3dfbea268715b1","author":"Victor Login","date":"2026-09-15T19:41:09+07:00"}},{"id":"portolan.0021","slug":"portolan-0021-an-inferred-http-verb-links-a-call-at-medium-confidence","number":21,"title":"An inferred HTTP verb links a call, at medium confidence","status":"accepted","date":"2026-09-15","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA Django URLConf proves a path, and often nothing about the verb: a view\nmounted as a plain function answers every verb Django routes to it.\n`extract-django` reads the verb from what the code declares - decorators,\n`http_method_names`, a branch on `request.method`, a project wrapper - and,\nwhen none of those speaks, infers it from what the handler reads off the\nrequest: `request.POST`, `request.FILES`, `request.body` or `request.read()`\nmean POST, `request.GET` alone means GET.\n\nThe catalog had no way to say a verb was inferred. So the extractor kept the\ninferred verb out of `provides` and left `http.method` empty there, carrying\nit only in the OpenAPI export as `x-portolan-verb: inferred`. The merge\nmatches an outbound `http-client/\u003cVERB\u003e \u003cpath\u003e` call against `provides` by\nverb and path, and never against an empty verb, so a caller of such a route\nstayed unresolved. On one real estate four routes were affected: two proxy\nGETs and two upload POSTs.\n\n## Decision Drivers\n\n- A call that plainly reaches a route should link; an unresolved call on\n  Problems that everyone knows the answer to trains readers to ignore it.\n- A guess must not read as a declaration, on the route or on the link.\n- The status vocabulary - verified, declared, unresolved - is read by the\n  problem rules, the map and every chip; a fourth value costs all of them.\n- A declared route, and every committed fragment, must read as it did.\n\n## Considered Options\n\n1. **The route carries the verb with its basis; the link keeps status\n   `declared` and lowers its resolution confidence.**\n2. **A new status, `inferred`,** on the call and the step.\n3. **Keep the verb out of `provides`** and leave such calls unresolved.\n4. **Write the verb into `provides` as if declared.**\n\n## Decision Outcome\n\nChosen option: **1.**\n\nAn `HttpRoute` gains `methodBasis` - absent reads `declared`, `inferred` is a\nverb no declaration names - and, for an inferred verb, `methodEvidence`: the\nrule and where it was read, `{rule: \"reads request.FILES\", source:\n\"geo/views.py:64\"}`. Validation refuses an inferred basis with no verb or no\nevidence. The field is the same shape as `basis` elsewhere in the catalog:\nwho said so, with the default left unwritten.\n\nThe merge treats an inferred verb as a candidate like any other; an empty verb\nstill never is. A link made on one keeps status `declared`, because the route\nit names is declared by the URLConf, and its `destination.resolution` carries\n`confidence: medium` with the provider's `methodEvidence`. A link on a\ndeclared verb writes no confidence, which reads `high`, and so every existing\nresolution is unchanged. `confidence` uses the vocabulary a flow trigger and\na composition seam already use; `extract-django` already set its trigger to\n`medium` for the same inference. When two fragments give the same method a\nroute on the same path, a declared verb replaces an inferred one, and either\nreplaces an empty one.\n\nThe page shows the lowered confidence and the reading in the step's HTTP\ndestination evidence, and a \"verb inferred\" mark beside the route on the\nservice's contract; generated Markdown says the same.\n\nOption 2 was rejected because the uncertainty is in one part of one match, not\nin whether the relationship is stated by source: the call site is read, the\nroute is mounted. A status would move every such edge out of the declared set\nthat the map and the problem rules count, for a fact the resolution can carry.\nOption 3 left a known link unresolved. Option 4 made a guess indistinguishable\nfrom a decorator.\n\nA call that uses a different verb from the inferred one still does not link,\nthough Django would route it: the inference names the verb the handler is\nwritten for, and a caller using another one is worth a look. A unique-suffix\nmatch is also a heuristic and writes no confidence yet; it keeps saying so\nthrough its basis.\n","relates":{},"source":"adr/0021-an-inferred-http-verb-links-a-call-at-medium-confidence.md","created":{"commit":"1a91a71e422ecf63e7f5b681d805945dcff860b8","author":"Victor Login","date":"2026-09-15T23:16:59+07:00"}},{"id":"portolan.0022","slug":"portolan-0022-the-site-toolchain-is-optional-and-ships-as-its-own-image-tag","number":22,"title":"The site toolchain is optional, and the image that needs it ships as its own tag","status":"accepted","date":"2026-09-16","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\n`ghcr.io/shortlink-org/portolan:0.6.2` was 830 MB compressed, near 4 GB on\ndisk. A pipeline that runs `portolan check` on every merge request pulls that\nimage, and what it pulls is mostly things the command never opens: the full\nNode image carries a C toolchain nothing here compiles with, the JDK carries\nthe tools to build a JDK, and `node_modules` carries vite, React, LikeC4,\nmermaid and the icon sets the browsable site draws with.\n\nOnly `build` and `dev` load that last group. `generate`, `check`, `diff` and\n`comment` read a workspace, run extractors and write fragments; between them\nthey need a JSON schema validator, a CEL evaluator, a TypeScript parser and an\nEventBridge client. The package declared all of it as one dependency list, so\nan image that only ever checks a catalog installed the site as well.\n\nA plugin looked like the thing to move out, because plugins are what the image\nis for. They are not what it weighs: the wasm module, the Rust binary and the\nJava classes together are under 2% of the compressed image.\n\n## Decision Drivers\n\n- The command a pipeline runs on every merge request should pull as little as\n  possible.\n- A catalog is generated in a pipeline far more often than a site is built.\n- What the image installs must be exactly what the commands in it run, and\n  the ones it cannot serve must say so.\n- A developer running `npm install` still gets every command, without\n  remembering a flag.\n- Nothing may be fetched from the network at run time that was not fetched at\n  build time: a generated catalog is a build output, and a pipeline that\n  reaches GitHub for a plugin is a pipeline that fails when GitHub does.\n\n## Considered Options\n\n- Download the plugins from GitHub releases on first use and ship none of\n  them.\n- Keep one image and trim only what is not a dependency: the base image and\n  the JDK.\n- Declare the site toolchain optional, publish the image without it, and\n  publish a second tag that has it.\n\n## Decision Outcome\n\nChosen: the site toolchain is optional, and the image that needs it is its own\ntag.\n\n`dependencies` holds what every command needs. `optionalDependencies` holds\nvite, React, LikeC4 and what they draw with. An `npm install` still brings\nboth, because npm installs optional dependencies by default; only an\ninstallation that opts out skips them, and the container image is the one that\ndoes. Asked for a site it has not got, the CLI names what is missing and where\nto get it rather than failing on a module it cannot resolve, and `portolan\ndoctor` reports the toolchain the way it reports Go, Python and Java.\n\nThe Dockerfile has two targets. `runtime` is published under the version tags\nand holds what generate, check, diff and comment read. `site` is the same\nimage with the optional toolchain installed on top, published as `-site`, and\nthe GitLab Pages preset asks for that tag. Because one is a layer over the\nother, a registry stores the difference once.\n\nThe image drops what it was carrying for nobody. The base is `node:24-slim`,\nsince no dependency is compiled and the compilers that are needed live in\nbuild stages. The Java extractor reads sources through\n`javax.tools.JavaCompiler`, so it keeps `jdk.compiler` - a JRE would not do -\nbut as a `jlink` runtime of that module and `java.base` alone rather than a\nfull JDK. Type declarations and source maps are deleted after install, and\n`.dockerignore` mirrors the build output `.gitignore` keeps out of the\nrepository, so a developer's checkout does not put a local binary in the\nimage.\n\nDownloading plugins was rejected on its own terms: it trades a run-time\nnetwork dependency for about 2% of the image. What is expensive about a plugin\nis the toolchain it runs in, not the plugin.\n\n### Consequences\n\n- Good: the tag a pipeline pulls on every merge request went from 830 MB to\n  185 MB compressed, and the tag that builds a site to 319 MB.\n- Good: the image installs what its commands run, and a command it cannot\n  serve says which tag can.\n- Good: nothing is fetched at run time that was not fetched at build time.\n- Bad: two tags are published per release, and a Pages job that names the\n  wrong one fails at `build` rather than at pull.\n- Bad: `npm install --omit=optional` leaves an installation that cannot build\n  a site, and the flag is one a user may pass for unrelated reasons.\n- Neutral: `npm ci --omit=optional` cannot be used to produce the smaller\n  tree, because it drops every optional dependency in the tree - including the\n  platform bindings a native package declares that way, without which the\n  TypeScript extractor does not load. The image removes the optional\n  dependencies from `package.json` and installs from the lockfile instead.\n","relates":{},"source":"adr/0022-the-site-toolchain-is-optional-and-ships-as-its-own-image-tag.md","created":{"commit":"8cb3a3b4bdbe15cd0ad1f5b3611945acb15be630","author":"Victor Login","date":"2026-09-16T16:07:13+07:00"}},{"id":"portolan.0023","slug":"portolan-0023-the-rules-the-code-checks-are-held-against-the-rules-the-document-promises","number":23,"title":"The rules the code checks are held against the rules the document promises","status":"accepted","date":"2026-09-16","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nSince portolan.0015 a rule on a field arrives in one vocabulary whatever\nsource it came from: `min_len`, `format uuid`, `in USD, EUR`. `extract-proto`\nand `extract-openapi` read them off a contract, `extract-django` off a model,\nand `extract-ts` now reads them off the zod schema a handler parses a request\nwith.\n\nThat last one is different in kind. A proto and an OpenAPI document are what a\ncaller is promised; a zod schema is what the service will actually refuse. A\nservice that has both has said two things about one field, and the catalog\nheld them apart: the document's word on the interface's request message, the\ncode's word on the operation the handler runs. Nothing anywhere said when the\ntwo disagree.\n\nThe disagreement is a real defect on both sides of the arrow. `cart`'s\ndocument says `AddItemRequest.sku` is a string; its handler refuses an empty\none. A caller written to the document, generated from it, or tested against\nit, gets a 400 nothing documented. The other direction is worse in a quieter\nway: a document that promises `maxLength` the handler never checks sends the\nvalue on to something that did not expect it.\n\n## Decision Drivers\n\n- A projection says what is, a rule says what should not be (portolan.0017):\n  the comparison belongs on a row, the judgement in CEL, and neither in an\n  extractor.\n- Nothing about a problem is written into a fragment (portolan.0016), and the\n  two sides arrive from two different extractors that first meet at the merge.\n  Whatever compares them has to run over the merged catalog.\n- Neither side is the authority. The catalog does not know whether the bound\n  in the code is the truth the document is behind on, or a check nobody meant\n  to keep; a row that named a culprit would be guessing.\n- Only what both sides say about the same field can be compared. A route's\n  path parameter is in no body message; a field the document carries and this\n  handler never parses is another operation's or another layer's.\n- The one vocabulary is what makes any of this possible: a source whose rules\n  the catalog does not yet map is silent here, not wrong.\n\n## Considered Options\n\n1. **A subject the rule reads: `operation`, carrying the differences, with a\n   shipped rule `rules-drift` over it.** The row says which field's rules\n   differ and how, in both sides' words; the rule says that a difference is\n   worth a reader's time, and the estate can switch it off or re-grade it like\n   any other.\n2. **Compare at generation and write the drift into a fragment.** A fragment\n   would carry a judgement, and the extractor that writes it sees one side of\n   the comparison only.\n3. **Have the extractor warn.** `extract-ts` reads the schemas and the\n   document's operationIds, so it could - but not the document's shapes, which\n   `extract-openapi` reads, and a service whose contract is a proto in another\n   repository is out of its reach entirely.\n4. **Pick a side: generate the document from the schemas, or fail a build\n   where they differ.** A good practice, and a decision about one codebase\n   rather than something a catalog of many can take. A service that already\n   does it has no rows here, which is the point.\n\n## Decision Outcome\n\nChosen option: **1.**\n\n`operation` joins the subjects a rule may be written over: one row per use\ncase of an aggregate, with its kind, what exposes it, the fields its handler\nchecks, the contract and method a caller reads it as, how many fields both\nsides name, and `ruleDifferences` - one line per disagreement, in the order\nthe handler states its fields.\n\nThe comparison is over the fields both sides name, and over three things about\neach: a rule only the handler has, a rule only the document has, and a rule\nboth have with different bounds. `required` is compared the same way, since\n\"must be sent\" is the first rule a caller wants. Each line says both words and\nnames neither as wrong - `sku: the handler checks min_len = 1, the document\nsays nothing` - and the row's far end is the contract, so the reader can open\nwhat the caller reads.\n\nThe shipped rule is a warning: `size(operation.ruleDifferences) \u003e 0`. An\noperation whose handler parses nothing has no fields and no rows; so has one\nnothing exposes, or one whose method declares no request shape.\n\n#### Consequences\n\nA defect that was in neither half of the catalog - each side correct on its\nown, the pair wrong together - is now a row on the Problems page, next to the\nservice that owns both halves. The example estate shows two of them, both\nreal: `cart`'s `sku`, and the two fields `mergeBaskets` checks and its\ndocument does not.\n\nThe rule grows with the vocabulary rather than with the sources. Laravel's\nrules and Java's validation annotations map onto the same names\n(portolan.0015); when they do, the same rule holds those services to their\ndocuments with nothing new written.\n\nAn operation has no page of its own, so the row lands on the aggregate that\nhandles it, as the palette's entry for a command already does.\n\nWhat is not compared is what neither side can be held to: the type, which the\n`column-type` and `proto-drift` rules already own where it is a wire claim; a\nrule inside a nested schema a field only names; and a field one side names\nalone, which is a question about shapes rather than about bounds.\n","relates":{},"source":"adr/0023-the-rules-the-code-checks-are-held-against-the-rules-the-document-promises.md","created":{"commit":"346b30a53a319b3be7414ecc377dd9833474e1b3","author":"Victor Login","date":"2026-09-16T16:59:02+07:00"}},{"id":"portolan.0024","slug":"portolan-0024-a-path-across-services-is-composed-in-the-reading-not-in-the-catalog","number":24,"title":"A path across services is composed in the reading, not in the catalog","status":"accepted","date":"2026-09-16","scope":{"kind":"context","context":"portolan"},"body":"## Context and Problem Statement\n\nA flow stops where its service stops. `cart-checkout` ends by publishing\n`BasketCheckedOut`; what happens next is `oms`'s flow, and after that\n`ledger`'s. The catalog has known where one ends and the next begins since\ncontinuations were added — a step's `continuesAt`, its `reaches`, a handoff's\ntransport and channel, a shared event — and the rail said so with a link:\n*continues in Place order on basket checked out*. The reader clicked it, and\nthe thread they were following stayed on the page behind them.\n\nThat is the common question and the expensive one. In the example estate a\ncheckout crosses four services; in a real one read into portolan — five avia\nservices, 343 flows — half of the 316 outbound calls have a flow on the other\nside, and the other half end at a system outside the estate, correctly.\nAnswering \"and then what?\" three times in a row meant three pages, three\ncanvases and nothing that held them together.\n\n## Decision Drivers\n\n- The catalog is what the sources say. A path that crosses four services is\n  not a fact any one of them states: it is an inference made by pairing a\n  step with a flow, and the pairing already carries its own confidence.\n- A composed flow written into a fragment would be a fifth service's claim\n  about four other services' code, regenerated whenever any of them changed.\n- A reading is worth sharing. Whatever the reader opened has to survive being\n  pasted into a chat.\n- 343 flows in one estate, median two steps: opening everything for everybody\n  would make the common page worse to pay for the rare one.\n- Following forever is not following: a service that calls back into its\n  caller is a cycle, and four services deep the reader is asking a different\n  question from the one they opened.\n\n## Considered Options\n\n1. **Compose in the reading.** `flow/journey.ts` takes the rail's rows and,\n   under a step the reader opened, splices the rows of the flow it continues\n   in — indented, marked with whose they are, and keyed by the door they came\n   through. What is open lives in the address. Closed by default.\n2. **Compose at generation, into the catalog.** The model already has the\n   shape for it: `Flow.includes` and `Flow.composition` record fragments\n   spliced into a root flow with the seam that proved each one. Composing\n   across services would make one flow out of four services' code.\n3. **A page of its own: the journey as an entity.** A third kind of page\n   beside flows and services, listing end-to-end paths.\n4. **Leave the link.** What was there.\n\n## Decision Outcome\n\nChosen option: **1.**\n\nA journey is a reading of the catalog, built where it is read. `journey.ts`\nis pure: rows in, rows out, with two guards that say so on the row rather\nthan stopping quietly — a flow already on the path reads *already on this\npath*, and the f
