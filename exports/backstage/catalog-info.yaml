spec:
    definition: |-
        {
          "id": "storefront.v1.Viewer",
          "messages": [
            {
              "name": "Viewer",
              "fields": [
                {
                  "name": "userId",
                  "type": "ID",
                  "doc": ""
                },
                {
                  "name": "expiresAt",
                  "type": "DateTime",
                  "doc": "When the session stops being live."
                }
              ]
            }
          ],
          "methods": [
            {
              "name": "Query.viewer",
              "doc": "Who the request belongs to, or null when it belongs to nobody.\n\nThere is no `login` here. Sessions are minted by auth and nowhere else, and\na BFF that took a password would be a second place credentials go.",
              "response": "Viewer"
            }
          ],
          "module": ""
        }
    lifecycle: production
    owner: shortlink-org/platform
    system: storefront
    type: portolan
