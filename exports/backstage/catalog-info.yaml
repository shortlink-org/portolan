    description: Interface provided by Authentication & Sessions
    annotations:
        backstage.io/source-location: url:https://github.com/shortlink-org/portolan/blob/main/examples/auth/internal/transport/http/gen/openapi.yaml
        portolan.io/id: auth.v1
spec:
    definition: |-
        {
          "id": "auth.v1",
          "messages": [
            {
              "name": "RegisterRequest",
              "fields": [
                {
                  "name": "email",
                  "type": "string (email)",
                  "doc": ""
                },
                {
                  "name": "password",
                  "type": "string (password)",
                  "doc": ""
                }
              ]
            },
            {
              "name": "User",
              "fields": [
                {
                  "name": "userId",
                  "type": "string",
                  "doc": ""
                },
                {
                  "name": "email",
                  "type": "string (email)",
                  "doc": ""
                },
                {
                  "name": "createdAt",
                  "type": "string (date-time)",
                  "doc": ""
                }
              ]
            },
            {
              "name": "Error",
              "fields": [
                {
                  "name": "message",
                  "type": "string",
                  "doc": "One sentence, always present. A client that shows the user a single\nline shows this one."
                },
                {
                  "name": "reasons",
                  "type": "[]string",
                  "doc": "Optional. One entry per rule the request broke, present only where rules\napply - a 404 or a 500 has none. Each entry names its own field, so\nit can be shown on its own without knowing what it referred to."
                }
              ]
            },
            {
              "name": "ChangePasswordRequest",
              "fields": [
                {
                  "name": "currentPassword",
                  "type": "string (password)",
                  "doc": ""
                },
                {
                  "name": "newPassword",
                  "type": "string (password)",
                  "doc": ""
                }
              ]
            },
            {
              "name": "LoginRequest",
              "fields": [
                {
                  "name": "email",
                  "type": "string (email)",
                  "doc": ""
                },
                {
                  "name": "password",
                  "type": "string (password)",
                  "doc": ""
                }
              ]
            },
            {
              "name": "Session",
              "fields": [
                {
                  "name": "token",
                  "type": "string",
                  "doc": ""
                },
                {
                  "name": "expiresAt",
                  "type": "string (date-time)",
                  "doc": ""
                }
              ]
            },
            {
              "name": "SessionInfo",
              "fields": [
                {
                  "name": "userId",
                  "type": "string",
                  "doc": ""
                },
                {
                  "name": "expiresAt",
                  "type": "string (date-time)",
                  "doc": ""
                }
              ]
            }
          ],
          "methods": [
            {
              "name": "registerUser",
              "request": "RegisterRequest",
              "response": "User",
              "http": {
                "method": "POST",
                "path": "/v1/users"
              }
            },
            {
              "name": "getUser",
              "response": "User",
              "http": {
                "method": "GET",
                "path": "/v1/users/{userId}"
              }
            },
            {
              "name": "changePassword",
              "request": "ChangePasswordRequest",
              "response": "204",
              "http": {
                "method": "POST",
                "path": "/v1/users/me/password"
