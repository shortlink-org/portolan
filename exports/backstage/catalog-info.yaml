    description: Interface provided by Storefront BFF
    annotations:
        backstage.io/source-location: url:https://github.com/shortlink-org/portolan/blob/main/examples/bff/src/schema/order/schema.graphql
        portolan.io/id: storefront.v1.Order
spec:
    definition: |-
        {
          "id": "storefront.v1.Order",
          "messages": [
            {
              "name": "QueryOrderArgs",
              "fields": [
                {
                  "name": "id",
                  "type": "ID",
                  "doc": ""
                }
              ]
            },
            {
              "name": "SubscriptionOrderStatusArgs",
              "fields": [
                {
                  "name": "id",
                  "type": "ID",
                  "doc": ""
                }
              ]
            },
            {
              "name": "Order",
              "fields": [
                {
                  "name": "id",
                  "type": "ID",
                  "doc": ""
                },
                {
                  "name": "state",
                  "type": "OrderState enum(PLACED | CONFIRMED | CANCELLED)",
                  "doc": ""
                },
                {
                  "name": "lines",
                  "type": "[]Line",
                  "doc": ""
                },
                {
                  "name": "total",
                  "type": "Money",
                  "doc": "What the customer agreed to at checkout, and not a penny recomputed since."
                },
                {
                  "name": "placedAt",
                  "type": "DateTime",
                  "doc": ""
                }
              ]
            },
            {
              "name": "CancelOrderInput",
              "fields": [
                {
                  "name": "id",
                  "type": "ID",
                  "doc": ""
                },
                {
                  "name": "reason",
                  "type": "String",
                  "doc": "Optional."
                }
              ]
            },
            {
              "name": "OrderMoved",
              "fields": [
                {
                  "name": "orderId",
                  "type": "ID",
                  "doc": ""
                },
                {
                  "name": "state",
                  "type": "OrderState enum(PLACED | CONFIRMED | CANCELLED)",
                  "doc": ""
                },
                {
                  "name": "at",
                  "type": "DateTime",
                  "doc": ""
                }
              ]
            },
            {
              "name": "Line",
              "fields": [
                {
                  "name": "sku",
                  "type": "String",
                  "doc": ""
                },
                {
                  "name": "quantity",
                  "type": "Int",
                  "doc": ""
                },
                {
                  "name": "unitPrice",
                  "type": "Money",
                  "doc": ""
                }
              ]
            },
            {
              "name": "Money",
              "fields": [
                {
                  "name": "amountMinor",
                  "type": "Int",
                  "doc": ""
                },
                {
                  "name": "currency",
                  "type": "String",
                  "doc": "ISO 4217, upper case."
                }
              ]
            }
          ],
          "methods": [
            {
              "name": "Query.order",
              "doc": "The order, or null when the storefront has never been told of one.",
              "request": "QueryOrderArgs",
              "response": "Order"
            },
            {
              "name": "Mutation.cancelOrder",
              "doc": "Cancel an order that has not been dispatched. Cancelling twice is not an error.",
              "request": "CancelOrderInput",
              "response": "Order"
            },
            {
              "name": "Subscription.orderStatus",
              "doc": "Every move an order makes, until it stops moving.\n\nThe storefront does not poll the order service for this: the moves are on\nthe bus already, and this is the same events, forwarded to whoever is\nwatching this order.",
              "request": "SubscriptionOrderStatusArgs",
              "response": "OrderMoved",
              "streaming": "server"
            }
          ],
          "module": ""
        }
    lifecycle: production
    owner: shortlink-org/platform
    system: storefront
    type: portolan
