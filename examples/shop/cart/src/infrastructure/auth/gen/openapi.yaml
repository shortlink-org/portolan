# A narrowed copy of auth's contract, kept beside the client generated from it
# (ADR org.0001): the one operation the cart calls and the shapes it needs.
openapi: 3.0.3
info:
  title: auth
  version: 1.0.0
paths:
  /v1/sessions/current:
    get:
      operationId: validateSession
      summary: Resolve the bearer token to a live session
      tags: [sessions]
      security:
        - bearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session is live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401":
          description: No live session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SessionInfo:
      type: object
      required: [userId, expiresAt]
      properties:
        userId: { type: string }
        expiresAt: { type: string, format: date-time }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
