# The API, and the only place it is described. The server's types are
# generated from this file; the catalog reads it as the interface
# `cart.v1.Baskets`; the reasoning behind a route is in docs/adr.
openapi: 3.0.3
info:
  title: cart
  version: 1.0.0
  description: >-
    The basket between a customer arriving and an order existing. An anonymous
    basket is changed by whoever holds its token (cart.0007); checkout and
    merge need a signed-in customer (cart.0004).

tags:
  - name: baskets

paths:
  /v1/baskets:
    post:
      operationId: createBasket
      tags: [baskets]
      summary: Create an empty basket for a visitor
      responses:
        "201":
          description: The basket, and the token that owns it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasketCreated" }

  /v1/baskets/{basketId}:
    parameters:
      - $ref: "#/components/parameters/basketId"
    get:
      operationId: getBasket
      tags: [baskets]
      summary: The basket as it stands
      security:
        - basketToken: []
        - bearerAuth: []
      responses:
        "200":
          description: The basket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Basket" }
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/baskets/{basketId}/items:
    parameters:
      - $ref: "#/components/parameters/basketId"
    post:
      operationId: addItem
      tags: [baskets]
      summary: Add a line, or increment one already there
      description: >-
        The price is captured as sent and never recomputed (cart.0003). The
        first line sets the basket's currency; a line in another currency is
        refused (cart.0002).
      security:
        - basketToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddItemRequest" }
      responses:
        "200":
          description: The basket after the add
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Basket" }
        "400":
          $ref: "#/components/responses/Invalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Refused"

  /v1/baskets/{basketId}/items/{sku}:
    parameters:
      - $ref: "#/components/parameters/basketId"
      - name: sku
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: removeItem
      tags: [baskets]
      summary: Remove a line outright
      security:
        - basketToken: []
        - bearerAuth: []
      responses:
        "200":
          description: The basket after the removal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Basket" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Refused"

  /v1/baskets/{basketId}/merge:
    parameters:
      - $ref: "#/components/parameters/basketId"
    post:
      operationId: mergeBaskets
      tags: [baskets]
      summary: Move a visitor's lines into this customer's basket
      description: Every line or none (cart.0005). The visitor's basket is marked merged.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MergeRequest" }
      responses:
        "200":
          description: The customer's basket after the merge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Basket" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Refused"

  /v1/baskets/{basketId}/checkout:
    parameters:
      - $ref: "#/components/parameters/basketId"
    post:
      operationId: checkout
      tags: [baskets]
      summary: Freeze the basket and hand it on
      description: >-
        Confirms the session with auth and the total with pricing, then freezes
        the basket and publishes BasketCheckedOut (cart.0004).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The frozen basket, with the quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckedOut" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Refused"
        "502":
          description: A peer did not answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  parameters:
    basketId:
      name: basketId
      in: path
      required: true
      schema: { type: string, format: uuid }

  securitySchemes:
    basketToken:
      type: apiKey
      in: header
      name: X-Basket-Token
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    Invalid:
      description: The request does not satisfy a rule of the basket
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such basket, or not yours
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Refused:
      description: The basket is not open, or the change would break a rule
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No live session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: { type: integer, format: int64, description: Amount in the minor unit of the currency. }
        currency: { type: string, description: ISO 4217 code, upper case. }

    LineItem:
      type: object
      required: [sku, quantity, unitPrice]
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unitPrice: { $ref: "#/components/schemas/Money" }

    Basket:
      type: object
      required: [basketId, status, items, touchedAt]
      properties:
        basketId: { type: string, format: uuid }
        customerId: { type: string, description: Present once the basket belongs to a signed-in customer. }
        currency: { type: string, description: Set by the first line; absent while the basket is empty. }
        status: { type: string, enum: [open, checked-out, abandoned, merged] }
        items:
          type: array
          items: { $ref: "#/components/schemas/LineItem" }
        subtotal: { $ref: "#/components/schemas/Money" }
        touchedAt: { type: string, format: date-time }

    BasketCreated:
      type: object
      required: [basketId, token]
      properties:
        basketId: { type: string, format: uuid }
        token: { type: string, description: The capability to change this basket; sent back as X-Basket-Token. }

    AddItemRequest:
      type: object
      required: [sku, quantity, unitPrice]
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unitPrice: { $ref: "#/components/schemas/Money" }

    MergeRequest:
      type: object
      required: [fromBasketId, fromToken]
      properties:
        fromBasketId: { type: string, format: uuid }
        fromToken: { type: string }

    CheckedOut:
      type: object
      required: [basketId, quoteId, total]
      properties:
        basketId: { type: string, format: uuid }
        quoteId: { type: string, description: The quote pricing issued; the order is placed against it. }
        total: { $ref: "#/components/schemas/Money" }

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
