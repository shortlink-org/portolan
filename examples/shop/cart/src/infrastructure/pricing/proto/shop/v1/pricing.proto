// A narrowed copy of pricing's contract, kept beside the client generated from
// it (ADR org.0001): the one rpc the cart calls.
syntax = "proto3";

package shop.v1;

// Pricing prices a basket: promotions and tax included, against the lines it
// is given.
service Pricing {
  // GetQuote answers with the total the customer is about to be charged.
  rpc GetQuote(GetQuoteRequest) returns (GetQuoteResponse);
  // RedeemCoupon says whether a coupon is good for these lines, and the
  // discount it gives. Accepted is false for an unknown or spent coupon.
  rpc RedeemCoupon(RedeemCouponRequest) returns (RedeemCouponResponse);
}

message Money {
  int64 amount_minor = 1;
  string currency = 2;
}

message LineItem {
  string sku = 1;
  int32 quantity = 2;
  Money unit_price = 3;
}

message GetQuoteRequest {
  string basket_id = 1;
  repeated LineItem lines = 2;
}

message GetQuoteResponse {
  string quote_id = 1;
  Money total = 2;
}

message RedeemCouponRequest {
  string basket_id = 1;
  string code = 2;
  repeated LineItem lines = 3;
}

message RedeemCouponResponse {
  bool accepted = 1;
  string code = 2;
  Money discount = 3;
}
