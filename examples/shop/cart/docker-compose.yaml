# The database the service runs against locally, on a port of its own so it
# can run beside auth's, and the collector it sends spans to when TRACER_URI
# names it - see telemetry/README.md.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cart
      POSTGRES_PASSWORD: cart
      POSTGRES_DB: cart
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cart -d cart"]
      interval: 1s
      timeout: 3s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.126.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./telemetry/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ./telemetry/out:/out
    ports:
      - "4327:4317"
