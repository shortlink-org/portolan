# What runs cart in the shop namespace. portolan reads this tree for the
# names the service answers on and the in-cluster names it dials; the values
# themselves stay here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: shop
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/part-of: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        app.kubernetes.io/part-of: shop
    spec:
      containers:
        - name: cart
          image: ghcr.io/shortlink-org/cart:2.1.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PRICING_ADDR
              value: pricing.shop.svc:9090
            - name: AUTH_URL
              value: http://auth.auth.svc:8080
            - name: NATS_URL
              value: nats://nats.shop.svc:4222
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: cart-session
                  key: secret
            - name: NODE_ENV
              value: production
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: shop
spec:
  selector:
    app.kubernetes.io/name: cart
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cart
  namespace: shop
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /cart
            pathType: Prefix
            backend:
              service:
                name: cart
                port:
                  name: http
