[project]
name = "billing"
version = "0.1.0"
description = "Invoices against an order, for the portolan example estate."
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    # The estate's shared event package: the signals other services publish,
    # which is how a receiver here names one it did not declare.
    "shop-events>=1.0",
]

[project.urls]
repository = "https://github.com/shortlink-org/portolan"
