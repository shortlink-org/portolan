# The database the models are the schema of, the broker the tasks go through,
# the service in front of them and the worker behind.
services:
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports: ["5436:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing"]
      interval: 5s

  billing:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DATABASE_URL: postgres://billing:billing@db:5432/billing
      AUTH_URL: http://auth:8080
      CELERY_BROKER_URL: redis://redis:6379/0
    ports: ["8004:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker -Q billing,billing.mail
    environment:
      DATABASE_URL: postgres://billing:billing@db:5432/billing
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
