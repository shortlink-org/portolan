# The database the models are the schema of, and the service in front of it.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports: ["5436:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing"]
      interval: 5s

  billing:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DATABASE_URL: postgres://billing:billing@db:5432/billing
      AUTH_URL: http://auth:8080
    ports: ["8004:8000"]
    depends_on:
      db:
        condition: service_healthy
