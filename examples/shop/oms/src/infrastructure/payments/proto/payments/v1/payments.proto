// Consumer-owned subset of ledger's PaymentService. Field numbers, types and
// reserved fields match the provider; verify with the checkout contract test.
syntax = "proto3";
package payments.v1;

service PaymentService {
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
}
message AuthorizeRequest {
  string payment_id = 1;
  string order_id = 2;
  int64 amount_minor = 3;
  string currency = 4;
}
message AuthorizeResponse {
  string payment_id = 1;
  reserved 2;
  reserved "auth_code";
  bool authorized = 3;
  string reason = 4;
}
