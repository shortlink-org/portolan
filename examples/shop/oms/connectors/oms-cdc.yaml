apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: oms-cdc
  labels:
    strimzi.io/cluster: platform-connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: oms-postgres
    database.port: 5432
    database.user: debezium
    # platform-connect enables KubernetesSecretConfigProvider as "secrets".
    database.password: ${secrets:shop/oms-postgres:password}
    database.dbname: oms
    plugin.name: pgoutput
    topic.prefix: shop.oms
    table.include.list: public.orders,public.order_lines
    snapshot.mode: initial
    schema.name.adjustment.mode: avro
    key.converter: io.confluent.connect.avro.AvroConverter
    key.converter.schema.registry.url: http://schema-registry.platform.svc:8081
    value.converter: io.confluent.connect.avro.AvroConverter
    value.converter.schema.registry.url: http://schema-registry.platform.svc:8081
    tombstones.on.delete: false
