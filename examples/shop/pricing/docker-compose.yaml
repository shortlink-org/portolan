# The database the migrations build, and the service in front of it.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pricing
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
    ports: ["5438:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing"]
      interval: 5s

  pricing:
    build: .
    environment:
      DATABASE_URL: postgres://pricing:pricing@db:5432/pricing
      GRPC_ADDR: ":9093"
      NATS_URL: nats://nats:4222
    ports: ["9093:9093"]
    depends_on:
      db:
        condition: service_healthy
