# The database the migrations build, the bus the events travel on, and the
# service in front of both.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pricing
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
    ports: ["5438:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing"]
      interval: 5s

  nats:
    image: nats:2.14-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 1s
      timeout: 3s
      retries: 30

  pricing:
    build: .
    environment:
      DATABASE_URL: postgres://pricing:pricing@db:5432/pricing
      GRPC_ADDR: ":9093"
      NATS_URL: nats://nats:4222
    ports: ["9093:9093"]
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
