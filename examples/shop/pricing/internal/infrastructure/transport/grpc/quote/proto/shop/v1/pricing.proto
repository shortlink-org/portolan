syntax = "proto3";

package shop.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/shortlink-org/portolan/examples/shop/pricing/internal/infrastructure/transport/grpc/quote/gen/shop/v1;pricingv1";

// What a basket costs, and for how long.
//
// Pricing is asked; it never decides what to buy. A quote is a promise with a
// moment attached, and after that moment it is gone rather than stale.
service Pricing {
  // Price a basket and promise the price for a window.
  rpc IssueQuote(IssueQuoteRequest) returns (IssueQuoteResponse);

  // Read a quote, by its own id or by the basket it priced.
  rpc GetQuote(GetQuoteRequest) returns (GetQuoteResponse);
}

message IssueQuoteRequest {
  // The basket being priced. Pricing never invents one.
  string basket_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  // ISO 4217, upper case: the shop quotes in one currency per basket.
  string currency = 2 [(buf.validate.field).string = { len: 3, pattern: "^[A-Z]{3}$" }];
  // An empty basket has no price to promise.
  repeated Item items = 3 [(buf.validate.field).repeated.min_items = 1];
}

message Item {
  string sku = 1 [(buf.validate.field).string.min_len = 1];
  int32 quantity = 2 [(buf.validate.field).int32.gt = 0];
}

message IssueQuoteResponse {
  string quote_id = 1;
  int64 total_minor = 2;
  string currency = 3;
  string expires_at = 4;
}

message GetQuoteRequest {
  string quote_id = 1;
  string basket_id = 2;
}

message GetQuoteResponse {
  string quote_id = 1;
  string basket_id = 2;
  int64 total_minor = 3;
  string currency = 4;
  string state = 5;
  string expires_at = 6;
}
