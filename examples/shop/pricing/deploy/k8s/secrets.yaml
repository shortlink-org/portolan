# A Secret is never opened by portolan: not its data, not its stringData,
# whatever the values look like. This one is a placeholder for the sealed
# copy a real cluster would hold.
apiVersion: v1
kind: Secret
metadata:
  name: pricing-database
  namespace: shop
type: Opaque
stringData:
  url: postgres://pricing:change-me@pricing-db.shop.svc:5432/pricing
