# The database the migrations build, and the service in front of it.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports: ["5437:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s

  ledger:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ledger
      NATS_URL: nats://nats:4222
      OMS_ADDRESS: oms:9090
    ports: ["9092:9092"]
    depends_on:
      db:
        condition: service_healthy
