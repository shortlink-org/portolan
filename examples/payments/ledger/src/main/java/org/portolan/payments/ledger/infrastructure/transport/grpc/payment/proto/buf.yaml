# The contract of the payment aggregate, and nothing else's: one module per
# aggregate, the way one migrations directory sits under one repository.
# Pushed by hand from this directory; until it is, the estate lists it as
# `local:payments/payment` and portolan.json says so.
version: v2
modules:
  - path: .
    name: buf.build/shortlink-org/portolan-payments-payment
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
