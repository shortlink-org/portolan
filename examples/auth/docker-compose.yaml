# The database the service runs against locally, and the cache it may use.
#
#   docker compose up -d
#   AUTH_DATABASE_URL=postgres://auth:auth@localhost:5432/auth?sslmode=disable go run ./cmd/auth
#
# The redis here is optional in the way the cache is: without CACHE_TYPE=redis
# the service never opens it, and everything works, more slowly.
#
# The tests do not use either of these: they start their own containers through
# testcontainers, so a test run cannot be affected by whatever state a local
# database happens to be in.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    healthcheck:
      # Without this, `docker compose up -d` returns while the server is still
      # starting and the first connection is refused.
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      # Mounted at /var/lib/postgresql, not .../data. Postgres 18 moved the
      # recommended mount point up one level so that pg_upgrade --link can work
      # across it; the image refuses to start against the old path.
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    # No volume, and that is the point rather than an omission: everything in
    # here can be worked out again from the database, and a cache that survived
    # a restart would be a cache nobody ever proves they can lose.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Optional, like redis: the service sends spans only when TRACER_URI names
  # this. The collector writes every span it receives to ./telemetry/out as
  # OTLP JSON, which is the file portolan reads to mark hops as observed - see
  # telemetry/README.md for the recording.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./telemetry/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ./telemetry/out:/out
    ports:
      - "4317:4317"

volumes:
  pgdata:
