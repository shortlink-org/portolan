# The one Application applied by hand. It deploys the AppProjects and the
# ApplicationSets from this repository; the ApplicationSets deploy the rest.
#
#   kubectl apply -f examples/gitops/bootstrap/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/shortlink-org/portolan.git
      targetRevision: main
      path: examples/gitops/bootstrap/projects
    - repoURL: https://github.com/shortlink-org/portolan.git
      targetRevision: main
      path: examples/gitops/appsets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
