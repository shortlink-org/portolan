# A narrow copy of Stripe's OpenAPI document, kept beside the adapter that
# calls it: the four operations the ledger uses and the schemas they answer
# with, every field verbatim from the original. Regenerate from
# https://github.com/stripe/openapi/blob/master/openapi/spec3.yaml when the
# version below moves; the narrowing is the only edit.
#
# x-portolan-api is what the estate calls this document, so the ledger's calls
# and this document's operations share one id: stripe.v1/<operationId>.
openapi: 3.0.0
info:
  title: Stripe API
  version: 2026-08-26.dahlia
  description: The Stripe REST API. Please see https://stripe.com/docs/api for more details.
  contact:
    email: dev-platform@stripe.com
    name: Stripe Dev Platform Team
    url: https://stripe.com
  termsOfService: https://stripe.com/us/terms/
  x-portolan-api: stripe.v1
servers:
  - url: https://api.stripe.com/
paths:
  /v1/payment_intents:
    post:
      description: Creates a PaymentIntent object. After the PaymentIntent is created, attach a payment method and confirm to continue the payment. Learn more about the available payment flows with the Payment Intents API. When you use confirm=true during creation, it’s equivalent to creating and confirming the PaymentIntent in the same call. You can use any parameters available in the confirm API when you supply confirm=true.
      operationId: PostPaymentIntents
      requestBody:
        content:
          application/x-www-form-urlencoded:
            encoding:
              metadata:
                explode: true
                style: deepObject
            schema:
              additionalProperties: false
              properties:
                amount:
                  description: Amount intended to be collected by this PaymentIntent. A positive integer representing how much to charge in the [smallest currency unit](https://docs.stripe.com/currencies#zero-decimal) (e.g., 100 cents to charge $1.00 or 100 to charge ¥100, a zero-decimal currency). The minimum amount is $0.50 US or [equivalent in charge currency](https://docs.stripe.com/currencies#minimum-and-maximum-charge-amounts). The amount value supports up to eight digits (e.g., a value of 99999999 for a USD charge of $999,999.99).
                  type: integer
                currency:
                  description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase. Must be a [supported currency](https://stripe.com/docs/currencies).
                  format: currency
                  type: string
                capture_method:
                  description: Controls when the funds will be captured from the customer's account.
                  enum:
                    - automatic
                    - automatic_async
                    - manual
                  type: string
                confirm:
                  description: Set to `true` to attempt to [confirm this PaymentIntent](https://docs.stripe.com/api/payment_intents/confirm) immediately. This parameter defaults to `false`. When creating and confirming a PaymentIntent at the same time, you can also provide the parameters available in the [Confirm API](https://docs.stripe.com/api/payment_intents/confirm).
                  type: boolean
                payment_method:
                  description: |-
                    ID of the payment method (a PaymentMethod, Card, or [compatible Source](https://docs.stripe.com/payments/payment-methods/transitioning#compatibility) object) to attach to this PaymentIntent.

                    If you omit this parameter with `confirm=true`, `customer.default_source` attaches as this PaymentIntent's payment instrument to improve migration for users of the Charges API. We recommend that you explicitly provide the `payment_method` moving forward.
                    If the payment method is attached to a Customer, you must also provide the ID of that Customer as the [customer](https://api.stripe.com#create_payment_intent-customer) parameter of this PaymentIntent.
                  maxLength: 5000
                  type: string
                description:
                  description: An arbitrary string attached to the object. Often useful for displaying to users.
                  maxLength: 1000
                  type: string
                metadata:
                  additionalProperties:
                    type: string
                  description: Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you can attach to an object. This can be useful for storing additional information about the object in a structured format. Individual keys can be unset by posting an empty value to them. All keys can be unset by posting an empty value to `metadata`.
                  type: object
              required:
                - amount
                - currency
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/payment_intent"
          description: Successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Error response.
      summary: Create a PaymentIntent
  /v1/payment_intents/{intent}/capture:
    post:
      description: Capture the funds of an existing uncaptured PaymentIntent when its status is requires_capture. Uncaptured PaymentIntents are cancelled a set number of days (7 by default) after their creation. Learn more about separate authorization and capture.
      operationId: PostPaymentIntentsIntentCapture
      parameters:
        - in: path
          name: intent
          required: true
          schema:
            maxLength: 5000
            type: string
          style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              additionalProperties: false
              properties:
                amount_to_capture:
                  description: The amount to capture from the PaymentIntent, which must be less than or equal to the original amount. Defaults to the full `amount_capturable` if it's not provided.
                  type: integer
              type: object
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/payment_intent"
          description: Successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Error response.
      summary: Capture a PaymentIntent
  /v1/payment_intents/{intent}/cancel:
    post:
      description: "You can cancel a PaymentIntent object when it’s in one of these statuses: requires_payment_method, requires_capture, requires_confirmation, requires_action or, in rare cases, processing. After it’s canceled, no additional charges are made by the PaymentIntent and any operations on the PaymentIntent fail with an error. For PaymentIntents with a status of requires_capture, the remaining amount_capturable is automatically refunded. You can directly cancel the PaymentIntent for a Checkout Session only when the PaymentIntent has a status of requires_capture. Otherwise, you must expire the Checkout Session."
      operationId: PostPaymentIntentsIntentCancel
      parameters:
        - in: path
          name: intent
          required: true
          schema:
            maxLength: 5000
            type: string
          style: simple
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              additionalProperties: false
              properties:
                cancellation_reason:
                  description: "Reason for canceling this PaymentIntent. Possible values are: `duplicate`, `fraudulent`, `requested_by_customer`, or `abandoned`"
                  enum:
                    - abandoned
                    - duplicate
                    - fraudulent
                    - requested_by_customer
                  maxLength: 5000
                  type: string
                  x-stripeBypassValidation: true
              type: object
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/payment_intent"
          description: Successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Error response.
      summary: Cancel a PaymentIntent
  /v1/refunds:
    post:
      description: When you create a new refund, you must specify a Charge or a PaymentIntent object on which to create it. Creating a new refund will refund a charge that has previously been created but not yet refunded. Funds will be refunded to the credit or debit card that was originally charged. You can optionally refund only part of a charge. You can do so multiple times, until the entire charge has been refunded. Once entirely refunded, a charge can’t be refunded again. This method will raise an error when called on an already-refunded charge, or when trying to refund more money than is left on a charge.
      operationId: PostRefunds
      requestBody:
        content:
          application/x-www-form-urlencoded:
            encoding:
              metadata:
                explode: true
                style: deepObject
            schema:
              additionalProperties: false
              properties:
                payment_intent:
                  description: The identifier of the PaymentIntent to refund.
                  maxLength: 5000
                  type: string
                amount:
                  type: integer
                reason:
                  description: String indicating the reason for the refund. If set, possible values are `duplicate`, `fraudulent`, and `requested_by_customer`. If you believe the charge to be fraudulent, specifying `fraudulent` as the reason will add the associated card and email to your [block lists](https://docs.stripe.com/radar/lists), and will also help us improve our fraud detection algorithms.
                  enum:
                    - duplicate
                    - fraudulent
                    - requested_by_customer
                  maxLength: 5000
                  type: string
                metadata:
                  anyOf:
                    - additionalProperties:
                        type: string
                      type: object
                    - enum:
                        - ""
                      type: string
                  description: Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you can attach to an object. This can be useful for storing additional information about the object in a structured format. Individual keys can be unset by posting an empty value to them. All keys can be unset by posting an empty value to `metadata`.
              type: object
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/refund"
          description: Successful response.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
          description: Error response.
      summary: Create a refund
components:
  schemas:
    payment_intent:
      description: |-
        A PaymentIntent guides you through the process of collecting a payment from your customer.
        We recommend that you create exactly one PaymentIntent for each order or
        customer session in your system. You can reference the PaymentIntent later to
        see the history of payment attempts for a particular session.

        A PaymentIntent transitions through
        [multiple statuses](/payments/paymentintents/lifecycle)
        throughout its lifetime as it interfaces with Stripe.js to perform
        authentication flows and ultimately creates at most one successful charge.

        Related guide: [Payment Intents API](https://docs.stripe.com/payments/payment-intents)
      properties:
        id:
          description: Unique identifier for the object.
          maxLength: 5000
          type: string
        object:
          description: String representing the object's type. Objects of the same type share the same value.
          enum:
            - payment_intent
          type: string
        amount:
          description: Amount intended to be collected by this PaymentIntent. A positive integer representing how much to charge in the [smallest currency unit](https://docs.stripe.com/currencies#zero-decimal) (e.g., 100 cents to charge $1.00 or 100 to charge ¥100, a zero-decimal currency). The minimum amount is $0.50 US or [equivalent in charge currency](https://docs.stripe.com/currencies#minimum-and-maximum-charge-amounts). The amount value supports up to eight digits (e.g., a value of 99999999 for a USD charge of $999,999.99).
          type: integer
        amount_capturable:
          description: Amount that can be captured from this PaymentIntent.
          type: integer
        amount_received:
          description: Amount that this PaymentIntent collects.
          type: integer
        capture_method:
          description: Controls when the funds will be captured from the customer's account.
          enum:
            - automatic
            - automatic_async
            - manual
          type: string
        currency:
          description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase. Must be a [supported currency](https://stripe.com/docs/currencies).
          format: currency
          type: string
        description:
          description: An arbitrary string attached to the object. Often useful for displaying to users.
          maxLength: 5000
          nullable: true
          type: string
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you can attach to an object. This can be useful for storing additional information about the object in a structured format. Learn more about [storing information in metadata](https://docs.stripe.com/payments/payment-intents/creating-payment-intents#storing-information-in-metadata).
          type: object
        status:
          description: Status of this PaymentIntent, one of `requires_payment_method`, `requires_confirmation`, `requires_action`, `processing`, `requires_capture`, `canceled`, or `succeeded`. Read more about each PaymentIntent [status](https://docs.stripe.com/payments/intents#intent-statuses).
          enum:
            - canceled
            - processing
            - requires_action
            - requires_capture
            - requires_confirmation
            - requires_payment_method
            - succeeded
          type: string
          x-stripeBypassValidation: true
      required:
        - id
        - object
        - status
      title: PaymentIntent
      type: object
      x-expandableFields:
        - amount_details
        - application
        - automatic_payment_methods
        - customer
        - hooks
        - last_payment_error
        - latest_charge
        - managed_payments
        - next_action
        - on_behalf_of
        - payment_details
        - payment_method
        - payment_method_configuration_details
        - payment_method_options
        - presentment_details
        - processing
        - review
        - shipping
        - transfer_data
      x-resourceId: payment_intent
    refund:
      description: |-
        Refund objects allow you to refund a previously created charge that isn't
        refunded yet. Funds are refunded to the credit or debit card that's
        initially charged.

        Related guide: [Refunds](https://docs.stripe.com/refunds)
      properties:
        id:
          description: Unique identifier for the object.
          maxLength: 5000
          type: string
        object:
          description: String representing the object's type. Objects of the same type share the same value.
          enum:
            - refund
          type: string
        amount:
          description: Amount, in cents (or local equivalent).
          type: integer
        currency:
          description: Three-letter [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase. Must be a [supported currency](https://stripe.com/docs/currencies).
          format: currency
          type: string
        metadata:
          additionalProperties:
            maxLength: 500
            type: string
          description: Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you can attach to an object. This can be useful for storing additional information about the object in a structured format.
          nullable: true
          type: object
        payment_intent:
          anyOf:
            - maxLength: 5000
              type: string
            - $ref: "#/components/schemas/payment_intent"
          description: ID of the PaymentIntent that's refunded.
          nullable: true
          x-expansionResources:
            oneOf:
              - $ref: "#/components/schemas/payment_intent"
        reason:
          description: Reason for the refund, which is either user-provided (`duplicate`, `fraudulent`, or `requested_by_customer`) or generated by Stripe internally (`expired_uncaptured_charge`).
          enum:
            - duplicate
            - expired_uncaptured_charge
            - fraudulent
            - requested_by_customer
          nullable: true
          type: string
          x-stripeBypassValidation: true
        status:
          description: Status of the refund. This can be `pending`, `requires_action`, `succeeded`, `failed`, or `canceled`. Learn more about [failed refunds](https://docs.stripe.com/refunds#failed-refunds).
          maxLength: 5000
          nullable: true
          type: string
      required:
        - amount
        - currency
        - id
        - object
      title: Refund
      type: object
      x-expandableFields:
        - balance_transaction
        - charge
        - customer
        - destination_details
        - failure_balance_transaction
        - next_action
        - payment_intent
        - payment_method
        - presentment_details
        - source_transfer_reversal
        - transfer_reversal
      x-resourceId: refund
    error:
      description: An error response from the Stripe API
      properties:
        error:
          $ref: "#/components/schemas/api_errors"
      required:
        - error
      type: object
    api_errors:
      description: ""
      properties:
        type:
          description: The type of error returned. One of `api_error`, `card_error`, `idempotency_error`, or `invalid_request_error`
          enum:
            - api_error
            - card_error
            - idempotency_error
            - invalid_request_error
          type: string
        code:
          description: For some errors that could be handled programmatically, a short string indicating the [error code](https://docs.stripe.com/error-codes) reported.
          maxLength: 5000
          type: string
        decline_code:
          description: For card errors resulting from a card issuer decline, a short string indicating the [card issuer's reason for the decline](https://docs.stripe.com/declines#issuer-declines) if they provide one.
          maxLength: 5000
          type: string
        message:
          description: A human-readable message providing more details about the error. For card errors, these messages can be shown to your users.
          maxLength: 40000
          type: string
        param:
          description: If the error is parameter-specific, the parameter related to the error. For example, you can use this to display a message near the correct form field.
          maxLength: 5000
          type: string
      required:
        - type
      title: APIErrors
      type: object
      x-expandableFields:
        - payment_intent
        - payment_method
        - setup_intent
        - source
