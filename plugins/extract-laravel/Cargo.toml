[package]
name = "portolan-extract-laravel"
version = "0.1.0"
edition = "2024"
description = "A Laravel application in, a catalog fragment out: the PHP twin of extract-django, on the same protocol."
publish = false

[lib]
name = "portolan_extract_laravel"
path = "src/lib.rs"

[[bin]]
name = "portolan-extract-laravel"
path = "src/main.rs"

[dependencies]
# Mago is the PHP toolchain written in Rust; its syntax crate is the one
# maintained PHP parser in this language that keeps up with the language, and
# the arena it parses into is dropped once a file has been read into the
# extractor's own shapes.
mago-syntax = "1.48"
mago-database = "1.48"
mago-allocator = "1.48"
mago-span = "1.48"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
